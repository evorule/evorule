[package]
name = "evorule-reactor"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Reactive fact-driven state transition engine with audit chain, time machine, and WAL"
readme = "README.md"
documentation = "https://docs.rs/evorule-reactor"
keywords = ["reactive", "audit", "rules-engine", "wal", "time-machine"]
categories = ["asynchronous", "data-structures", "concurrency"]
# Exclude development artifacts/verification scripts when publishing to crates.io (downstream dependency consumers do not need them)
exclude = [
    "collect_kani_artifacts.sh", # Kani verification artifact collection script
    "run_kani_proofs.sh",        # Kani verification run script
    "**/hash_snapshot.txt",      # Hash snapshots (development artifacts)
    "docs/",                     # Kani verification docs
    "verification/",             # Kani proofs + differential-testing sources (not needed downstream)
    "benches/",                  # Criterion performance-benchmark sources (dev-only)
    "include/",                  # C FFI headers (embedded users can take them as needed; not packaged by default)
    "tests/build_ffi.ps1",       # C FFI build script (PowerShell)
    "tests/test_evorule.c",      # C FFI integration-test source
    "hash_snapshots/",           # Hash snapshot directory
    "proptest-regressions/",     # proptest regression test case cache
    "rust-toolchain.toml",       # Development toolchain pinning
    "**/*.log",                  # Various runtime logs
    "install_log.txt",           # Tool installation log
]


[lints]
workspace = true
[dependencies]
evorule-tcb = { path = "../evorule-tcb", version = "0.13.0" }
evorule-audit-chain = { path = "../evorule-audit-chain", version = "0.13.0" }
tracing = "0.1"
serde_json = "1.0" # P0-1: WAL persistence serialization (Fact ↔ JSON)
# Audit-chain hash (two WALs merged: the hash chain promoted to tier1)
# Pure Rust implementation, supports musl static linking
blake3 = "1"

# H5: IoHandler trait object-safety — supports Arc<dyn IoHandler> dynamic dispatch
# Zero-cost macro; at runtime only one Box<dyn Future> allocation
async-trait = "0.1"

# WASM adaptation: tokio split by compile target — wasm32 does not support rt-multi-thread
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.0", features = ["sync", "rt", "rt-multi-thread", "time", "macros"] }

# wasm32 block (re-verified and corrected 2026-09-14, TB-WASM-004):
# - `time` must be kept; it is not a trimmable item. Production code src/reactor.rs:486
#   uses `tokio::time::timeout(self.io_timeout_check_interval, cmd_rx.recv())` in the
#   main loop `Reactor::run`; that call site has no wasm32 gating, so removing the
#   feature breaks the wasm32 build outright:
#     error[E0433]: cannot find `time` in `tokio`  --> src/reactor.rs:486:41
#   (verified with: after removing "time", run
#    `cargo build -p evorule-reactor --target wasm32-unknown-unknown --release`)
# - Keeping `time` only "lets the unreachable path compile"; it does not mean it is
#   usable on wasm32: the time driver depends on `std::time::Instant`, which
#   wasm32-unknown-unknown does not implement, so any **truly reachable** tokio
#   timing call under wasm32 panics at runtime.
#   The only current wasm32 entry, evorule-wasm-demo, uses the purely synchronous
#   subset: it builds no runtime and touches no timing APIs.
# - Discipline: new wasm32-reachable code must not use tokio::time / tokio::runtime;
#   otherwise that path must first be reworked to not depend on timing
#   (or push forward the design doc §9 scheme B "Runtime trait abstraction").
[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1.0", features = ["sync", "rt", "time", "macros"] }

[lib]
crate-type = ["lib", "cdylib"]

[features]
# Phase 7: Kani formal verification
#
# Actual gating uses `#[cfg(kani)]` (injected automatically by `cargo kani` via
# `--cfg kani`), consistent with the evorule-tcb/verification/kani_proofs.rs style;
# no --features kani needed. This feature is kept as a backward-compatibility marker;
# enabling it has no effect on proof compilation (proofs are under cfg(kani); a plain
# cargo build does not compile them).
#
# Run verification:
#   cargo kani -p evorule-reactor
#   cargo kani -p evorule-reactor --harness invariant_version_monotonic
kani = []
# Phase 9: C FFI interface
#
# When enabled, compiles a dynamic library exposing a C API for external languages.
# Build with `cargo build --features ffi --release`.
ffi = []
# WAL persistence
#
# When enabled, compiles the WAL module, supporting on-disk persistence of FactsLog.
# Embedded/robotics scenarios may disable it to reduce binary size.
# Build with `cargo build --features persistence`.
persistence = []

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }
# Formal verification: proptest property tests + differential testing (in the verification/ directory)
proptest = "1.4"
# Performance benchmarks (criterion) — 041 v2.0 A7: reactor main loop + FactsLog append baseline
# Dev dependency only; not part of release artifacts. benches/ is the official Rust location.
criterion = { version = "0.5", features = ["html_reports"] }

# 041 v2.0 A7: reactor end-to-end main-loop benchmark (spawn → command → Stable → exit)
[[bench]]
name = "reactor_e2e"
path = "benches/reactor_e2e.rs"
harness = false

# 041 v2.0 A7: FactsLog append throughput benchmark (in-memory mode, with hash-chain computation)
[[bench]]
name = "facts_log_append"
path = "benches/facts_log_append.rs"
harness = false

[[example]]
name = "generate_hashed_wal"
required-features = ["persistence"]

# Formal-verification test targets (in the verification/ directory, not the default tests/ directory)
# differential_test: P0-12 differential testing (reactor runtime vs execute_transition pure functions)
[[test]]
name = "differential_test"
path = "verification/differential_test.rs"

[package.metadata.kani]
# CI verification list (only proofs that reliably pass within the CI budget; kept in
# sync with the kani-reactor job of .github/workflows/kani.yml)
#
# Historical measurements (Kani 0.67.0, WSL Ubuntu 22.04, 2026-08-05): 10/11 PASS, 1/11 TIMEOUT
# v0.5.0 baseline rerun (2026-09-12): version_monotonic/max_rounds PASS (~10s / ~3s)
# P0-11/P1-5 entered the gate after the 2026-09-12 timeout root-cause fix
#   (locally measured 1.53s / 0.57s PASS; root cause and fix in verification/STATUS.md;
#   P0-11 without --default-unwind 4 — measured as ineffective for this proof;
#   P1-5 passes measured with unwind 4)
#
# The remaining 7 proofs are not in CI: the first 8 involve heap-allocated data
# structures (Vec/VecDeque/BTreeSet) and may be unstable across Kani versions; for CI
# reliability they were left out (historical measurements 2026-08-05):
#   - invariant_io_count_register_complete   (PASS 36s,  involves BTreeSet)
#   - invariant_io_count_force_remove        (TIMEOUT 609s, BTreeSet force_remove state explosion)
#   - invariant_io_recovery_iff_result       (PASS 45s,  involves Vec operations)
#   - command_does_not_decrease_queue        (PASS 23s,  involves VecDeque)
#   - proof_fact_log_append_monotonic        (PASS 56s,  involves Vec + hash chain)
#   - proof_reactor_invariants_preserved_after_pure_ops (PASS 16s, combined operations)
#   - proof_phase_state_machine_cannot_jump  (PASS 7s,   Phase state machine)
#
# See verification/README.md (verification asset registry) and docs/KANI.md for details
proofs = [
    "invariant_cause_queue_sync",  # cause-queue sync (P0-11, fixed and re-admitted 2026-09-12)
    "command_does_not_decrease_queue", # apply_command does not decrease the queue (P1-5, fixed and admitted 2026-09-12)
    "invariant_version_monotonic", # version monotonically increasing (simple counter)
    "max_rounds_termination",      # max_rounds termination condition (simple bounded loop)
    "proof_hash_chain_back_link",  # audit-chain hash integrity (P0-14, admitted 2026-10-21; standalone segment without unwind 4)
]
