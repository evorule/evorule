[package]
name = "evorule-reactor"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Reactive fact-driven state transition engine with audit chain, time machine, and WAL"
readme = "README.md"
documentation = "https://docs.rs/evorule-reactor"
keywords = ["reactive", "audit", "rules-engine", "wal", "time-machine"]
categories = ["asynchronous", "data-structures", "concurrency"]
# 发布到 crates.io 时排除开发产物/验证脚本（下游依赖消费者不需要）
exclude = [
    "collect_kani_artifacts.sh", # Kani 验证产物收集脚本
    "run_kani_proofs.sh",        # Kani 验证运行脚本
    "**/hash_snapshot.txt",      # 哈希快照（开发产物）
    "docs/",                     # KANI 验证文档
    "verification/",             # Kani 证明 + 差分测试源码（下游不需要）
    "benches/",                  # Criterion 性能基准源码（dev-only）
    "include/",                  # C FFI 头文件（嵌入式用户可按需自取，默认不打包）
    "tests/build_ffi.ps1",       # C FFI 构建脚本（PowerShell）
    "tests/test_evorule.c",      # C FFI 集成测试源码
    "hash_snapshots/",           # 哈希快照目录
    "proptest-regressions/",     # proptest 回归测试用例缓存
    "rust-toolchain.toml",       # 开发工具链固定
    "**/*.log",                  # 各类运行日志
    "install_log.txt",           # 工具安装日志
]


[lints]
workspace = true
[dependencies]
evorule-tcb = { path = "../evorule-tcb", version = "0.2.4" }
tokio = { version = "1.0", features = [
    "sync",
    "rt",
    "rt-multi-thread",
    "time",
    "macros",
] }
tracing = "0.1"
serde_json = "1.0" # P0-1: WAL 持久化序列化（Fact ↔ JSON）
# 审计链哈希（两套 WAL 合并：哈希链提升到 tier1）
# 纯 Rust 实现，支持 musl 静态链接
blake3 = "1"

# H5: IoHandler trait object-safety —— 支持 Arc<dyn IoHandler> 动态分发
# 零成本宏,运行时仅一次 Box<dyn Future> 分配
async-trait = "0.1"

[lib]
crate-type = ["lib", "cdylib"]

[features]
# 阶段7：Kani 形式化验证
#
# 实际门控用 `#[cfg(kani)]`（由 `cargo kani` 自动注入 `--cfg kani`），
# 与 evorule-tcb/verification/kani_proofs.rs 风格一致，无需 --features kani。
# 此 feature 保留作向后兼容标记，启用后对 proof 编译无影响
# （proof 在 cfg(kani) 下，普通 cargo build 不编译）。
#
# 运行验证：
#   cargo kani -p evorule-reactor
#   cargo kani -p evorule-reactor --harness invariant_version_monotonic
kani = []
# 阶段9：C FFI 接口
#
# 启用后编译生成动态链接库，暴露 C API 供外部语言调用。
# 使用 `cargo build --features ffi --release` 构建。
ffi = []
# WAL 持久化
#
# 启用后编译 WAL 模块，支持磁盘持久化 FactsLog。
# 嵌入式/机器人场景可禁用以减小二进制体积。
# 使用 `cargo build --features persistence` 构建。
persistence = []

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }
# 形式化验证:proptest 属性测试 + 差分测试(位于 verification/ 目录)
proptest = "1.4"
# 性能基准(criterion) — 041 v2.0 A7: reactor 主循环 + FactsLog append 基线
# 仅 dev 依赖,不进入 release 产物。benches/ 是 Rust 官方位置。
criterion = { version = "0.5", features = ["html_reports"] }

# 041 v2.0 A7: reactor 端到端主循环基准(spawn → 命令 → Stable → 退出)
[[bench]]
name = "reactor_e2e"
path = "benches/reactor_e2e.rs"
harness = false

# 041 v2.0 A7: FactsLog append 吞吐基准(内存模式,含哈希链计算)
[[bench]]
name = "facts_log_append"
path = "benches/facts_log_append.rs"
harness = false

[[example]]
name = "generate_hashed_wal"
required-features = ["persistence"]

# 形式化验证相关测试目标(位于 verification/ 目录,非默认 tests/ 目录)
# differential_test: P0-12 差分测试(reactor 运行时 vs execute_transition 纯函数)
[[test]]
name = "differential_test"
path = "verification/differential_test.rs"

[package.metadata.kani]
# CI 验证列表 (仅限能在 CI 预算内稳定通过的 proof)
#
# 实测结果 (Kani 0.67.0, WSL Ubuntu 22.04, 2026-08-05):
#   10/11 PASS, 1/11 TIMEOUT
#
# 未列入 CI 的 8 个 proof 中, 7 个本地实测 PASS (16-115s), 但因涉及堆分配
# 数据结构 (Vec/VecDeque/BTreeSet) 跨 Kani 版本可能不稳定, 为保证 CI 可靠性
# 仅保留 3 个最简单的纯状态机 proof:
#   - invariant_io_count_register_complete   (PASS 36s,  涉及 BTreeSet)
#   - invariant_io_count_force_remove        (TIMEOUT 609s, BTreeSet force_remove 状态爆炸)
#   - invariant_io_recovery_iff_result       (PASS 45s,  涉及 Vec 操作)
#   - command_does_not_decrease_queue        (PASS 23s,  涉及 VecDeque)
#   - proof_fact_log_append_monotonic        (PASS 56s,  涉及 Vec + 哈希链)
#   - proof_hash_chain_back_link             (PASS 115s, 涉及哈希链)
#   - proof_reactor_invariants_preserved_after_pure_ops (PASS 16s, 组合操作)
#   - proof_phase_state_machine_cannot_jump  (PASS 7s,   Phase 状态机)
#
# 详见 evorule-reactor/docs/KANI.md "完整验证" 表
proofs = [
    "invariant_version_monotonic", # version 单调递增 (简单计数器)
    "max_rounds_termination",      # max_rounds 终止条件 (简单有界循环)
    "invariant_cause_queue_sync",  # P0-11 cause 队列与 queue 长度一致 (简单 Vec 长度检查)
]
