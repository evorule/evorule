[package]
name = "evorule-governance"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Governance layer primitives: audit chain, rule validation, time machine, I/O dispatching"
readme = "README.md"
documentation = "https://docs.rs/evorule-governance"
keywords = ["governance", "audit", "rules-engine", "validation", "time-machine"]
# After H6 the axum (web-programming) and sqlx (database) dependencies were removed;
# categories updated to match the current pure-mechanism-layer positioning
categories = ["asynchronous", "config", "data-structures", "development-tools"]
# Exclude development artifacts/demo data when publishing to crates.io (downstream
# dependency consumers do not need them)
exclude = [
    "data/",                 # demo.sqlite demo database
    "**/hash_snapshot.txt",  # Hash snapshots (development artifacts)
    "verification/",         # Differential-testing sources (not needed downstream)
    "benches/",              # Criterion performance-benchmark sources (dev-only)
    "demo.db",               # SQLite demo database file that may exist
    "scripts/",              # Development helper scripts
    "tests/verify_audit.py", # Python audit verification script (dev-only)
    "proptest-regressions/", # proptest regression test case cache
    "rust-toolchain.toml",   # Development toolchain pinning
    "**/*.log",              # Various runtime logs
    "install_log.txt",       # Tool installation log
]


[lints]
workspace = true
[dependencies]
# Local dependencies
evorule-tcb = { path = "../evorule-tcb", version = "0.13.0" }

# Logging
tracing = "0.1"
# H5: tracing-subscriber migrated to evorule-server (only for bin initialization logging)

# H6: prometheus dependency removed (metrics migrated to the standalone evorule-server
# repo, evorule-server/src/metrics_impl.rs + core/metrics/)
# The core layer keeps only the IoMetrics trait definition (no external dependencies);
# the application layer provides the Prometheus implementation via dependency injection

# H5: the I/O Handler SDK (sqlx/reqwest) migrated to the standalone evorule-server repo
# core/io_handlers/
# evorule-governance no longer depends on concrete I/O implementations; only the
# IoHandler trait (mechanism) + IoDispatcher (framework) remain

# Audit components
blake3 = "1"                                              # hashing
flate2 = { version = "1.0", features = ["rust_backend"] } # P05: audit-chain gzip compression
# G-A1: audit-anchor signing (authenticity/non-repudiation). ed25519 (RFC 8032)
# deterministic signing, no RNG, compatible with the deterministic-execution discipline
ed25519-dalek = "2"
# G-A1: getrandom split by compile target — wasm32 needs the js feature (browser
# crypto.getRandomValues)
# Only key generation (one-off ops) uses the OS entropy source; it never enters the
# deterministic execution path

# H6: HTTP API dependencies migrated to evorule-server
# (axum/tower/tower-http/tower_governor/governor/subtle)
# The core layer no longer contains HTTP route handling (mechanism-policy separation)

# Hot reload removed (application-layer feature)

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"                                 # P2-9: JSON configuration files (replacing TOML since v6.1)

# Error handling
thiserror = "2"

# WASM adaptation: reactor and tokio split by compile target
# - wasm32 disables rt-multi-thread (WASM has no multi-threaded runtime)
# - persistence stays enabled for both targets (see the wasm32 block comment below,
#   corrected 2026-09-14)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
evorule-reactor = { path = "../evorule-reactor", version = "0.13.0", features = ["persistence"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
getrandom = { version = "0.2", features = ["std"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# persistence stays **enabled** under wasm32: governance's fs-related production code has
# no cfg gating, and disabling the feature causes 13 compile errors. std::fs compiles
# under wasm32 but returns Unsupported at runtime; the minimal prototype uses in-memory
# mode and never calls the persistence APIs.
# Note: same situation as the reactor side — "compiles only", not "usable on wasm32".
evorule-reactor = { path = "../evorule-reactor", version = "0.13.0", features = ["persistence"] }
# `time` must not be trimmed (TB-WASM-004): production code src/io_subscriber.rs:409 uses
# `tokio::time::sleep(backoff).await` in the transient-error exponential-backoff retry
# path, with no wasm32 gating. Same reasoning as the reactor side — kept only to compile;
# `std::time::Instant` is unimplemented under wasm32, so any truly reachable timing call
# panics at runtime.
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
getrandom = { version = "0.2", features = ["std", "js"] }

[dev-dependencies]
tempfile = "3"
# H6: reqwest removed (HTTP API tests migrated to evorule-server)
# Formal verification: proptest differential tests (in the verification/ directory)
proptest = "1.4"
# Performance benchmarks (criterion) — 041 v2.0 A8: audit-chain audit_new + verify baseline
# Dev dependency only; not part of release artifacts.
criterion = { version = "0.5", features = ["html_reports"] }

# 041 v2.0 A8: audit-chain audit_new / verify performance benchmark
[[bench]]
name = "audit_chain"
path = "benches/audit_chain.rs"
harness = false

# Formal-verification test targets (in the verification/ directory, not the default
# tests/ directory)
# differential_test: P0-9/P0-10 differential tests (version consistency + rewind vs FactsLog)
[[test]]
name = "differential_test"
path = "verification/differential_test.rs"

[features]
default = []
# H6: metrics feature removed (the IoMetrics trait is always available; the Prometheus
# implementation is provided by the application layer)
# H6: auth feature removed (auth.rs migrated to evorule-server; the application layer
# enables authentication by default)
persistence = ["evorule-reactor/persistence"]

# H5: evorule-server was relocated twice → it finally lives in the standalone
# evorule-server repo (top-level evorule-server/ crate)
# evorule-governance is now a pure lib crate with no bin targets
# Note: the evorule CLI is a separate crate in this workspace (evorule-cli/)
