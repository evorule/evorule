[workspace]
resolver = "2"
members = [
    "evorule-tcb",
    "evorule-reactor",
    "evorule-governance",
    "evorule-cli",
    # examples/reactive_researcher 不参与核心 workspace 发布（属应用层 demo）
    # 如需编译运行，请单独进入该目录 cargo build
]

[workspace.package]
version = "0.2.3"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["EvoRule Project"]
repository = "https://gitee.com/evo-rule-lab/evorule"
homepage = "https://gitee.com/evo-rule-lab/evorule"
rust-version = "1.74"


[workspace.lints.rust]
# kani cfg 由 kani 工具链注入, Cargo 不识别, 显式声明以抑制 warning
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[workspace.lints.clippy]
# G1: panic-prone (build.rs 已守, clippy 双保险)
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
# F8: 嵌套复杂度 (守 cognitive_complexity)
cognitive_complexity = { level = "warn", priority = -1 }
# F9: 函数长度 (守 too_many_lines, 阈值 150 行以容纳 WAL 恢复等集中逻辑)
too_many_lines = { level = "warn", priority = -1 }
# F10 部分: 类型复杂度
type_complexity = { level = "warn", priority = -1 }
# F6 部分: 模块导入图
module_inception = "warn"
# 通用代码质量 (warn 级, 不阻断 CI)
all = { level = "warn", priority = -1 }
# 注意: 不启用 pedantic — pedantic 会触发数百个 warning (missing_docs_in_private_items 等),
# 在 v0.1.0 阶段过于激进。待代码稳定后在 v0.2.0 逐步开启。

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# 注意: 不设置 panic = "abort"。
# evorule-tcb 的 release profile 设 panic = "abort" (no_std 内核优化),
# 但 workspace 中 panic 为全局设置, 而 tier1/tier2 依赖 tokio 需 unwinding, 故移除。
# evorule-tcb 的安全性由 #![forbid(unsafe_code)] + build.rs 门禁保证。
