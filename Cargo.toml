[workspace]
resolver = "2"
members = ["tier0-tcb", "tier1-reactor", "tier2-governance", "evorule-cli", "examples/reactive_researcher"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["EvoRule Project"]
repository = "https://gitee.com/evo-rule-lab/evorule"



[workspace.lints.rust]
# kani cfg 由 kani 工具链注入, Cargo 不识别, 显式声明以抑制 warning
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[workspace.lints.clippy]
# G1: panic-prone (build.rs 已守, clippy 双保险)
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
# F8: 嵌套复杂度 (守 cognitive_complexity)
cognitive_complexity = { level = "warn", priority = -1 }
# F9: 函数长度 (守 too_many_lines, 阈值在 lint 配置中调)
too_many_lines = { level = "warn", priority = -1 }
# F10 部分: 类型复杂度
type_complexity = { level = "warn", priority = -1 }
# F6 部分: 模块导入图
module_inception = "warn"
# 通用代码质量 (warn 级, 不阻断 CI)
all = { level = "warn", priority = -1 }
# 注意: 不启用 pedantic — pedantic 会触发数百个 warning (missing_docs_in_private_items 等),
# 在 v0.1.0 阶段过于激进。待代码稳定后在 v0.2.0 逐步开启。

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
