[workspace]
resolver = "2"
# EvoRule workspace: the four crates tcb / reactor / governance / cli share
# one workspace version. The per-version change history is authoritative in
# CHANGELOG.md and the release/versioning policy in VERSION_STRATEGY.md — do
# not duplicate it here (this header previously drifted: its last
# hand-maintained entry stopped at v0.9.0 while the workspace had reached
# v0.13.0).
members = [
    "evorule-tcb",
    "evorule-audit-chain",
    "evorule-mcu",
    "evorule-reactor",
    "evorule-governance",
    "evorule-discipline",
    "evorule-cli",
    "evorule-eval",
    "evid-verify-core",
    "evid-verify-wasm",
]
# fuzz/ is a standalone libFuzzer workspace (cargo-fuzz only; part of the
# supply-chain gate set) and does not take part in main-workspace
# versioning/publishing/gates.
# boards/ holds board-level binaries (embedded on-target face), built
# standalone (each with its own .cargo config and memory.x); they stay out of
# the main workspace — zero hal dependencies enter the main dependency graph
# (enforced by the CI dependency-graph scan gate).
exclude = ["fuzz", "boards"]

[workspace.package]
version = "0.13.0"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["EvoRule Project"]
rust-version = "1.74"
homepage = "https://github.com/evorule/evorule"
repository = "https://github.com/evorule/evorule"
documentation = "https://docs.rs/evorule-tcb"
description = "evorule: deterministic rule engine + BLAKE3 tamper-evident audit chain"
readme = "README.md"
keywords = ["rule-engine", "audit-chain", "blake3", "deterministic"]
categories = ["data-structures", "parser-implementations"]

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
cognitive_complexity = { level = "warn", priority = -1 }
too_many_lines = { level = "warn", priority = -1 }
type_complexity = { level = "warn", priority = -1 }
module_inception = "warn"
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
