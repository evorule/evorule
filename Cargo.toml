[workspace]
resolver = "2"
members = ["tier0-tcb", "tier1-reactor", "tier2-governance", "evorule-cli", "examples/reactive_researcher"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["EvoRule Project"]
repository = "https://gitee.com/evo-rule-lab/evorule"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# 注意：不设置 panic = "abort"。
# tier0-tcb 原 release profile 含 panic = "abort"（no_std 内核优化），
# 但 workspace 中 panic 为全局设置，而 tier1/tier2 依赖 tokio 需 unwinding，
# 故移除。tier0-tcb 的安全性由 #![forbid(unsafe_code)] + build.rs 门禁保证。
