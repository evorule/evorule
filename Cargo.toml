[workspace]
resolver = "2"
# EvoRule workspace：tcb / reactor / governance / cli 四 crate 统一版本。
# 2026-09-12：v0.5.0 发布（版本策略见 VERSION_STRATEGY.md）。
members = [
    "evorule-tcb",
    "evorule-reactor",
    "evorule-governance",
    "evorule-cli",
]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["EvoRule Project"]
rust-version = "1.74"
homepage = "https://gitee.com/evorule/evorule"
repository = "https://gitee.com/evorule/evorule"
documentation = "https://docs.rs/evorule-tcb"
description = "evorule:确定性规则引擎 + BLAKE3 不可篡改审计链 + ReAct 循环 (Deterministic rule engine with BLAKE3 audit chain and ReAct loop)"
readme = "README.md"
keywords = ["rule-engine", "audit-chain", "blake3", "react", "deterministic"]
categories = ["data-structures", "parser-implementations"]

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
cognitive_complexity = { level = "warn", priority = -1 }
too_many_lines = { level = "warn", priority = -1 }
type_complexity = { level = "warn", priority = -1 }
module_inception = "warn"
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
