[workspace]
resolver = "2"
# EvoRule workspace：tcb / reactor / governance / cli 四 crate 统一版本。
# 2026-09-20：v0.6.1（R10 origin_fact_id / R11 mark_as_rollup 返回 RollupOutcome / snapshot_at off-by-one 修复；版本策略见 VERSION_STRATEGY.md）。
# 2026-09-14：v0.6.0（破坏性变更：collect/merge 原语退役；版本策略见 VERSION_STRATEGY.md）。
members = [
    "evorule-tcb",
    "evorule-reactor",
    "evorule-governance",
    "evorule-cli",
    "evorule-wasm-demo",
]
# fuzz/ 为独立 libFuzzer 工作区（cargo-fuzz 专用，A1 供应链三件套），
# 不参与主 workspace 版本/发布/门禁。
exclude = ["fuzz"]

[workspace.package]
version = "0.6.1"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["EvoRule Project"]
rust-version = "1.74"
homepage = "https://gitee.com/evorule/evorule"
repository = "https://gitee.com/evorule/evorule"
documentation = "https://docs.rs/evorule-tcb"
description = "evorule:确定性规则引擎 + BLAKE3 不可篡改审计链 (Deterministic rule engine with BLAKE3 audit chain)"
readme = "README.md"
keywords = ["rule-engine", "audit-chain", "blake3", "deterministic"]
categories = ["data-structures", "parser-implementations"]

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
cognitive_complexity = { level = "warn", priority = -1 }
too_many_lines = { level = "warn", priority = -1 }
type_complexity = { level = "warn", priority = -1 }
module_inception = "warn"
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
