[workspace]
resolver = "2"
# EvoRule workspace：tcb / reactor / governance / cli 四 crate 统一版本。
# All four crates share one workspace version. The per-version change
# history is authoritative in CHANGELOG.md and the release/versioning
# policy in VERSION_STRATEGY.md — do not duplicate it here (this
# header previously drifted: its last hand-maintained entry stopped
# at v0.9.0 while the workspace had reached v0.13.0).
members = [
    "evorule-tcb",
    "evorule-audit-chain",
    "evorule-mcu",
    "evorule-reactor",
    "evorule-governance",
    "evorule-discipline",
    "evorule-cli",
    "evorule-eval",
    "evid-verify-core",
    "evid-verify-wasm",
]
# fuzz/ 为独立 libFuzzer 工作区（cargo-fuzz 专用，A1 供应链三件套），
# 不参与主 workspace 版本/发布/门禁。
# boards/ 为板级二进制目录（嵌入式实机面），独立构建（各含 .cargo 配置与
# memory.x），不进主 workspace——hal 依赖零进主依赖图（CI 依赖图扫描门执法）。
exclude = ["fuzz", "boards"]

[workspace.package]
version = "0.13.0"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["EvoRule Project"]
rust-version = "1.74"
homepage = "https://github.com/evorule/evorule"
repository = "https://github.com/evorule/evorule"
documentation = "https://docs.rs/evorule-tcb"
description = "evorule:确定性规则引擎 + BLAKE3 不可篡改审计链 (Deterministic rule engine with BLAKE3 audit chain)"
readme = "README.md"
keywords = ["rule-engine", "audit-chain", "blake3", "deterministic"]
categories = ["data-structures", "parser-implementations"]

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
cognitive_complexity = { level = "warn", priority = -1 }
too_many_lines = { level = "warn", priority = -1 }
type_complexity = { level = "warn", priority = -1 }
module_inception = "warn"
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
