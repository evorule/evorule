[workspace]
resolver = "2"
# D:\evorule 是 v0.3.1 工作目录（原 evorule-b 副本 + 主仓 reactor/governance/cli 联调）。
# 2026-08-17：4 仓 (tcb / reactor / governance / cli) 统一以 v0.3.1 准备发布。
# TCB 含 collect/merge/has_fields + ReAct 循环，reactor/governance/cli 同步升至 v0.3.1。
members = [
    "evorule-tcb",
    "evorule-reactor",
    "evorule-governance",
    "evorule-cli",
]

[workspace.package]
version = "0.3.2"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["EvoRule Project"]
rust-version = "1.74"
homepage = "https://gitee.com/evorule/evorule"
repository = "https://gitee.com/evorule/evorule"
documentation = "https://docs.rs/evorule-tcb"
description = "evorule:确定性规则引擎 + BLAKE3 不可篡改审计链 + ReAct 循环 (Deterministic rule engine with BLAKE3 audit chain and ReAct loop)"
readme = "README.md"
keywords = ["rule-engine", "audit-chain", "blake3", "react", "deterministic"]
categories = ["data-structures", "parser-implementations"]

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
cognitive_complexity = { level = "warn", priority = -1 }
too_many_lines = { level = "warn", priority = -1 }
type_complexity = { level = "warn", priority = -1 }
module_inception = "warn"
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
