[package]
name = "reactive_researcher"
version = "0.2.1"
edition = "2021"
description = "EvoRule reference implementation - reactive researcher demo (1.0.0 §4.4 gate)"
license = "AGPL-3.0-or-later"
repository = "https://gitee.com/evo-rule-lab/evorule"
publish = false

[[bin]]
name = "reactive_researcher"
path = "src/main.rs"

[dependencies]
evorule-tcb = { path = "../../evorule-tcb", version = "0.2.1" }
evorule-reactor = { path = "../../evorule-reactor", version = "0.2.1" }
evorule-governance = { path = "../../evorule-governance", version = "0.2.1" }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "time",
    "fs",
] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
# H5: IoHandler trait 已下沉到 evorule-reactor,需 async-trait 支持 object-safe 实现
async-trait = "0.1"
