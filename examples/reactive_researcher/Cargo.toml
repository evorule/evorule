[package]
name = "reactive_researcher"
version = "0.1.0"
edition = "2021"
description = "EvoRule reference implementation - reactive researcher demo (1.0.0 §4.4 gate)"
license = "AGPL-3.0-or-later"
repository = "https://gitee.com/evorulelab/evorule"
publish = false

[[bin]]
name = "reactive_researcher"
path = "src/main.rs"

[dependencies]
tier0-tcb = { path = "../../tier0-tcb" }
tier1-reactor = { path = "../../tier1-reactor" }
tier2-governance = { path = "../../tier2-governance" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "fs"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
