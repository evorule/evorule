# Prometheus 抓取配置
global:
  scrape_interval: 5s        # 抓取间隔（演示用 5s，生产建议 15s）
  evaluation_interval: 5s

scrape_configs:
  # evorule-server 指标抓取
  - job_name: 'evorule'
    metrics_path: /metrics
    static_configs:
      # Docker 容器内访问 Windows 宿主机服务使用 host.docker.internal
      - targets: ['host.docker.internal:18080']
        labels:
          service: 'evorule-server'
          env: 'dev'
