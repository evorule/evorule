[package]
name = "evorule-audit-chain"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version = "1.81" # core::error::Error needs at least 1.81 (the workspace-wide 1.74 does not cover no_std kernel crates)
description = "EvoRule audit-chain no_std kernel — Fact data shapes + stable JSON serialization + BLAKE3 chain-hash single source of truth"
readme = "README.md"
documentation.workspace = true
keywords = ["audit-chain", "blake3", "no-std", "deterministic"]
categories = ["no-std", "data-structures"]

[dependencies]
# no_std kernel: tcb with default features off (the std gate is left for std hosts to enable)
evorule-tcb = { path = "../evorule-tcb", version = "0.13.0", default-features = false }
blake3 = { version = "1", default-features = false }
serde = { version = "1", default-features = false, features = ["alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[lints]
workspace = true
