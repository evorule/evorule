# =============================================================================
# Rust toolchain pin
#
# Purpose:
# - Pin 1.98.1 (local stable channel; 1.97.1 shipped in 2026-07 but has a
#   stably reproducible ICE on evorule-reactor (rmeta/encoder no entry found
#   for key, see an earlier internal report), while 1.98.1 passes the full
#   workspace's 821 tests in practice, so the minimum usable pin = 1.98.1)
# - Compatible with Cargo.toml `[workspace.package].rust-version = "1.74"`
#   (MSRV is a floor)
# - CI / local / contributors use the same version to avoid stable drift
# - clippy + rustfmt components must be installed (clippy is one of the 1.0
#   gate-promotion conditions)
# - Kani uses its own toolchain and does not depend on this file
#   (evorule-tcb/ has its own nightly pin)
# =============================================================================
[toolchain]
channel = "1.98.1"
profile = "minimal"
components = ["rustfmt", "clippy"]
