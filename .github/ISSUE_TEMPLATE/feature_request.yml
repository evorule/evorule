name: Feature Request
description: Propose a new feature or an improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem context
      description: What practical problem does this need solve? What is missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How do you expect it to be solved? Attach design sketches / references if any.
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Impact scope
      options:
        - docs / process only
        - single crate internal
        - cross-crate (CHANGE_REQUEST registration required)
        - public API / protocol (handle with care)
    validations:
      required: true
  - type: checkboxes
    id: cla
    attributes:
      label: CLA
      options:
        - label: I have read and agree to the Individual CLA (CLA-individual.md)
          required: true
