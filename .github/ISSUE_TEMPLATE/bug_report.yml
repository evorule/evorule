name: Bug Report
description: Report a reproducible defect
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a defect. Please provide reproduction details so it can be located quickly.
        **For security-related defects, use the private channel in SECURITY.md; do not disclose them publicly here.**
  - type: dropdown
    id: component
    attributes:
      label: Component involved
      options:
        - evorule-cli
        - evorule-governance (audit chain)
        - evorule-reactor (ReAct loop)
        - evorule-tcb (deterministic kernel)
        - docs / governance process
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: Observed behavior
      description: What actually happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Minimal reproduction steps / input JSON / commands
      placeholder: |
        1. evorule run --rule xxx.json
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / tag
      placeholder: v0.6.0
  - type: checkboxes
    id: cla
    attributes:
      label: CLA
      options:
        - label: I have read and agree to the Individual CLA (CLA-individual.md)
          required: true
