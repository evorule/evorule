# Dependabot 依赖更新 (A4 后续提分项: Scorecard Dependency-Update-Tool 0→10)
#
# 两个生态:
# - github-actions: 各 workflow 的 action 版本更新 (周扫)
# - cargo: 主 workspace (根 Cargo.toml) 与 fuzz 独立 workspace (月扫, 降噪声)
#
# 注意: PR 数量上限 5/生态, 避免淹没 review 队列; CLA allowlist 已含 dependabot[bot]。

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5

  - package-ecosystem: "cargo"
    directory: "/fuzz"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
