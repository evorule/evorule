# WASM compile gate (SC0, per the evorule scientific computing platform master plan)
#
# Covers:
# - wasm32-unknown-unknown compile gate: the four core crates (tcb / reactor /
#   governance / mcu) must keep compiling for wasm32 -- the 2nd compile target
#   formalized, preventing decay of the WASM adaptation surface (mcu is a no_std
#   kernel, purely portable, added to the batch alongside)
# - WASM adaptation-line guard: CI enforcement of the adaptation-surface decay
#   trigger -- more than 50 adaptation lines is red, and red is the start condition
#   for the Runtime trait abstraction refactor
#
# Design notes:
# - cargo check instead of build: the gate targets "type/dependency portability";
#   artifact linking belongs to the wasm-bindgen integration layer, out of scope for this gate
# - runtime bit-for-bit consistency (WASM vs native dual run) needs a
#   wasm-bindgen-test harness and is not in this file
name: WASM Gate

on:
  push:
    branches: [main, master, "release/**"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions: read-all

env:
  CARGO_TERM_COLOR: always

jobs:
  # ==========================================================================
  # 1. wasm32 compile gate (four core crates)
  # ==========================================================================
  wasm-check:
    name: wasm32 check (tcb + reactor + governance + mcu + evid core/wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: wasm32-unknown-unknown

      # Key: rust-toolchain.toml pins 1.98.1; the rustup shim installs 1.98.1 along with the file
      # (minimal profile, no targets) -- the root cause of the first-run 8f9e2cc failure was that
      # CI's 1.98.1 had no wasm32 std. This step installs the wasm32 target into the "effective
      # toolchain" (= the file-pinned 1.98.1) to align with the local environment; first-run lesson:
      # targets attached to dtolnay@stable install into the wrong toolchain.
      - name: Install the wasm32 target into the effective toolchain
        run: rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: . -> target
          key: wasm32

      - name: wasm32 compile check (four core crates + evid verification kernel/bindings)
        run: cargo check --target wasm32-unknown-unknown -p evorule-tcb -p evorule-reactor -p evorule-governance -p evorule-mcu -p evid-verify-core -p evid-verify-wasm

  # ==========================================================================
  # 2. EVID mobile golden-vector gate (EVID verifier design doc §5 third end: mobile)
  #    Real wasm32 artifact behavior comparison: instantiate the cdylib (zero imports) bare,
  #    run the frozen vectors from dist/fixtures, and compare the output byte-for-byte against
  #    the host handlers (same-origin copy as core); any mismatch is fail-closed red; bare
  #    instantiation also proves the zero-import contract on every run (any pollution throws -> red);
  #    also verifies the wasm embedded in dist/index.html matches this build (prevents dist drift).
  # ==========================================================================
  evid-wasm-gate:
    name: evid wasm gate (mobile golden vectors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install the wasm32 target into the effective toolchain
        run: rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: . -> target
          key: wasm32

      - name: Build the wasm32 release cdylib
        run: cargo build -p evid-verify-wasm --target wasm32-unknown-unknown --release

      - name: Persist host-copy output (handler judgment layer = same-origin as core)
        env:
          EVID_WASM_HOST_OUT_DIR: ${{ github.workspace }}/target/evid-host-out
        run: cargo test -p evid-verify-wasm --test wasm_output_dump

      - name: wasm artifact byte-for-byte comparison + dist embedded consistency
        run: node scripts/evid_wasm_gate.mjs target/wasm32-unknown-unknown/release/evid_verify_wasm.wasm evid-verify-wasm/dist/fixtures target/evid-host-out evid-verify-wasm/dist/index.html

  # ==========================================================================
  # 3. WASM adaptation-line guard (CI enforcement of the adaptation-surface decay trigger)
  #    Counting scope: target_arch="wasm32" cfg lines and wasm-bindgen reference
  #    lines in the four core crates' src. Baseline = 2 (reactor/ffi.rs; mcu is purely
  #    portable no_std and contributes 0 lines).
  #    Threshold = 50: above threshold is red, and red is the start condition for
  #    the Runtime trait abstraction refactor -- this job hardens that trigger from
  #    "human memory" into "machine enforcement".
  # ==========================================================================
  wasm-adaptation-guard:
    name: wasm adaptation lines (threshold 50)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Adaptation-line count and threshold verdict
        run: |
          COUNT=$(grep -rnE 'target_arch *= *"wasm32"|wasm_bindgen|wasm-bindgen' \
            evorule-tcb/src evorule-reactor/src evorule-governance/src evorule-mcu/src \
            --include='*.rs' | wc -l)
          echo "WASM adaptation lines: ${COUNT} (threshold 50, baseline 2)"
          if [ "${COUNT}" -gt 50 ]; then
            echo "::error::WASM adaptation lines ${COUNT} > 50 -- Runtime trait abstraction refactor start condition triggered; start the trait refactor project before extending the adaptation surface"
            exit 1
          fi
