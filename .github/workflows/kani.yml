# =============================================================================
# GitHub Actions: Kani formal verification (adapted to the main branch architecture)
#
# Key differences from the dev/wip variant (must be respected, otherwise silently all green):
#   - main's TCB proofs live in tests/kani/, entering through the tests/kani_entry.rs top-level entry
#     -> cargo kani must add --tests, otherwise the Checking harness count is 0
#   - reactor's proofs enter the lib via src/pure.rs #[path]
#     -> --tests must NOT be added (adding it makes the harness unfindable)
#
# Tiering basis (measured, Kani 0.67.0 / WSL Ubuntu 22.04, 2026-09-11):
#
#   Tier A, 14 proofs: all SUCCESSFUL in 9~28s, ~4.2min serial total -> into the PR gate
#   Tier B, 23 proofs: all timed out at 600s (2 of them actually ran 910s+)
#               still timed out at 3600s (verify_merge_safe ran the full 3603s)
#               confirmed unwind is not a lever (unwind 4/8 no improvement)
#               -> judged "not runnable currently"; not in nightly, manual trigger only and allowed to fail
#
# WARNING: do not raise the timeout for tier B: no evidence so far suggests they terminate.
#    Raising the timeout only makes failure arrive later and burns more runner time.
#
# Kani version: 0.67.0
# Rust version: nightly-2025-11-21
#
# 2026-10-10 v0.8.1 release note: a verification-only tag commit (only verification docs
# changed) does not hit this file's paths filter, and the M4 release gate blocks because the
# tag commit has no kani run -- this comment line makes the tag commit hit paths and trigger
# a tier A run, for M4 verification.
# =============================================================================

name: kani

on:
  push:
    branches: [main]
    paths:
      - "evorule-tcb/src/**"
      - "evorule-tcb/tests/**"
      - "evorule-tcb/Cargo.toml"
      - "evorule-reactor/src/**"
      - "evorule-reactor/verification/**"
      - "evorule-reactor/Cargo.toml"
      - "evorule-eval/Cargo.toml"
      - "Cargo.toml"
      - ".github/workflows/kani.yml"
      # The M4 release gate checks "kani-tcb-a-tier green on the tag commit": verification docs
      # (verification/**) closeout commits must likewise trigger a tier A run, otherwise a
      # verification-only release commit never gets a kani run and the gate self-locks
      # (2026-10-10 v0.8.1 release proof).
      - "verification/**"
      # Likewise: a fix commit to release.yml itself, if the tag is re-cut (workflow-only tag commit),
      # also misses paths -> no kani run -> gate 900s fail-closed (2026-10-13 v0.8.5
      # release proof; unlocked that day by a manual kani dispatch). Once in paths, such commits
      # automatically trigger a tier A run, eliminating the gate self-lock.
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - "evorule-tcb/src/**"
      - "evorule-tcb/tests/**"
      - "evorule-tcb/Cargo.toml"
      - "evorule-reactor/src/**"
      - "evorule-reactor/verification/**"
      - "evorule-reactor/Cargo.toml"
      - "evorule-eval/Cargo.toml"
      - "Cargo.toml"
      - ".github/workflows/kani.yml"
      - "verification/**"
      - ".github/workflows/release.yml"
  # manual trigger (a / b / all)
  #   a = tier A + reactor (PR gate, minutes)
  #   b = tier B, 20 heavy proofs (known >1h; manual exploration only, non-blocking)
  workflow_dispatch:
    inputs:
      tier:
        description: "Tier to run (a / b / all)"
        required: false
        default: "all"

# Explicit minimal permissions (Scorecard Token-Permissions): proof verification only needs read
permissions: read-all

env:
  CARGO_TERM_COLOR: always
  KANI_VERSION: "0.67.0"

jobs:
  # ---------------------------------------------------------------------------
  # Tier A: 14 lightweight TCB proofs (PR gate)
  # Measured 9~28s each, ~4.2min serial; all carry in-file #[kani::unwind](1~8)
  # ---------------------------------------------------------------------------
  kani-tcb-a-tier:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust toolchain (nightly for Kani 0.67.0)
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: nightly-2025-11-21

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: kani-${{ runner.os }}-tcb-a-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            kani-${{ runner.os }}-tcb-a-
            kani-${{ runner.os }}-

      - name: Install Kani ${{ env.KANI_VERSION }}
        run: |
          cargo install --locked kani-verifier --version "$KANI_VERSION" --root "$HOME/.cargo"
          cargo kani setup
          cargo kani --version

      - name: Verify A-tier proofs (evorule-tcb, 14)
        run: |
          set -e
          # WARNING: --tests required: main's TCB proofs live under tests/kani/
          for h in \
            verify_partial_eq_never_panics \
            verify_resolve_path_deterministic \
            verify_resolve_path_array_index \
            verify_ord_never_panics \
            verify_as_methods_never_panic \
            verify_resolve_path_missing_close_bracket \
            verify_resolve_path_escaped_dot \
            verify_resolve_path_invalid_index_char \
            verify_resolve_path_trailing_dot \
            verify_resolve_path_simple_field \
            verify_resolve_path_empty_returns_none \
            verify_resolve_path_double_dot \
            verify_array_index_bounds \
            verify_resolve_path_nested_dot \
          ; do
            echo "==> $h"
            timeout -k 30 300 cargo kani -p evorule-tcb --tests \
              --harness "$h" --output-format=terse
          done

  # ---------------------------------------------------------------------------
  # reactor: 4 CI proofs (PR gate)
  # proofs enter the lib via src/pure.rs #[path] -> --tests must NOT be added
  #
  # P1-5 (command_does_not_decrease_queue) 2026-09-12 same-root-cause fix, re-gated:
  #   the proof ends with forget(state) skipping Drop (see the P0-11 note below); locally
  #   measured 0.57s PASS / 0.60s PASS with --default-unwind 4.
  # P0-11 (invariant_cause_queue_sync) 2026-09-12 root cause fixed, re-gated:
  #   root cause: CBMC models JsonValue in the VecDeque heap buffer as an arbitrary variant; any
  #   path triggering JsonValue Drop (pop return value / clear's drop_in_place / whole-state
  #   Drop) unrolls the Object(BTreeMap) red-black tree destructor's unbounded unwind -> state explosion.
  #   fix: proof-side forget(popped)/(state) + clear_queue's #[cfg(kani)]
  #   take+forget branch (evorule-reactor/src/state.rs). Locally measured 1.53s PASS.
  #   WARNING: P0-11 runs without --default-unwind 4 (measured: that config is ineffective for
  #   P0-11 and causes timeouts; the 3 pre-fix FAIL records live under
  #   evorule-reactor/verification/evidence/kani/).
  # ---------------------------------------------------------------------------
  kani-reactor:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust toolchain (nightly for Kani 0.67.0)
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: nightly-2025-11-21

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: kani-${{ runner.os }}-reactor-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            kani-${{ runner.os }}-reactor-
            kani-${{ runner.os }}-

      - name: Install Kani ${{ env.KANI_VERSION }}
        run: |
          cargo install --locked kani-verifier --version "$KANI_VERSION" --root "$HOME/.cargo"
          cargo kani setup
          cargo kani --version

      - name: Verify reactor CI proofs (4)
        run: |
          set -e
          # --tests must not be added: reactor proofs are in the lib (entered via src/pure.rs #[path])
          # P0-11 runs standalone and without --default-unwind (measured: that config is ineffective
          # for P0-11, see the job header comment)
          echo "==> invariant_cause_queue_sync"
          timeout -k 30 300 cargo kani -p evorule-reactor \
            --harness invariant_cause_queue_sync --output-format=terse

          # P0-14 gated 2026-10-21: measured WSL Kani 0.67.0 Verification 14.9s
          # SUCCESSFUL (default unwind=10). WARNING: must run standalone and without
          # --default-unwind: measured, with that config the insufficient unwind causes
          # unwinding assertion failures (2026-10-21, rc=1 one or more unwinding failures)
          # -- same pattern as P0-11.
          # Boundary declaration (AL2/R2): within default unwind 10, the chain back-link induction (N<=3 steps);
          # the Kani hash is a cfg(kani) simplified stand-in -- the proof target is the chain-step
          # structural property; blake3 collision resistance is out of proof scope
          # (honest boundary, see verification/DISCLOSURE_LOG.md)
          echo "==> proof_hash_chain_back_link"
          timeout -k 30 300 cargo kani -p evorule-reactor \
            --harness proof_hash_chain_back_link --output-format=terse
          for h in \
            command_does_not_decrease_queue \
            invariant_version_monotonic \
            max_rounds_termination \
          ; do
            echo "==> $h"
            timeout -k 30 300 cargo kani -p evorule-reactor \
              --default-unwind 4 --harness "$h" --output-format=terse
          done

  # ---------------------------------------------------------------------------
  # Tier B: 20 heavy TCB proofs -- manual trigger only, allowed to fail
  # (2026-09-14: originally 23; P15/P16/P17 removed with the collect/merge primitive retirement)
  #
  # Measured (2026-09-11):
  #   600s cap -> 3/3 all timed out (2 of them actually ran 910s+)
  #   3600s cap -> verify_merge_safe ran the full 3603s and still timed out
  #   unwind 4/8 -> no improvement (falsifies the "config defect" hypothesis)
  #
  # Verdict: not runnable currently. No evidence of termination, so not in nightly
  #       (23 x 5h ~= 115 runner-hours per night for nothing but guaranteed timeouts).
  # This job is kept for manual on-demand exploration only; continue-on-error guarantees non-blocking.
  #
  # If tier B should ever become truly verifiable, the right approach is to shrink the
  # symbolic input space, not raise the timeout.
  # ---------------------------------------------------------------------------
  kani-tcb-b-tier:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    continue-on-error: true
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        batch: [1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust toolchain (nightly for Kani 0.67.0)
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: nightly-2025-11-21

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: kani-${{ runner.os }}-tcb-b-${{ matrix.batch }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            kani-${{ runner.os }}-tcb-b-
            kani-${{ runner.os }}-

      - name: Install Kani ${{ env.KANI_VERSION }}
        run: |
          cargo install --locked kani-verifier --version "$KANI_VERSION" --root "$HOME/.cargo"
          cargo kani setup
          cargo kani --version

      - name: Verify B-tier proofs batch ${{ matrix.batch }}
        run: |
          set -e
          case "${{ matrix.batch }}" in
            1) LIST="verify_evaluate_domain_all_never_panics verify_evaluate_domain_deterministic verify_evaluate_domain_eq_never_panics verify_evaluate_domain_exists_never_panics" ;;
            2) LIST="verify_evaluate_domain_has_fields_never_panics verify_evaluate_domain_in_never_panics verify_evaluate_domain_instruction_never_panics verify_evaluate_domain_lt_never_panics verify_evaluate_domain_not_never_panics" ;;
            3) LIST="verify_exec_enforce_deterministic verify_exec_enforce_halt_semantics verify_exec_enforce_never_panics verify_exec_enforce_permutation_equivalence verify_exec_set_arithmetic_safe" ;;
            4) LIST="verify_execute_meta_instruction_never_panics verify_execute_transition_never_panics verify_has_fields_empty_array verify_io_request_safe" ;;
            5) LIST="verify_react_io_required" ;;
            6) LIST="verify_branch_depth_limit verify_domain_depth_limit verify_transform_rules_limit" ;;
            7) LIST="verify_evaluate_domain_outcome_eq_never_panics verify_evaluate_domain_outcome_missing_rejected_never_panics" ;;
          esac
          for h in $LIST; do
            echo "==> $h"
            # per-proof cap 900s; a timeout is not counted as failure (interpret uniformly after collect)
            timeout -k 30 900 cargo kani -p evorule-tcb --tests \
              --harness "$h" --output-format=terse || echo "::warning::$h did not pass or timed out"
          done
