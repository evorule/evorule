# =============================================================================
# GitHub Actions: Kani 形式化验证
#
# 验证两个 crate 的 Kani proof (仅限能在 CI 预算内通过的验证)：
#
# evorule-tcb (12 个 proof - 纯函数 + FixedMap 抽象,状态空间可控):
#   - verify_value_roundtrip, verify_path_no_panic, verify_set_integer_safety,
#     verify_set_sub_safety, verify_jsonvalue_array_safety,
#     verify_resolve_path_object_kani, verify_evaluate_domain_eq_kani,
#     verify_evaluate_domain_lt_kani, verify_evaluate_domain_exists_kani,
#     verify_execute_transition_kani, verify_termination_kani,
#     verify_depth_enforcement_kani
#
# evorule-reactor (3 个 CI proof - 最简单的纯状态机验证,保证 CI 可靠性):
#   - invariant_version_monotonic (版本单调递增)
#   - max_rounds_termination (终止性)
#   - invariant_cause_queue_sync (P0-11 cause 队列同步)
#
# 注意：reactor 共 11 个 proof, 实测 10/11 PASS, 1/11 TIMEOUT (2026-08-05)。
# 未列入 CI 的 8 个 proof 中 7 个本地实测 PASS (16-115s), 但涉及堆分配数据结构
# (Vec/VecDeque/BTreeSet), 跨 Kani 版本可能不稳定, 故仅保留 3 个最简单的 proof 入 CI。
# 唯一 TIMEOUT 的是 invariant_io_count_force_remove (BTreeSet force_remove 状态爆炸, 600s 超时)。
# 详见 evorule-reactor/docs/KANI.md。
#
# Kani 版本: 0.67.0
# Rust 版本: nightly-2025-11-21 (与 evorule-tcb/rust-toolchain.toml 一致)
# =============================================================================

name: kani

on:
  push:
    branches: [main]
    paths:
      - "evorule-tcb/src/**"
      - "evorule-tcb/verification/**"
      - "evorule-tcb/Cargo.toml"
      - "evorule-reactor/src/**"
      - "evorule-reactor/verification/**"
      - "evorule-reactor/Cargo.toml"
      - "Cargo.toml"
      - ".github/workflows/kani.yml"
  pull_request:
    paths:
      - "evorule-tcb/src/**"
      - "evorule-tcb/verification/**"
      - "evorule-tcb/Cargo.toml"
      - "evorule-reactor/src/**"
      - "evorule-reactor/verification/**"
      - "evorule-reactor/Cargo.toml"
      - "Cargo.toml"
      - ".github/workflows/kani.yml"
  workflow_dispatch:
    inputs:
      crate:
        description: "Crate to verify (evorule-tcb / evorule-reactor / all)"
        required: false
        default: "all"
      proof:
        description: "Specific proof to verify (default: all)"
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always
  KANI_VERSION: "0.67.0"

jobs:
  kani-verify:
    runs-on: ubuntu-22.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: evorule-tcb
            timeout: 30
            # 12 个 proof (纯函数 + FixedMap),verify_termination_kani 需 unwind 65+ (MAX_TRANSFORM_RULES + 1)
            verify_cmd: "cargo kani -p evorule-tcb --output-format=terse --default-unwind 80"
          - crate: evorule-reactor
            timeout: 60
            # 3 个 CI proof (最简单的纯状态机验证;其余 8 个本地实测 7 PASS + 1 TIMEOUT,详见 docs/KANI.md)
            verify_cmd: "cargo kani -p evorule-reactor --output-format=terse --default-unwind 4"

    steps:
      - name: Skip check (workflow_dispatch crate filter)
        id: skip
        run: |
          REQUESTED="${{ github.event.inputs.crate }}"
          CURRENT="${{ matrix.crate }}"
          if [ -n "$REQUESTED" ] && [ "$REQUESTED" != "all" ] && [ "$REQUESTED" != "$CURRENT" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "==> Skipping $CURRENT (requested: $REQUESTED)"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "==> Will verify $CURRENT"
          fi

      - name: Checkout
        if: steps.skip.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Install Rust toolchain (nightly for Kani 0.67.0)
        if: steps.skip.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-11-21
          components: rustfmt, clippy

      - name: Cache cargo
        if: steps.skip.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: kani-${{ runner.os }}-${{ matrix.crate }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            kani-${{ runner.os }}-${{ matrix.crate }}-
            kani-${{ runner.os }}-

      - name: Install Kani ${{ env.KANI_VERSION }}
        if: steps.skip.outputs.skip != 'true'
        run: |
          cargo install --locked kani-verifier --version "$KANI_VERSION" --root "$HOME/.cargo"
          cargo kani setup
          cargo kani --version

      - name: Verify proofs (${{ matrix.crate }})
        if: steps.skip.outputs.skip != 'true'
        run: |
          set -e
          PROOF="${{ github.event.inputs.proof }}"
          if [ -n "$PROOF" ]; then
            echo "==> [${{ matrix.crate }}] Running specific proof: $PROOF"
            ${{ matrix.verify_cmd }} --harness "$PROOF"
          else
            echo "==> [${{ matrix.crate }}] Running all CI proofs"
            ${{ matrix.verify_cmd }}
          fi

      - name: Upload Kani results (${{ matrix.crate }})
        if: always() && steps.skip.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kani-results-${{ matrix.crate }}
          path: |
            target/kani/
          retention-days: 30

  kani-summary:
    runs-on: ubuntu-22.04
    needs: kani-verify
    if: always()
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Kani results (evorule-tcb)
        uses: actions/download-artifact@v4
        with:
          name: kani-results-evorule-tcb
          path: kani-results/evorule-tcb/
        continue-on-error: true

      - name: Download Kani results (evorule-reactor)
        uses: actions/download-artifact@v4
        with:
          name: kani-results-evorule-reactor
          path: kani-results/evorule-reactor/
        continue-on-error: true

      - name: Comment PR with summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            // needs.kani-verify.result 返回的是矩阵结果数组，如 ['success', 'failure']
            const results = ${{ needs.kani-verify.result }};
            const getStatus = (idx) => {
              if (results[idx] === 'success') return '✅ passed';
              if (results[idx] === 'failure') return '❌ failed';
              return '⏭️ skipped';
            };
            const body = '## 🔍 Kani Verification Summary (CI Budget)\n\n' +
              '| Crate | Status |\n|---|---|\n' +
              '| evorule-tcb (12 proofs) | ' + getStatus(0) + ' |\n' +
              '| evorule-reactor (3 CI proofs) | ' + getStatus(1) + ' |\n\n' +
              '*Note: reactor CI 仅运行 3 个简单 proof;其余 8 个本地实测 7 PASS + 1 TIMEOUT,详见 docs/KANI.md.*';
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
