# =============================================================================
# GitHub Actions: Kani 形式化验证
#
# Kani 验证 tier0-tcb/tests/kani_proofs.rs 中的 5 个 proof:
#   1. verify_value_roundtrip     - JsonValue 构造/访问一致性
#   2. verify_path_no_panic       - 路径解析对任意输入不 panic
#   3. verify_set_integer_safety  - 整数加法不溢出
#   4. verify_set_sub_safety      - 整数减法不溢出
#   5. verify_transition_bounded  - 状态转换有界
#
# 单个 proof 跑 1min - 24h 不等. 当前 workflow 跑全部 proofs.
# 如需加速, 可改为单 proof 矩阵并行.
# =============================================================================

name: kani

on:
  push:
    branches: [main]
    paths:
      - 'tier0-tcb/src/**'
      - 'tier0-tcb/Cargo.toml'
      - '.github/workflows/kani.yml'
  pull_request:
    paths:
      - 'tier0-tcb/src/**'
      - 'tier0-tcb/Cargo.toml'
      - '.github/workflows/kani.yml'
  workflow_dispatch:
    inputs:
      proof:
        description: 'Specific proof to verify (default: all)'
        required: false
        default: ''

env:
  CARGO_TERM_COLOR: always
  KANI_VERSION: '0.50.0'

jobs:
  kani-verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 1440  # 24h per proof budget

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tier0-tcb/target
          key: cargo-${{ runner.os }}-${{ hashFiles('tier0-tcb/Cargo.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install Kani ${{ env.KANI_VERSION }}
        run: |
          cargo install --locked kani-verifier --version "$KANI_VERSION" --root "$HOME/.cargo"
          cargo kani setup
          cargo kani --version

      - name: Verify proofs
        working-directory: tier0-tcb
        run: |
          set -e
          if [ -n "${{ inputs.proof }}" ]; then
            echo "==> Running specific proof: ${{ inputs.proof }}"
            cargo kani --proof "${{ inputs.proof }}" --output-format=terse
          else
            echo "==> Running all 6 proofs (estimated 30min - 24h)"
            cargo kani --output-format=terse
          fi

      - name: Upload Kani results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kani-results
          path: |
            tier0-tcb/target/kani/
          retention-days: 30

  kani-summary:
    runs-on: ubuntu-22.04
    needs: kani-verify
    if: always()
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Kani results
        uses: actions/download-artifact@v4
        with:
          name: kani-results
          path: kani-results/
        continue-on-error: true

      - name: Comment PR with summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const resultDir = 'kani-results';
            if (!fs.existsSync(resultDir)) {
              github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '⚠ Kani verification did not produce results.'
              });
              return;
            }
            let body = '## 🔍 Kani Verification Summary\n\n';
            body += '${{ needs.kani-verify.result == \'success\' && \'✅ All proofs passed\' || \'❌ Verification failed\' }}\n';
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
