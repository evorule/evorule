# =============================================================================
# GitHub Actions: Kani 形式化验证
#
# 验证两个 crate 的 Kani proof (仅限能在 CI 预算内通过的验证)：
#
# evorule-tcb (12 个 proof - 全部为纯函数,状态空间小):
#   - verify_value_roundtrip, verify_path_no_panic, ...
#
# evorule-reactor (3 个 proof - 已过滤掉因堆分配状态爆炸而超时的 proof):
#   - invariant_version_monotonic (版本单调递增)
#   - max_rounds_termination (终止性)
#   - invariant_cause_queue_sync (P0-11 cause 队列同步)
#
# 注意：tier1 中其他 proof (如 invariant_io_count_*) 因涉及复杂的堆分配
# 数据结构(HashMap/Vec),CBMC 建模时会产生状态空间爆炸,即使给予 24h
# 超时也无法完成。这些 proof 将在本地/专用硬件环境下运行,或通过代码审查
# 替代,不阻塞 CI。
#
# Kani 版本: 0.14.0 (最新稳定版,支持 Rust 2021 edition)
# Rust 版本: nightly-2024-07-25 (Kani 官方推荐)
# =============================================================================

name: kani

on:
  push:
    branches: [main]
    paths:
      - "evorule-tcb/src/**"
      - "evorule-tcb/verification/**"
      - "evorule-tcb/Cargo.toml"
      - "evorule-reactor/src/**"
      - "evorule-reactor/verification/**"
      - "evorule-reactor/Cargo.toml"
      - "Cargo.toml"
      - ".github/workflows/kani.yml"
  pull_request:
    paths:
      - "evorule-tcb/src/**"
      - "evorule-tcb/verification/**"
      - "evorule-tcb/Cargo.toml"
      - "evorule-reactor/src/**"
      - "evorule-reactor/verification/**"
      - "evorule-reactor/Cargo.toml"
      - "Cargo.toml"
      - ".github/workflows/kani.yml"
  workflow_dispatch:
    inputs:
      crate:
        description: "Crate to verify (evorule-tcb / evorule-reactor / all)"
        required: false
        default: "all"
      proof:
        description: "Specific proof to verify (default: all)"
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always
  KANI_VERSION: "0.14.0"

jobs:
  kani-verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 30 # 每个 crate 的 CI 验证预算为 30 分钟
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: evorule-tcb
            # tier0 纯函数验证,verify_termination_kani 需 unwind 65+ (MAX_TRANSFORM_RULES + 1)
            verify_cmd: "cargo kani -p evorule-tcb --output-format=terse --default-unwind 80"
          - crate: evorule-reactor
            # tier1 状态机验证,需要稍大 unwind,但仅限简单 proof
            verify_cmd: "cargo kani -p evorule-reactor --output-format=terse --default-unwind 4"

    steps:
      - name: Skip check (workflow_dispatch crate filter)
        id: skip
        run: |
          REQUESTED="${{ github.event.inputs.crate }}"
          CURRENT="${{ matrix.crate }}"
          if [ -n "$REQUESTED" ] && [ "$REQUESTED" != "all" ] && [ "$REQUESTED" != "$CURRENT" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "==> Skipping $CURRENT (requested: $REQUESTED)"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "==> Will verify $CURRENT"
          fi

      - name: Checkout
        if: steps.skip.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Install Rust toolchain (nightly for Kani 0.14.0)
        if: steps.skip.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2024-07-25
          components: rustfmt, clippy

      - name: Cache cargo
        if: steps.skip.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: kani-${{ runner.os }}-${{ matrix.crate }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            kani-${{ runner.os }}-${{ matrix.crate }}-
            kani-${{ runner.os }}-

      - name: Install Kani ${{ env.KANI_VERSION }}
        if: steps.skip.outputs.skip != 'true'
        run: |
          cargo install --locked kani-verifier --version "$KANI_VERSION" --root "$HOME/.cargo"
          cargo kani setup
          cargo kani --version

      - name: Verify proofs (${{ matrix.crate }})
        if: steps.skip.outputs.skip != 'true'
        run: |
          set -e
          PROOF="${{ github.event.inputs.proof }}"
          if [ -n "$PROOF" ]; then
            echo "==> [${{ matrix.crate }}] Running specific proof: $PROOF"
            ${{ matrix.verify_cmd }} --proof "$PROOF"
          else
            echo "==> [${{ matrix.crate }}] Running all proofs"
            ${{ matrix.verify_cmd }}
          fi

      - name: Upload Kani results (${{ matrix.crate }})
        if: always() && steps.skip.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kani-results-${{ matrix.crate }}
          path: |
            target/kani/
          retention-days: 30

  kani-summary:
    runs-on: ubuntu-22.04
    needs: kani-verify
    if: always()
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Kani results (evorule-tcb)
        uses: actions/download-artifact@v4
        with:
          name: kani-results-evorule-tcb
          path: kani-results/evorule-tcb/
        continue-on-error: true

      - name: Download Kani results (evorule-reactor)
        uses: actions/download-artifact@v4
        with:
          name: kani-results-evorule-reactor
          path: kani-results/evorule-reactor/
        continue-on-error: true

      - name: Comment PR with summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            // needs.kani-verify.result 返回的是矩阵结果数组，如 ['success', 'failure']
            const results = ${{ needs.kani-verify.result }};
            const getStatus = (idx) => {
              if (results[idx] === 'success') return '✅ passed';
              if (results[idx] === 'failure') return '❌ failed';
              return '⏭️ skipped';
            };
            const body = '## 🔍 Kani Verification Summary (CI Budget)\n\n' +
              '| Crate | Status |\n|---|---|\n' +
              '| evorule-tcb | ' + getStatus(0) + ' |\n' +
              '| evorule-reactor | ' + getStatus(1) + ' |\n\n' +
              '*Note: tier1 proofs limited to 3 simple proofs to fit CI budget. Complex proofs (e.g. io_count) require local/high-memory hardware.*';
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
