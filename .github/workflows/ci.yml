name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ===== 格式检查 + lint =====
  lint:
    name: Clippy + fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: 安装系统依赖（SQLite）
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev pkg-config

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ===== TypeScript SDK 检查 =====
  ts-check:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: 安装依赖
        working-directory: sdk/typescript
        run: npm ci

      - name: TypeScript 类型检查
        working-directory: sdk/typescript
        run: npm run typecheck

  # ===== Python SDK 检查 =====
  py-check:
    name: Python SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: sdk/python/pyproject.toml

      - name: 安装依赖
        working-directory: sdk/python
        run: pip install -e .

      - name: Python 语法检查
        working-directory: sdk/python
        run: python -m py_compile evorule/*.py

  # ===== Rust 单元 + 集成测试 =====
  test:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 安装系统依赖（SQLite）
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev pkg-config

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test --workspace --all-features

  # ===== 编译验证 =====
  build-bin:
    name: Build evorule-server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 安装系统依赖（SQLite）
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev pkg-config

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2

      - name: 编译 evorule-server (release)
        run: cargo build --release --bin evorule-server

      - name: 上传二进制产物
        uses: actions/upload-artifact@v4
        with:
          name: evorule-server-linux-x86_64
          path: target/release/evorule-server
          retention-days: 7

  # ===== E2E 测试 =====
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build-bin]
    steps:
      - uses: actions/checkout@v4

      - name: 安装系统依赖（SQLite）
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev pkg-config

      - name: 下载服务器二进制
        uses: actions/download-artifact@v4
        with:
          name: evorule-server-linux-x86_64
          path: .

      - name: 赋予执行权限
        run: chmod +x evorule-server

      - name: 启动服务器
        run: ./evorule-server &
        env:
          RUST_LOG: info

      - name: 等待服务器启动
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:18080/api/health | grep -q "success"; then
              echo "Server started"
              break
            fi
            sleep 1
          done

      - name: TypeScript E2E 测试
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: 安装 TypeScript SDK 依赖
        working-directory: sdk/typescript
        run: npm ci

      - name: 运行 TypeScript E2E 测试
        working-directory: sdk/typescript
        run: npm run test:e2e

      - name: Python E2E 测试
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: sdk/python/pyproject.toml

      - name: 安装 Python SDK（含开发依赖）
        working-directory: sdk/python
        run: pip install -e ".[dev]"

      - name: 运行 Python E2E 测试
        working-directory: sdk/python
        run: python tests/test_e2e.py

      - name: 停止服务器
        run: pkill evorule-server || true
