# CI for EvoRule workspace (evorule-tcb / evorule-reactor / evorule-governance / evorule-cli)
#
# Covers:
# - two-platform (Linux / Windows) full cargo test --workspace
# - evorule-cli end-to-end tests (tests/e2e.sh, TAP format)
# - TCB build gate (build.rs runs automatically during cargo build)
# - i18n dual-language gate (docs zh/en drift + server code->err.* dict pairing)
# - verification status sync gate (STATUS.md <-> evidence base <-> docs/CI lists, scripts/check_status_sync.py)
# - ASSURANCE spec compliance gate (spec/status separation, T-series enforcement, scripts/check_assurance_compliance.py)
# - doc safety gate (L1 zero private-info leakage + CHANGELOG six-category governance, scripts/check_doc_safety.py)
#
# Design notes:
# - test matrix covers the currently supported platforms (Linux / Windows)
# - rust-version 1.74; stable toolchain for backward compatibility
name: CI

on:
  push:
    branches: [main, master, "release/**"]
  pull_request:
    branches: [main, master]
  # manual trigger allowed
  workflow_dispatch:

# Explicit minimal permissions (Scorecard Token-Permissions): CI only needs read
permissions: read-all

env:
  CARGO_TERM_COLOR: always

jobs:
  # ==========================================================================
  # 1. Full test suite, all platforms
  # ==========================================================================
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Differential test source: the sole copy of agent_constitution.json lives in the evo-agent repo
      # (differential_test.rs candidate 4 = repo-root sibling location); a single-repo checkout misses the source and goes red.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: evorule/evo-agent
          path: evo-agent

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      # cache cargo build artifacts (cache shared across platforms; key includes the runner to avoid conflicts)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: . -> target

      - name: Full test suite (workspace)
        run: cargo test --workspace --all-targets

      - name: Doc tests
        run: cargo test --workspace --doc

      - name: Compile check (release, gate verification)
        run: cargo build --workspace --release

  # ==========================================================================
  # 2. evorule-cli end-to-end tests (bash e2e.sh)
  #    Linux only (the script depends on bash + mktemp, matching CI intent)
  # ==========================================================================
  e2e:
    name: e2e (cli)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: . -> target

      - name: Build the release binary
        run: cargo build -p evorule-cli --release --bin evorule

      - name: Run e2e.sh (TAP output)
        run: bash evorule-cli/tests/e2e.sh ./target/release/evorule

      - name: Run Rust integration tests (cli_test)
        run: cargo test -p evorule-cli --test cli_test --release

  # ==========================================================================
  # 3. TCB determinism dedicated job (zero-dependency gate + proptest)
  # ==========================================================================
  tcb-determinism:
    name: tcb determinism
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: . -> target

      # proptest determinism property tests (random sampling verifies same input -> same output)
      - name: TCB determinism property tests
        run: cargo test -p evorule-tcb --test determinism_proptest --release

      # the build gate already ran with cargo build; explicitly verify the zero-dependency artifact
      - name: TCB zero-dependency artifact verification
        run: |
          cargo build -p evorule-tcb --release
          # check the compiled artifact has no external dependencies (Rust std only)
          cargo tree -p evorule-tcb --edges normal

  # ==========================================================================
  # 4. Language gates (single-master conversion: en-only base, ratchet baseline)
  #    L3: en-only scan — new CJK outside allowlist/stock baseline is red
  #        (scripts/en_only_scan.py; allowlist shrink-only)
  #    L1-1: server code→err.* dict pairing (cross-repo, product i18n face,
  #          scripts/check_error_code_i18n.py; missing dict entry is red)
  #    NOTE: former docs bilingual anchor gate (check_docs_bilingual.py)
  #    retired in the same batch (mutual exclusion, see conversion design).
  # ==========================================================================
  i18n-gates:
    name: language gates (en-only scan + error code dict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: en-only scan (allowlist + stock ratchet)
        run: python3 scripts/en_only_scan.py --ratchet scripts/en-only-baseline.txt

      - name: checkout sibling snapshots (L1-1 cross-repo pairing)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: evorule/evorule-server
          path: sibling/evorule-server

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: evorule/evorule-console-cloud
          path: sibling/evorule-console-cloud

      - name: server code→err.* dict pairing (zh/en)
        run: |
          python3 scripts/check_error_code_i18n.py \
            --server-rs sibling/evorule-server/evorule-server/src/api/server.rs \
            --console-dir sibling/evorule-console-cloud/src/lib/locale

  # ==========================================================================
  # 5. Verification status sync gate (M1/M5 continuous enforcement, pure text scan, no Rust toolchain needed)
  #    Prevents three-layer drift: STATUS.md (single source of truth) <-> evidence base <-> docs/CI lists
  #    S-series 11 rules: status vocabulary / status<->evidence closure / naming pairing / FAIL fields /
  #    quarantine / evidence freshness (git log -L) / CI gate alignment / external numbers / version alignment / disclosure trail
  #    Note: S7/S11 depend on full git history, so fetch-depth: 0 is required
  # ==========================================================================
  status-sync:
    name: verification status sync (S1-S11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Verification status consistency (STATUS.md <-> evidence <-> docs/CI)
        run: python3 scripts/check_status_sync.py

  # ==========================================================================
  # 5b. ASSURANCE spec compliance gate (spec/status separation enforcement, pure text scan, no Rust toolchain needed)
  #     T-series rules: spec body zero status words (T1) / zero SHA (T2) / zero tolerance for internal info (T3) /
  #     external-material comparative ban (T4) / grade-claim ban (T5) / status-carrying discipline (T6)
  # ==========================================================================
  assurance-compliance:
    name: assurance compliance (T1-T6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: ASSURANCE spec compliance (spec body / external materials / verification top-level docs)
        run: python3 scripts/check_assurance_compliance.py

  # ==========================================================================
  # 5c. Doc safety gate (forms a dual safety check with status-sync)
  #     R-series rules: L1 zero private-info leakage in public docs (M9) + zero agent-identity leakage +
  #     cross-reference integrity + CHANGELOG six-category content governance.
  #     R-gate 1 (staged check) is automatically an empty set in CI (no staging-area semantics), not affecting other rules.
  # ==========================================================================
  doc-safety:
    name: doc safety (R rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # full fetch to carry git tags -- the CHANGELOG vs latest-tag alignment check depends on tags;
          # under a shallow clone the tag set is empty and that check no-ops green (cause of the
          # "local gate red but CI green" blind spot)
          fetch-depth: 0

      - name: L1 doc safety and reference integrity
        run: python3 scripts/check_doc_safety.py

  # ==========================================================================
  # 5d. Public-face matrix scan (all file types, pure text scan)
  #     Vocabulary, five categories: AI identity / vendor names / internal batch numbers / private paths & repo names / governance context.
  #     This job counts A1 (AI identity) and B (internal numbers) into the exit code (red);
  #     categories C/D are review-only today and do not block; they will be tightened category by category after stock disposal.
  #     Exemption list: ratchet baseline (scripts/public-face-matrix-baseline.txt, stock frozen + zero tolerance for
  #     increments; key = category|path|line-content md5, immune to line-number drift).
  # ==========================================================================
  public-face-scan:
    name: public face scan (A1/B blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Public-face matrix scan (AI identity + internal number blocking)
        run: python3 scripts/scan_public_face.py --fail-on A1 --fail-on B --ratchet scripts/public-face-matrix-baseline.txt

  # ==========================================================================
  # 5f. Cross-language hash parity (G5/P1-4: Python reference implementation vs kernel SSOT golden vectors)
  #     Closing the v4 lesson: each side being self-consistent is not compatibility; a parity test is mandatory (CI-enforced).
  #     Vector set, 11 groups (7 standard facts + domain_attr both states + CJK newline + i64 boundary),
  #     exported by actually running the kernel SSOT (scripts/g5_golden_vectors.json).
  # ==========================================================================
  cross-lang-parity:
    name: cross-lang parity (python vs rust ssot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install blake3
        run: pip install blake3
      - name: Golden vector parity (standalone Python implementation vs Rust SSOT export)
        run: python3 scripts/cross_lang_verifier.py scripts/g5_golden_vectors.json

  # ==========================================================================
  # 5e. Constitution linkage gate ([CON-R-003] codified obligation, pure text scan)
  #     Semantic path (evorule-tcb / evorule-discipline) changes -> the PR description must contain
  #     a "constitution linkage:" marker line; missing is red.
  # ==========================================================================
  constitution-linkage:
    name: constitution linkage (CON-R-003)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # the three-dot diff needs the merge base; full history guarantees merge-base availability
          fetch-depth: 0

      - name: Semantic path changes -> PR description must carry the constitution-linkage marker
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 scripts/check_constitution_linkage.py --base "origin/${{ github.base_ref }}"

  # ==========================================================================
  # 6. Dependency gate (cargo-deny, A2 supply-chain triad)
  #    license compliance (deny.toml [licenses]) + RUSTSEC advisories ([advisories])
  #    + duplicate deps/wildcards ([bans]) + source allowlist ([sources])
  # ==========================================================================
  deny:
    name: deny (licenses + advisories + bans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
