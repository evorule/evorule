# OpenSSF Scorecard (A4)
#
# 每周二 UTC 04:00 例行扫描 + main push 触发。
# publish_results: true → 结果进入公共 API (api.securityscorecards.dev)，
# README 的 Scorecard 徽章据此实时渲染。
# （注意: 输入名是 publish_results 而非 publish——publish 会被
#  scorecard-action 静默忽略且 publish_results 落回 false, 首跑已踩坑）
# SARIF 同步上传至 Code Scanning，安全告警在 GitHub Security tab 可见。

name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 2"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@05b42c624433fc40578a4040d5cf5e36ddca8cde # v2.4.2
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
        with:
          sarif_file: results.sarif
