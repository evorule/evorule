# OpenSSF Scorecard (A4)
#
# Weekly scan every Tuesday 04:00 UTC + main push trigger.
# publish_results: true -> results enter the public API (api.securityscorecards.dev),
# which renders the Scorecard badge in the README in near real time.
# (Note: the input name is publish_results, not publish -- publish is silently
#  ignored by scorecard-action and publish_results falls back to false; first-run pitfall)
# SARIF is also uploaded to Code Scanning; security alerts are visible in the GitHub Security tab.

name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 2"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@05b42c624433fc40578a4040d5cf5e36ddca8cde # v2.4.2
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
        with:
          sarif_file: results.sarif
