# =============================================================================
# GitHub Actions: Mutation Testing (cargo-mutants)
#
# Verifies that evorule-tcb tests **really catch bugs**. Each mutant injects a tiny
# change, then the test suite runs to see whether it detects it. "MISSED" mutants
# are blind spots of the test suite.
#
# Schedule: every Sunday 00:00 UTC (nightly run, does not block PRs)
# Manual: can be triggered via workflow_dispatch
#
# Per mutant: ~30s - 2min (compile + 227 tests)
# Total: ~1500 mutants x 1min ~= 25h
# =============================================================================

name: mutants

on:
  schedule:
    - cron: "0 0 * * 0"  # Weekly Sunday 00:00 UTC
  workflow_dispatch:
    inputs:
      timeout_min:
        description: "Timeout in minutes (default: 360 = 6h)"
        required: false
        default: "360"

# Explicit minimal permissions (Scorecard Token-Permissions): mutation testing only needs read (artifacts go through artifact upload)
permissions: read-all

env:
  CARGO_TERM_COLOR: always

jobs:
  mutation-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 720  # 12h per job (GitHub Actions max)

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            evorule-tcb/target
          key: cargo-mutants-${{ runner.os }}-${{ hashFiles('evorule-tcb/Cargo.toml') }}
          restore-keys: |
            cargo-mutants-${{ runner.os }}-

      - name: Install cargo-mutants
        run: |
          cargo install --locked cargo-mutants
          cargo mutants --version

      - name: Run mutation testing
        working-directory: evorule-tcb
        run: |
          set -e
          mkdir -p mutants.out
          cargo mutants \
            --timeout 120 \
            --output mutants.out/ \
            --jobs $(nproc)

      - name: Upload mutation results
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: mutation-results
          path: |
            evorule-tcb/mutants.out/
          retention-days: 90

      - name: Parse summary
        if: always()
        working-directory: evorule-tcb
        run: |
          if [ -f mutants.out/mutants.json ]; then
            echo "## Mutation Testing Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            python3 -c "
              import json, sys
              try:
                  with open('mutants.out/mutants.json') as f:
                      data = json.load(f)
                  total = len(data.get('outcomes', []))
                  caught = sum(1 for o in data['outcomes'] if o.get('status') == 'caught')
                  missed = sum(1 for o in data['outcomes'] if o.get('status') == 'missed')
                  if total > 0:
                      score = (caught / total) * 100
                      print(f'**Total mutants**: {total}')
                      print(f'**Caught**: {caught}')
                      print(f'**Missed**: {missed}')
                      print(f'**Score**: {score:.1f}%')
                      if score < 60:
                          print('⚠ Mutation score < 60%. Tests may have blind spots.')
                          sys.exit(0)  # dont fail build, just warn
              except Exception as e:
                  print(f'Could not parse mutants.json: {e}')
            " >> $GITHUB_STEP_SUMMARY 2>&1 || true
          else
            echo "No mutants.json produced" >> $GITHUB_STEP_SUMMARY
          fi
          cat $GITHUB_STEP_SUMMARY
