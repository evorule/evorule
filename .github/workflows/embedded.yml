# Embedded compile gate (no_std dual targets: Cortex-M4F / RISC-V interrupt state)
#
# Covers:
# - embedded dual-target compile gate: the two core crates (audit-chain / mcu) must keep
#   compiling for thumbv7em-none-eabihf (ARM Cortex-M4F) and riscv32imac-unknown-none-elf
#   (RISC-V interrupt state) -- the 3rd/4th compile targets formalized, preventing
#   decay of the embedded adaptation surface
# - embedded adaptation-line guard: CI enforcement of the adaptation-surface decay
#   trigger -- more than 50 adaptation lines is red, and red is the start condition
#   for the Runtime trait abstraction refactor
# - board dependency-graph scan gate: board-specific dependencies (stm32f4xx /
#   ch32-metapac / ch32-hal / riscv-rt / embedded-hal) are only allowed in the
#   boards/ standalone build directories; any occurrence in a main-workspace member's
#   Cargo.toml is red -- zero hal dependencies enter the main dependency graph
#
# Design notes:
# - cargo check instead of build: the dual-target gate targets "type/dependency
#   portability"; firmware linking and cross-target runtime comparison are handled
#   by job 4 (qemu-parity) -- QEMU mps2-an386 emulation runs the same scenarios,
#   asserted byte-for-byte against the native baseline chain-tail hash; CI enforces directly
# - the no_std core code carries zero adaptation lines: the core crates are purely
#   portable no_std and the dual-target build shares the host build path; the
#   adaptation-line guard prevents future decay (baseline = 0)
name: Embedded Gate

on:
  push:
    branches: [main, master, "release/**"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions: read-all

env:
  CARGO_TERM_COLOR: always

jobs:
  # ==========================================================================
  # 1. Embedded dual-target compile gate (two core crates)
  # ==========================================================================
  embedded-check:
    name: ${{ matrix.target }} check (audit-chain + mcu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - thumbv7em-none-eabihf
          - riscv32imac-unknown-none-elf
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}

      # Key: rust-toolchain.toml pins 1.98.1; the rustup shim installs 1.98.1 along with the file
      # (minimal profile, no targets) -- this step installs the embedded target into the "effective
      # toolchain" (= the file-pinned 1.98.1) to align with the local environment; same first-run
      # lesson as wasm-check: targets attached to dtolnay@stable install into the wrong toolchain.
      - name: Install ${{ matrix.target }} into the effective toolchain
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: . -> target
          key: embedded-${{ matrix.target }}

      - name: ${{ matrix.target }} compile check (two core crates)
        run: cargo check --target ${{ matrix.target }} -p evorule-audit-chain -p evorule-mcu

      # tlsf-alloc gated face (board allocator wrapper) passes the dual-target gate separately
      - name: ${{ matrix.target }} compile check (mcu tlsf-alloc feature)
        run: cargo check --target ${{ matrix.target }} -p evorule-mcu --features tlsf-alloc

  # ==========================================================================
  # 2. Embedded adaptation-line guard (CI enforcement of the adaptation-surface decay trigger)
  #    Counting scope: embedded-target cfg lines (target_arch="arm"/
  #    "riscv32"/target_os="none") and embedded-specific reference lines (cortex-m /
  #    embedded-hal etc.) in the two core crates' src. Baseline = 0 (the core crates are
  #    purely portable no_std; gating lives in Cargo.toml dev-deps and firmware
  #    examples, not in src).
  #    Threshold = 50: above threshold is red, and red is the start condition for
  #    the Runtime trait abstraction refactor -- this job hardens that trigger from
  #    "human memory" into "machine enforcement".
  # ==========================================================================
  embedded-adaptation-guard:
    name: embedded adaptation lines (threshold 50)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Adaptation-line count and threshold verdict
        run: |
          COUNT=$(grep -rnE 'target_arch *= *"(arm|riscv32)"|target_os *= *"none"|cortex_m|cortex-m|embedded_hal|embedded-hal|thumbv|no_main' \
            evorule-audit-chain/src evorule-mcu/src \
            --include='*.rs' | wc -l)
          echo "Embedded adaptation lines: ${COUNT} (threshold 50, baseline 0)"
          if [ "${COUNT}" -gt 50 ]; then
            echo "::error::Embedded adaptation lines ${COUNT} > 50 -- Runtime trait abstraction refactor start condition triggered; start the trait refactor project before extending the adaptation surface"
            exit 1
          fi

  # ==========================================================================
  # 3. Board dependency-graph scan gate (zero hal dependencies enter the main dependency graph)
  #    boards/ are standalone build directories (excluded by the parent Cargo.toml;
  #    each carries its own .cargo config and memory.x); board-specific dependencies
  #    are only allowed there; any occurrence in a main-workspace member's Cargo.toml
  #    is red. The list includes ch32-hal (git-only approach, rejected, to prevent git
  #    dependencies from sneaking in via a detour).
  # ==========================================================================
  board-dep-scan:
    name: board deps stay out of main workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Scan main-workspace members' Cargo.toml for board-specific dependencies
        run: |
          HITS=$(grep -rnE 'stm32f4xx|ch32-metapac|ch32-hal|riscv-rt|embedded-hal' \
            evorule-*/Cargo.toml || true)
          if [ -n "${HITS}" ]; then
            echo "::error::Board-specific dependencies leaked into a main-workspace member -- zero hal dependencies enter the main dependency graph (the board face is limited to the boards/ standalone build directories)"
            echo "${HITS}"
            exit 1
          fi
          echo "scan passed: main-workspace members carry no board-specific dependencies (stm32f4xx / ch32-metapac / ch32-hal / riscv-rt / embedded-hal)"

  # ==========================================================================
  # 4. QEMU emulation parity gate (cross-target runtime bit-for-bit consistency)
  #    The same rule package + same instruction sequence + same fixed responses run
  #    on both ends -- host (native reference) and mps2-an386 firmware
  #    (thumbv7em-none-eabihf) -- with the chain-tail hashes asserted byte-for-byte equal:
  #    - parity scenario (parity_rules.evopack): full increment/noop three-instruction chain
  #    - io_resume scenario (io_resume_rules.evopack): full call_external pause-
  #      resume protocol (IoRequest enqueues pause -> IoBridge executes -> IoResponse
  #      injection -> instruction re-push consumption -> __io_results__ container cleared)
  #    Enforcement meaning: any change that would fork the no_std kernel's audit chain
  #    from the std host's (hash-chain SSOT / fact emission semantics / I/O resume
  #    protocol / TLSF allocator) goes red in CI, no longer relying on manual local comparisons.
  # ==========================================================================
  qemu-parity:
    name: qemu parity (mps2-an386 vs native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Install thumbv7em-none-eabihf into the effective toolchain
        run: rustup target add thumbv7em-none-eabihf

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: . -> target
          key: qemu-parity

      - name: Install QEMU (ARM system emulation)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-arm
          qemu-system-arm --version

      - name: Native baseline chain tails (host, both scenarios)
        run: |
          set -o pipefail
          cargo run --release -p evorule-mcu --example native_parity_tail | tee /tmp/native_parity.out
          cargo run --release -p evorule-mcu --example native_io_resume_tail | tee /tmp/native_io_resume.out
          grep -oE 'CHAIN_TAIL=[0-9a-f]{64}' /tmp/native_parity.out | cut -d= -f2 > /tmp/native_parity.tail
          grep -oE 'IO_CHAIN_TAIL=[0-9a-f]{64}' /tmp/native_io_resume.out | cut -d= -f2 > /tmp/native_io_resume.tail
          echo "native parity: $(cat /tmp/native_parity.tail)"
          echo "native io    : $(cat /tmp/native_io_resume.tail)"

      - name: Cross-compile the QEMU firmware
        run: |
          cargo build --release --target thumbv7em-none-eabihf \
            -p evorule-mcu --features qemu,tlsf-alloc \
            --example qemu_parity --example qemu_io_resume

      - name: QEMU emulation, parity scenario
        run: |
          set -o pipefail
          timeout 120 qemu-system-arm -machine mps2-an386 -nographic \
            -semihosting-config enable=on,target=native \
            -kernel target/thumbv7em-none-eabihf/release/examples/qemu_parity \
            | tee /tmp/qemu_parity.out
          grep -oE 'CHAIN_TAIL=[0-9a-f]{64}' /tmp/qemu_parity.out | cut -d= -f2 > /tmp/qemu_parity.tail
          echo "qemu parity  : $(cat /tmp/qemu_parity.tail)"

      - name: QEMU emulation, io_resume scenario
        run: |
          set -o pipefail
          timeout 120 qemu-system-arm -machine mps2-an386 -nographic \
            -semihosting-config enable=on,target=native \
            -kernel target/thumbv7em-none-eabihf/release/examples/qemu_io_resume \
            | tee /tmp/qemu_io_resume.out
          grep -oE 'IO_CHAIN_TAIL=[0-9a-f]{64}' /tmp/qemu_io_resume.out | cut -d= -f2 > /tmp/qemu_io_resume.tail
          echo "qemu io      : $(cat /tmp/qemu_io_resume.tail)"

      - name: Chain-tail byte-for-byte assertion (native == qemu)
        run: |
          diff /tmp/native_parity.tail /tmp/qemu_parity.tail
          diff /tmp/native_io_resume.tail /tmp/qemu_io_resume.tail
          echo "parity passed: chain-tail hashes match byte-for-byte between native and qemu in both the parity and io_resume scenarios"
