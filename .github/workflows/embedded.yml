# 嵌入式编译门禁 (SC3-a, 依据《多目标能力演进总体规划》)
#
# 覆盖:
# - 嵌入式双目标编译门禁: 核心两 crate (audit-chain / mcu) 必须持续可通过
#   thumbv7em-none-eabihf (ARM Cortex-M4F) 与 riscv32imac-unknown-none-elf
#   (RISC-V 中断态) 编译——第 3/4 编译目标正式化, 防嵌入式适配面腐化
# - 嵌入式适配行数守卫: 《多目标能力演进总体规划》§5.2 触发条件的 CI 化——
#   适配行数 > 50 即红, 红即触发 Runtime trait 抽象重构 (该文档第九节方案 B)
#   的启动条件
# - 板级依赖图扫描门 (SC3-b): 板级专属依赖 (stm32f4xx / ch32-metapac /
#   ch32-hal / riscv-rt / embedded-hal) 只允许出现在 boards/ 独立构建目录,
#   主 workspace 任一成员 Cargo.toml 出现即红——hal 依赖零进主依赖图
#
# 设计说明:
# - cargo check 而非 build: 双目标门禁的目标是"类型/依赖可移植性"; 固件
#   链接与跨目标运行时对拍由 job 4 (qemu-parity) 承担——QEMU mps2-an386
#   仿真跑同场景, 与 native 基准链尾哈希逐字节比对断言, CI 即执法
# - no_std 本体代码零适配行: 核心 crate 为纯可移植 no_std, 双目标编译
#   与 host 编译路径同源; 适配行守卫防未来腐化 (基线 = 0)
name: Embedded Gate

on:
  push:
    branches: [main, master, "release/**"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions: read-all

env:
  CARGO_TERM_COLOR: always

jobs:
  # ==========================================================================
  # 1. 嵌入式双目标编译门禁 (核心两 crate)
  # ==========================================================================
  embedded-check:
    name: ${{ matrix.target }} check (audit-chain + mcu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - thumbv7em-none-eabihf
          - riscv32imac-unknown-none-elf
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}

      # 关键: rust-toolchain.toml 锁定 1.98.1, rustup shim 会随文件自动装 1.98.1
      # (minimal profile, 不含任何 target)——此步对"生效工具链"(=文件锁定的
      # 1.98.1)补装嵌入式目标, 与本地环境对齐; 同 wasm-check 首跑教训:
      # targets 挂在 dtolnay@stable 上装不对工具链。
      - name: 对生效工具链补装 ${{ matrix.target }}
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: . -> target
          key: embedded-${{ matrix.target }}

      - name: ${{ matrix.target }} 编译检查 (核心两 crate)
        run: cargo check --target ${{ matrix.target }} -p evorule-audit-chain -p evorule-mcu

      # tlsf-alloc 门控面（板级分配器包装）单独过双目标门禁
      - name: ${{ matrix.target }} 编译检查 (mcu tlsf-alloc feature)
        run: cargo check --target ${{ matrix.target }} -p evorule-mcu --features tlsf-alloc

  # ==========================================================================
  # 2. 嵌入式适配行数守卫 (《多目标能力演进总体规划》§5.2 触发条件 CI 化)
  #    计数口径: 核心两 crate src 中嵌入式目标 cfg (target_arch="arm"/
  #    "riscv32"/target_os="none") 与 cortex-m / embedded-hal 等嵌入式
  #    专属引用行。基线 = 0 (核心 crate 纯可移植 no_std, 门控落
  #    Cargo.toml dev-deps 与固件 example, 不进 src)。
  #    阈值 = 50: 超阈值即红, 红即该文档 §5.2 触发 Runtime trait 抽象
  #    重构的启动条件——本 job 把该触发从"人工记忆"固化为"机器执法"。
  # ==========================================================================
  embedded-adaptation-guard:
    name: embedded adaptation lines (threshold 50)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: 适配行数统计与阈值判定
        run: |
          COUNT=$(grep -rnE 'target_arch *= *"(arm|riscv32)"|target_os *= *"none"|cortex_m|cortex-m|embedded_hal|embedded-hal|thumbv|no_main' \
            evorule-audit-chain/src evorule-mcu/src \
            --include='*.rs' | wc -l)
          echo "嵌入式适配行数: ${COUNT} (阈值 50, 基线 0)"
          if [ "${COUNT}" -gt 50 ]; then
            echo "::error::嵌入式适配行数 ${COUNT} > 50——触发《多目标能力演进总体规划》§5.2 Runtime trait 抽象重构启动条件, 须先立项 trait 重构再扩适配面"
            exit 1
          fi

  # ==========================================================================
  # 3. 板级依赖图扫描门 (SC3-b: hal 依赖零进主依赖图)
  #    boards/ 为独立构建目录（父 Cargo.toml exclude，各含 .cargo 配置与
  #    memory.x），板级专属依赖只允许出现在该目录；主 workspace 任一成员
  #    的 Cargo.toml 出现即红。名单含 ch32-hal（git-only 方案，已否决，
  #    防 git 依赖绕道混入）。
  # ==========================================================================
  board-dep-scan:
    name: board deps stay out of main workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: 主 workspace 成员 Cargo.toml 扫描板级专属依赖
        run: |
          HITS=$(grep -rnE 'stm32f4xx|ch32-metapac|ch32-hal|riscv-rt|embedded-hal' \
            evorule-*/Cargo.toml || true)
          if [ -n "${HITS}" ]; then
            echo "::error::板级专属依赖混入主 workspace 成员——hal 依赖零进主依赖图（板级面仅限 boards/ 独立构建目录）"
            echo "${HITS}"
            exit 1
          fi
          echo "扫描通过: 主 workspace 成员无板级专属依赖 (stm32f4xx / ch32-metapac / ch32-hal / riscv-rt / embedded-hal)"

  # ==========================================================================
  # 4. QEMU 仿真对拍门禁 (跨目标运行时逐位一致性)
  #    同一规则包 + 同一指令序列 + 同一固定应答, 在 host (native 参照) 与
  #    mps2-an386 固件 (thumbv7em-none-eabihf) 双端执行, 链尾哈希逐字节
  #    比对断言相等:
  #    - parity 场景 (parity_rules.evopack): increment/noop 三指令全链
  #    - io_resume 场景 (io_resume_rules.evopack): call_external 暂停-
  #      恢复全协议 (IoRequest 入链暂停 → IoBridge 执行 → IoResponse
  #      注入 → 指令重推消费 → __io_results__ 容器清除)
  #    执法意义: 任何使 no_std 内核与 std 宿主审计链分叉的改动 (哈希链
  #    SSOT / 事实发射语义 / I/O 恢复协议 / TLSF 分配器) 在 CI 即红,
  #    不再依赖本机手跑对拍。
  # ==========================================================================
  qemu-parity:
    name: qemu parity (mps2-an386 vs native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: 对生效工具链补装 thumbv7em-none-eabihf
        run: rustup target add thumbv7em-none-eabihf

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: . -> target
          key: qemu-parity

      - name: 安装 QEMU (arm 系统仿真)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-arm
          qemu-system-arm --version

      - name: native 基准链尾 (host 双场景)
        run: |
          set -o pipefail
          cargo run --release -p evorule-mcu --example native_parity_tail | tee /tmp/native_parity.out
          cargo run --release -p evorule-mcu --example native_io_resume_tail | tee /tmp/native_io_resume.out
          grep -oE 'CHAIN_TAIL=[0-9a-f]{64}' /tmp/native_parity.out | cut -d= -f2 > /tmp/native_parity.tail
          grep -oE 'IO_CHAIN_TAIL=[0-9a-f]{64}' /tmp/native_io_resume.out | cut -d= -f2 > /tmp/native_io_resume.tail
          echo "native parity: $(cat /tmp/native_parity.tail)"
          echo "native io    : $(cat /tmp/native_io_resume.tail)"

      - name: 交叉编译 QEMU 固件
        run: |
          cargo build --release --target thumbv7em-none-eabihf \
            -p evorule-mcu --features qemu,tlsf-alloc \
            --example qemu_parity --example qemu_io_resume

      - name: QEMU 仿真 parity 场景
        run: |
          set -o pipefail
          timeout 120 qemu-system-arm -machine mps2-an386 -nographic \
            -semihosting-config enable=on,target=native \
            -kernel target/thumbv7em-none-eabihf/release/examples/qemu_parity \
            | tee /tmp/qemu_parity.out
          grep -oE 'CHAIN_TAIL=[0-9a-f]{64}' /tmp/qemu_parity.out | cut -d= -f2 > /tmp/qemu_parity.tail
          echo "qemu parity  : $(cat /tmp/qemu_parity.tail)"

      - name: QEMU 仿真 io_resume 场景
        run: |
          set -o pipefail
          timeout 120 qemu-system-arm -machine mps2-an386 -nographic \
            -semihosting-config enable=on,target=native \
            -kernel target/thumbv7em-none-eabihf/release/examples/qemu_io_resume \
            | tee /tmp/qemu_io_resume.out
          grep -oE 'IO_CHAIN_TAIL=[0-9a-f]{64}' /tmp/qemu_io_resume.out | cut -d= -f2 > /tmp/qemu_io_resume.tail
          echo "qemu io      : $(cat /tmp/qemu_io_resume.tail)"

      - name: 链尾逐字节比对断言 (native == qemu)
        run: |
          diff /tmp/native_parity.tail /tmp/qemu_parity.tail
          diff /tmp/native_io_resume.tail /tmp/qemu_io_resume.tail
          echo "对拍通过: parity 与 io_resume 双场景链尾哈希 native 与 qemu 逐字节一致"
