# Fuzz workflow for EvoRule (A1 供应链三件套)
#
# 覆盖:
# - fuzz_resolve_path:  TCB path.rs 路径解析（resolve_path / resolve_path_mut）
# - fuzz_json_display:  JsonValue 边界构造 → Display 序列化
#
# 策略:
# - push/PR 触碰 evorule-tcb/** 或 fuzz/** 时执行构建 + 每目标 60s smoke
# - libFuzzer smoke 仅作冒烟（发现 panic 即红）；长期蓄水池运行可后续加 cron 长跑 job
# - fuzz/ 为独立 workspace（父 Cargo.toml exclude），使用 nightly 工具链
# - 不触碰哈希链与审计面（最高原则）：目标仅调用只读/无副作用 API

name: Fuzz

on:
  push:
    branches: [main, master, "release/**"]
    paths:
      - "evorule-tcb/**"
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "evorule-tcb/**"
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"
  workflow_dispatch:

# 显式最小权限 (Scorecard Token-Permissions): 冒烟仅需只读
permissions: read-all

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz-smoke:
    name: fuzz smoke (build + 60s/target)
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      # 覆盖仓根 rust-toolchain.toml 的固定工具链: cargo-fuzz 的 -Z sancov flags
      # 只被 nightly 接受, 首跑因稳定版工具链拒绝 -Z 而失败 (run 34732535959)
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296 # nightly

      - name: 安装 cargo-fuzz
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: cargo-fuzz

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            . -> target
            fuzz -> target
          key: fuzz

      - name: 冒烟运行 (每目标 60s, panic 即红)
        run: |
          # --target 显式 host 三元组: cargo-fuzz 0.14+ 在 Linux 默认 musl 静态目标,
          # 与 sanitizer 不兼容且 nightly 镜像缺 musl std (run 34732535959 二次失败根因)
          cargo fuzz run fuzz-resolve-path --target x86_64-unknown-linux-gnu -- -max_total_time=60 -rss_limit_mb=4096
          cargo fuzz run fuzz-json-display --target x86_64-unknown-linux-gnu -- -max_total_time=60 -rss_limit_mb=4096
