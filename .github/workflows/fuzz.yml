# Fuzz workflow for EvoRule (A1 supply-chain triad)
#
# Covers:
# - fuzz_resolve_path:         TCB path.rs path resolution (resolve_path / resolve_path_mut)
# - fuzz_json_display:         JsonValue boundary construction -> Display serialization
# - fuzz_stable_json_hash:     audit chain stable serialization + fact hashing (pure-function face)
# - fuzz_wal_parse_roundtrip:  WAL parsing + Fact persistence roundtrip (Cursor, zero file IO)
# - fuzz_chain_invariants:     audit chain chained properties (chain decomposition / per-entry sensitivity / genesis)
#
# Strategy:
# - runs build + 60s smoke per target when push/PR touches evorule-tcb/** or fuzz/**
# - libFuzzer smoke is a smoke test only (any panic is red); a long-running reservoir cron job can be added later
# - fuzz/ is a standalone workspace (excluded by the parent Cargo.toml), using the nightly toolchain
# - no side effects is the highest principle: targets only call read-only / side-effect-free APIs (the three
#   audit-chain targets go through the pure-function face: evorule-audit-chain pure algorithms + reactor
#   pure parsing; write paths such as WalWriter/recover are forbidden)

name: Fuzz

on:
  push:
    branches: [main, master, "release/**"]
    paths:
      - "evorule-tcb/**"
      - "evorule-audit-chain/**"
      - "evorule-reactor/src/wal.rs"
      - "evorule-reactor/src/fact.rs"
      - "evorule-reactor/src/facts_log.rs"
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "evorule-tcb/**"
      - "evorule-audit-chain/**"
      - "evorule-reactor/src/wal.rs"
      - "evorule-reactor/src/fact.rs"
      - "evorule-reactor/src/facts_log.rs"
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"
  workflow_dispatch:

# Explicit minimal permissions (Scorecard Token-Permissions): smoke only needs read
permissions: read-all

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz-smoke:
    name: fuzz smoke (build + 60s/target)
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      # overrides the toolchain pinned by the repo-root rust-toolchain.toml: cargo-fuzz's -Z sancov flags
      # are only accepted by nightly; the first run failed because the stable toolchain rejected -Z (run 34732535959)
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296 # nightly

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: cargo-fuzz

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            . -> target
            fuzz -> target
          key: fuzz

      - name: Smoke run (60s per target, any panic is red)
        run: |
          # --target pins the host triple explicitly: cargo-fuzz 0.14+ defaults to the musl static
          # target on Linux, which is incompatible with sanitizers and the nightly image lacks musl std
          # (root cause of the second failure in run 34732535959)
          cargo fuzz run fuzz-resolve-path --target x86_64-unknown-linux-gnu -- -max_total_time=60 -rss_limit_mb=4096
          cargo fuzz run fuzz-json-display --target x86_64-unknown-linux-gnu -- -max_total_time=60 -rss_limit_mb=4096
          cargo fuzz run fuzz-stable-json-hash --target x86_64-unknown-linux-gnu -- -max_total_time=60 -rss_limit_mb=4096
          cargo fuzz run fuzz-wal-parse-roundtrip --target x86_64-unknown-linux-gnu -- -max_total_time=60 -rss_limit_mb=4096
          cargo fuzz run fuzz-chain-invariants --target x86_64-unknown-linux-gnu -- -max_total_time=60 -rss_limit_mb=4096
