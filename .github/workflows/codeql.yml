# CodeQL static analysis (A4 follow-up score item: Scorecard SAST 0 -> high)
#
# Covers: Rust whole workspace (tcb/reactor/governance/cli)
# Trigger: main push + weekly scan every Monday 03:00 UTC
# Results: GitHub Security tab (Code Scanning alerts)

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

# Explicit minimal permissions (Scorecard Token-Permissions): read-only by default
permissions: read-all

jobs:
  analyze:
    name: analyze (rust)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      security-events: write   # upload SARIF to Code Scanning
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
        with:
          languages: rust
          # The zero-dependency TCB build is very fast; autobuild takes the default cargo build path

      - name: Autobuild
        uses: github/codeql-action/autobuild@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
        with:
          category: "/language:rust"
