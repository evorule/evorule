# =============================================================================
# GitHub Actions: differential testing
#
# Verifies the three differential-test properties (verification code lives in each tier's verification/ directory):
#
# evorule-reactor (verification/differential_test.rs):
#   - diff_reactor_vs_pure: reactor::next_step and pure::next_step
#     produce the same state changes (runtime logic vs pure-function logic consistency)
#
# evorule-governance (verification/differential_test.rs):
#   - diff_version_consistency: facts_log.version() == reactor.state.version
#     (audit-chain version matches the reactor's internal state version)
#   - diff_rewind_vs_factslog: TimeMachine::rewind(facts, N).snapshot
#     matches the FactsLog replay snapshot at version N (time machine vs audit-chain rebuild)
#
# Trigger: tier1/tier2 source, verification/ directories, or the differential tests themselves
#
# Local equivalent commands:
#   cargo test --package evorule-reactor --test differential_test
#   cargo test --package evorule-governance --test differential_test
# =============================================================================

name: differential

on:
  push:
    branches: [main]
    paths:
      - "evorule-reactor/src/**"
      - "evorule-reactor/verification/differential_test.rs"
      - "evorule-reactor/Cargo.toml"
      - "evorule-governance/src/**"
      - "evorule-governance/verification/differential_test.rs"
      - "evorule-governance/Cargo.toml"
      - "Cargo.toml"
      - ".github/workflows/differential.yml"
  pull_request:
    paths:
      - "evorule-reactor/src/**"
      - "evorule-reactor/verification/differential_test.rs"
      - "evorule-reactor/Cargo.toml"
      - "evorule-governance/src/**"
      - "evorule-governance/verification/differential_test.rs"
      - "evorule-governance/Cargo.toml"
      - "Cargo.toml"
      - ".github/workflows/differential.yml"
  workflow_dispatch:
    inputs:
      cases:
        description: "Number of proptest cases (default: 256, CI: 1000)"
        required: false
        default: "256"

# Explicit minimal permissions (Scorecard Token-Permissions): read-only by default; write permissions declared per job where needed
permissions: read-all

env:
  CARGO_TERM_COLOR: always
  # default 256 cases (fast); CI can raise it to 1000 via workflow_dispatch
  PROPTEST_CASES: "256"

jobs:
  differential-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: evorule-reactor
            test_cmd: "cargo test --package evorule-reactor --test differential_test"
          - crate: evorule-governance
            test_cmd: "cargo test --package evorule-governance --test differential_test"

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Differential test source: the sole copy of agent_constitution.json lives in the evo-agent repo
      # (differential_test.rs candidate 4 = repo-root sibling location); a single-repo checkout misses the source and goes red.
      - name: Checkout evo-agent (constitution source)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: evorule/evo-agent
          path: evo-agent

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: differential-${{ runner.os }}-${{ matrix.crate }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            differential-${{ runner.os }}-${{ matrix.crate }}-
            differential-${{ runner.os }}-

      - name: Override proptest cases (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          CASES="${{ github.event.inputs.cases }}"
          echo "PROPTEST_CASES=$CASES" >> $GITHUB_ENV
          echo "==> Using PROPTEST_CASES=$CASES"

      - name: Run differential tests (${{ matrix.crate }})
        run: |
          echo "==> [${{ matrix.crate }}] Running differential tests (PROPTEST_CASES=$PROPTEST_CASES)"
          ${{ matrix.test_cmd }}

  differential-summary:
    runs-on: ubuntu-22.04
    needs: differential-test
    if: always()
    timeout-minutes: 5
    # the PR summary comment needs the issue/pull-request write API
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Comment PR with summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const result = '${{ needs.differential-test.result }}';
            const body = '## 🔬 Differential Testing Summary\n\n' +
              '| Crate | Status |\n|---|---|\n' +
              '| evorule-reactor (diff_reactor_vs_pure) | ' + (result === 'success' ? '✅ passed' : '❌ failed') + ' |\n' +
              '| evorule-governance (diff_version_consistency / diff_rewind_vs_factslog) | ' + (result === 'success' ? '✅ passed' : '❌ failed') + ' |\n\n' +
              'Matrix result: ' + result;
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
