# =============================================================================
# GitHub Actions: 差分测试(Differential Testing)
#
# 验证三个差分测试属性(验证代码位于各 tier 的 verification/ 目录):
#
# evorule-reactor（verification/differential_test.rs）:
#   - P0-12 diff_reactor_vs_pure: reactor::next_step 与 pure::next_step
#     产生相同状态变更(运行时逻辑 vs 纯函数逻辑一致性)
#
# evorule-governance（verification/differential_test.rs）:
#   - P0-9  diff_version_consistency: facts_log.version() == reactor.state.version
#     (审计链版本号与反应器内部状态版本号一致)
#   - P0-10 diff_rewind_vs_factslog: TimeMachine::rewind(facts, N).snapshot
#     与 FactsLog 重放到版本 N 的快照一致(时间机器 vs 审计链重建)
#
# 触发条件: tier1/tier2 源码、verification/ 目录或差分测试本身变更
#
# 本地等价命令:
#   cargo test --package evorule-reactor --test differential_test
#   cargo test --package evorule-governance --test differential_test
# =============================================================================

name: differential

on:
  push:
    branches: [main]
    paths:
      - "evorule-reactor/src/**"
      - "evorule-reactor/verification/differential_test.rs"
      - "evorule-reactor/Cargo.toml"
      - "evorule-governance/src/**"
      - "evorule-governance/verification/differential_test.rs"
      - "evorule-governance/Cargo.toml"
      - "Cargo.toml"
      - ".github/workflows/differential.yml"
  pull_request:
    paths:
      - "evorule-reactor/src/**"
      - "evorule-reactor/verification/differential_test.rs"
      - "evorule-reactor/Cargo.toml"
      - "evorule-governance/src/**"
      - "evorule-governance/verification/differential_test.rs"
      - "evorule-governance/Cargo.toml"
      - "Cargo.toml"
      - ".github/workflows/differential.yml"
  workflow_dispatch:
    inputs:
      cases:
        description: "Number of proptest cases (default: 256, CI: 1000)"
        required: false
        default: "256"

env:
  CARGO_TERM_COLOR: always
  # 默认 256 case(快速),CI 可通过 workflow_dispatch 提升至 1000
  PROPTEST_CASES: "256"

jobs:
  differential-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: evorule-reactor
            test_cmd: "cargo test --package evorule-reactor --test differential_test"
          - crate: evorule-governance
            test_cmd: "cargo test --package evorule-governance --test differential_test"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: differential-${{ runner.os }}-${{ matrix.crate }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            differential-${{ runner.os }}-${{ matrix.crate }}-
            differential-${{ runner.os }}-

      - name: Override proptest cases (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          CASES="${{ github.event.inputs.cases }}"
          echo "PROPTEST_CASES=$CASES" >> $GITHUB_ENV
          echo "==> Using PROPTEST_CASES=$CASES"

      - name: Run differential tests (${{ matrix.crate }})
        run: |
          echo "==> [${{ matrix.crate }}] Running differential tests (PROPTEST_CASES=$PROPTEST_CASES)"
          ${{ matrix.test_cmd }}

  differential-summary:
    runs-on: ubuntu-22.04
    needs: differential-test
    if: always()
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Comment PR with summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const result = '${{ needs.differential-test.result }}';
            const body = '## 🔬 Differential Testing Summary\n\n' +
              '| Crate | Status |\n|---|---|\n' +
              '| evorule-reactor (P0-12) | ' + (result === 'success' ? '✅ passed' : '❌ failed') + ' |\n' +
              '| evorule-governance (P0-9/P0-10) | ' + (result === 'success' ? '✅ passed' : '❌ failed') + ' |\n\n' +
              'Matrix result: ' + result;
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
