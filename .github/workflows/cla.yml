# CLA Assistant (contributor-assistant/github-action)
# Individual contributors: comment the statement below on a PR to sign:
#   I have read the CLA Document and I hereby sign the CLA
# Corporate contributors: read CLA-corporate.md and contact evorulelab@gmail.com first, then sign on the PR.
# Signature record: signatures/version1/cla.json (kept in git history, auditable).
# Document: CLA-individual.md (individual contributor license agreement under the AGPL-3.0 + commercial dual license).

name: "CLA Assistant"

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # If branch protection on main rejects signature commits, configure a PAT with write access and uncomment the line below:
          # PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/evorule/evorule/blob/main/CLA-individual.md'
          branch: 'main'
          # allowlist: signing-exempt accounts (project accounts + common bots). Add the project owner's personal account as needed.
          allowlist: 'evorule, EvoRuleLab, dependabot[bot], renovate[bot]'
