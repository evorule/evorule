name: Release CLI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "发布 tag（如 v0.2.4）。留空则使用推送的 tag。"
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ===== evorule-cli 多平台二进制构建 =====
  # 说明：evorule-cli 通过 crates.io 发布 + GitHub Release 附带原生二进制。
  # macOS 的 x86_64 与 aarch64 无法交叉编译（需 Apple SDK），故用原生 mac runner 分别构建；
  # Linux x86_64 / Windows x86_64 用各自原生 runner。
  build-cli:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bin: evorule
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin: evorule.exe
            archive: zip
          - target: x86_64-apple-darwin
            os: macos-13
            bin: evorule
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-14
            bin: evorule
            archive: tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: 编译（release）
        run: cargo build --release --bin evorule --target ${{ matrix.target }}

      - name: 打包（tar.gz）
        if: matrix.archive == 'tar.gz'
        # 注意：仓库 .cargo/config.toml 设置了 target-dir = ".build/rust"，
        # 产物不在默认 target/ 目录，必须用 cargo metadata 解析真实 target_directory。
        run: |
          TARGET_DIR=$(cargo metadata --no-deps --format-version 1 | python3 -c "import sys,json;print(json.load(sys.stdin)['target_directory'])")
          echo "target_dir=$TARGET_DIR"
          cd "$TARGET_DIR/${{ matrix.target }}/release"
          tar czf "$GITHUB_WORKSPACE/evorule-cli-${{ matrix.target }}.tar.gz" ${{ matrix.bin }}

      - name: 打包（zip）
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $td = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).target_directory
          Write-Host "target_dir=$td"
          Compress-Archive -Path "$td/${{ matrix.target }}/release/${{ matrix.bin }}" -DestinationPath "$env:GITHUB_WORKSPACE/evorule-cli-${{ matrix.target }}.zip"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: evorule-cli-${{ matrix.target }}
          path: evorule-cli-${{ matrix.target }}.*
          retention-days: 30

  # ===== 创建 GitHub Release =====
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-cli]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 解析发布 tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: 下载所有产物
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: 列出产物
        run: ls -la release-assets/

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            release-assets/evorule-cli-*.tar.gz
            release-assets/evorule-cli-*.zip
          body: |
            ## EvoRule CLI ${{ steps.tag.outputs.tag }}

            ### 📦 产物
            - `evorule-cli-x86_64-unknown-linux-gnu.tar.gz` — Linux x86_64
            - `evorule-cli-x86_64-pc-windows-msvc.zip` — Windows x86_64
            - `evorule-cli-x86_64-apple-darwin.tar.gz` — macOS x86_64 (Intel)
            - `evorule-cli-aarch64-apple-darwin.tar.gz` — macOS ARM64 (Apple Silicon)

            > 也支持 `cargo install evorule-cli` 从 crates.io 安装。

            ### 🚀 快速开始

            ```bash
            # Linux/macOS
            tar xzf evorule-cli-*.tar.gz
            chmod +x evorule
            ./evorule --help

            # Windows（解压 zip 后）
            .\evorule.exe --help
            ```

            ### 📋 说明
            - 本仓 release 以 evorule-cli 的 crates.io 发布为主，GitHub Release 附带原生二进制方便直接下载。
            - macOS 支持 Intel (x86_64) 与 Apple Silicon (aarch64)。
