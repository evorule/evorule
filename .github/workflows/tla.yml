# =============================================================================
# GitHub Actions: TLA+ 形式化验证
#
# 使用 TLC 模型检测器验证 tier0 execute_transition 状态机规格
#   - 模块: evorule-tcb/tla/ExecuteTransition.tla
#   - 配置: evorule-tcb/tla/ExecuteTransition.cfg
#   - 5 个不变式: Termination / Determinism / DepthEnforcement / IoEarlyReturn / LoopProgress
#
# 设计文档: EVORULE_FORMAL_VERTIFICATION_PLAN.md §9.3
# 通过条件: "Model checking completed. No error has been found."
# =============================================================================

name: tla

on:
  push:
    branches: [main]
    paths:
      - 'evorule-tcb/tla/**'
      - 'evorule-tcb/src/transition.rs'
      - 'evorule-tcb/src/executor.rs'
      - '.github/workflows/tla.yml'
  pull_request:
    paths:
      - 'evorule-tcb/tla/**'
      - 'evorule-tcb/src/transition.rs'
      - 'evorule-tcb/src/executor.rs'
      - '.github/workflows/tla.yml'
  workflow_dispatch:

jobs:
  tla-verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    continue-on-error: false  # v0.1.0 发布前统一为严格门禁（与 Gitee validate.yml allow_failure:false 一致）

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache tla2tools.jar
        id: cache-tla
        uses: actions/cache@v4
        with:
          path: evorule-tcb/tla/tla2tools.jar
          key: tla2tools-latest

      - name: Download tla2tools.jar
        if: steps.cache-tla.outputs.cache-hit != 'true'
        working-directory: evorule-tcb/tla
        run: |
          wget -q https://github.com/tlaplus/tlaplus/releases/latest/download/tla2tools.jar
          java -jar tla2tools.jar TLC -help | head -3

      - name: Run TLC model checker
        working-directory: evorule-tcb/tla
        run: |
          java -XX:+UseParallelGC -cp tla2tools.jar tlc2.TLC \
            -config ExecuteTransition.cfg ExecuteTransition

      - name: Upload TLC results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tlc-results
          path: |
            evorule-tcb/tla/states/
            evorule-tcb/tla/*.log
          retention-days: 7
