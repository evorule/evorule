# =============================================================================
# GitHub Actions: TLA+ formal verification
#
# Uses the TLC model checker to verify the tier0 execute_transition state machine spec
#   - module: evorule-tcb/tla/ExecuteTransition.tla
#   - config: evorule-tcb/tla/ExecuteTransition.cfg
#   - 5 invariants: Termination / Determinism / DepthEnforcement / IoEarlyReturn / LoopProgress
#
# Design doc: verification/plan/EVORULE_FORMAL_VERIFICATION_PLAN_v3.md §3.2.2
# Pass condition: "Model checking completed. No error has been found."
# =============================================================================

name: tla

on:
  push:
    branches: [main]
    paths:
      - 'evorule-tcb/tla/**'
      - 'evorule-tcb/src/transition.rs'
      - 'evorule-tcb/src/executor.rs'
      - '.github/workflows/tla.yml'
  pull_request:
    paths:
      - 'evorule-tcb/tla/**'
      - 'evorule-tcb/src/transition.rs'
      - 'evorule-tcb/src/executor.rs'
      - '.github/workflows/tla.yml'
  workflow_dispatch:

# Explicit minimal permissions (Scorecard Token-Permissions): model checking only needs read (artifacts go through artifact upload)
permissions: read-all

jobs:
  tla-verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    continue-on-error: false  # strict gate (allow_failure:false)

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache tla2tools.jar
        id: cache-tla
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: evorule-tcb/tla/tla2tools.jar
          key: tla2tools-v1.7.4

      - name: Download tla2tools.jar
        if: steps.cache-tla.outputs.cache-hit != 'true'
        working-directory: evorule-tcb/tla
        run: |
          # Pin v1.7.4 (TLC 2.19, 2024-08-08 build) -- matches the version measured in TLC_VERIFICATION_REPORT.md
          wget -q https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          java -jar tla2tools.jar TLC -help | head -3

      - name: Run TLC model checker
        working-directory: evorule-tcb/tla
        run: |
          java -XX:+UseParallelGC -cp tla2tools.jar tlc2.TLC \
            -config ExecuteTransition.cfg ExecuteTransition

      - name: Upload TLC results
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: tlc-results
          path: |
            evorule-tcb/tla/states/
            evorule-tcb/tla/*.log
          retention-days: 7
