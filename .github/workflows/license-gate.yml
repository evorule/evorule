# license-gate.yml — reusable dependency-license gate for ecosystem repos.
#
# Call from another repository with a pinned commit SHA (never @main):
#   uses: evorule/evorule/.github/workflows/license-gate.yml@<commit-sha>
#
# Checks:
#   1. The caller has a deny.toml whose [licenses] allow list is a superset
#      of the root-repo baseline (no silent narrowing; additions are allowed
#      and reported for upstreaming into the baseline).
#   2. cargo deny check (licenses + advisories + bans + sources) — same
#      profile as this repo's own ci.yml deny job; skipped for non-Cargo
#      repositories (npm-only / config-only repos still get check 1).

name: license-gate

on:
  workflow_call:
    inputs:
      extra-checkouts:
        description: "Space-separated 'repo@ref' tokens shallow-checked-out from evorule/<repo> as siblings of the caller workspace (resolves cross-repo path dependencies for cargo-deny). ref = commit SHA (pinned) or 'main' (floats with the sibling default branch)."
        required: false
        type: string
        default: ''
  workflow_dispatch:

permissions:
  contents: read

jobs:
  license-gate:
    name: license gate (baseline drift + cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Checkout extra sibling repositories (cross-repo path deps)
        if: inputs.extra-checkouts != ''
        run: |
          for tok in ${{ inputs.extra-checkouts }}; do
            repo="${tok%%@*}"; ref="${tok##*@}"
            if [ -z "$ref" ]; then ref="main"; fi
            echo "shallow-checking-out evorule/${repo} @ ${ref} -> ${GITHUB_WORKSPACE}/../${repo}"
            git init "${GITHUB_WORKSPACE}/../${repo}"
            git -C "${GITHUB_WORKSPACE}/../${repo}" remote add origin "https://github.com/evorule/${repo}.git"
            git -C "${GITHUB_WORKSPACE}/../${repo}" fetch --depth 1 origin "${ref}"
            git -C "${GITHUB_WORKSPACE}/../${repo}" checkout --detach FETCH_HEAD
          done

      - name: Checkout root baseline (deny.toml SSOT)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: evorule/evorule
          ref: main
          sparse-checkout: deny.toml
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          path: license-baseline

      - name: Baseline drift check (licenses allow superset)
        run: |
          test -f deny.toml || { echo "FAIL: deny.toml missing in caller repo"; exit 1; }
          python3 - <<'EOF'
          import sys, tomllib

          with open("license-baseline/deny.toml", "rb") as f:
              base = set(tomllib.load(f)["licenses"]["allow"])
          with open("deny.toml", "rb") as f:
              cur = set(tomllib.load(f)["licenses"]["allow"])

          missing = sorted(base - cur)
          added = sorted(cur - base)
          if missing:
              print("FAIL: [licenses] allow narrowed vs baseline; missing entries:")
              for m in missing:
                  print("  - " + m)
              sys.exit(1)
          if added:
              print("NOTE: entries beyond baseline (register for upstreaming):")
              for a in added:
                  print("  + " + a)
          print(f"OK: [licenses] allow ({len(cur)} entries) is a superset of baseline ({len(base)} entries)")
          EOF

      - name: "Install cargo-deny (runner-native: container action cannot see sibling checkouts outside the workspace mount)"
        if: hashFiles('Cargo.toml') != ''
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: cargo-deny

      - name: cargo deny check (licenses + advisories + bans + sources)
        if: hashFiles('Cargo.toml') != ''
        run: cargo deny check
