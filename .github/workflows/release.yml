name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本号（如 v0.1.0）"
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ===== 多平台二进制构建 =====
  # H5 + 走神 9 迁移后状态（2026-07-30 更新）：
  # - evorule-server 已两次外迁，最终在 evorule-server 独立仓（顶层独立 crate）
  # - evorule 仓本身 publish = false（不发布到 crates.io），但四个子 crate 各自独立 publish
  # - evorule-cli：已发布到 crates.io，用户用 `cargo install evorule-cli` 获取
  # - 因此 evorule 仓的 release workflow **整体不再适用**，evorule-server 多平台构建在 evorule-server 独立仓 release workflow
  #
  # 真正的 release 流程应在 evorule-application 仓执行：
  #   - crates.io 发布：evorule-application
  #   - GitHub Release：evorule-server 多平台二进制
  #   - Docker 镜像：evorule-server 容器
  #
  # 本文件保留作为 evorule-application 仓 release workflow 的模板参考。
  # 实际启用前请：
  #   1. 复制此 workflow 到 evorule-application/.github/workflows/release.yml
  #   2. 移除 evorule 仓特有的 path filter / cross compile 配置
  #   3. 在 evorule-application 仓启用
  build-binaries:
    name: Build ${{ matrix.target }} (disabled - moved to evorule-application)
    runs-on: ${{ matrix.os }}
    if: false  # H5: 暂时禁用,待 evorule-application release workflow 建立
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
            cross: false
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
            cross: false

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 安装系统依赖（Linux SQLite）
        if: runner.os == 'Linux' && !matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev pkg-config

      - name: 安装 cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: 编译（原生）
        if: "!matrix.cross"
        run: cargo build --release --bin evorule-server --target ${{ matrix.target }}

      - name: 编译（cross）
        if: matrix.cross
        run: cross build --release --bin evorule-server --target ${{ matrix.target }}

      - name: 打包（Linux/macOS tar.gz）
        if: matrix.archive == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../evorule-server-${{ matrix.target }}.tar.gz evorule-server
          cd ../..

      - name: 打包（Windows zip）
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/evorule-server.exe" -DestinationPath "evorule-server-${{ matrix.target }}.zip"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: evorule-server-${{ matrix.target }}
          path: evorule-server-${{ matrix.target }}.*
          retention-days: 30

  # ===== Docker 镜像构建 =====
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/evorule-server
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 导出 Docker 镜像 tar
        run: |
          docker pull ghcr.io/${{ github.repository }}/evorule-server:latest
          docker save ghcr.io/${{ github.repository }}/evorule-server:latest -o evorule-server.docker.tar

      - name: 上传 Docker 镜像
        uses: actions/upload-artifact@v4
        with:
          name: evorule-server-docker
          path: evorule-server.docker.tar
          retention-days: 30

  # ===== 创建 GitHub Release =====
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-binaries, build-docker]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 下载所有产物
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: 列出产物
        run: ls -la release-assets/

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/evorule-server-*.tar.gz
            release-assets/evorule-server-*.zip
            release-assets/evorule-server.docker.tar
          body: |
            ## evorule-server ${{ github.ref_name }}

            ### 📦 产物
            - `evorule-server-x86_64-unknown-linux-gnu.tar.gz` — Linux x86_64
            - `evorule-server-aarch64-unknown-linux-gnu.tar.gz` — Linux ARM64
            - `evorule-server-x86_64-pc-windows-msvc.zip` — Windows x86_64
            - `evorule-server-aarch64-apple-darwin.tar.gz` — macOS ARM64 (Apple Silicon)
            - `evorule-server-x86_64-apple-darwin.tar.gz` — macOS x86_64 (Intel)
            - `evorule-server.docker.tar` — Docker 镜像

            ### 🚀 快速开始

            ```bash
            # Linux/macOS
            tar xzf evorule-server-*.tar.gz
            chmod +x evorule-server
            ./evorule-server --help

            # Docker
            docker load -i evorule-server.docker.tar
            docker run -p 18080:18080 evorule-server
            ```

            ### 🐳 Docker 镜像
            ```bash
            docker pull ghcr.io/${{ github.repository }}/evorule-server:${{ github.ref_name }}
            docker pull ghcr.io/${{ github.repository }}/evorule-server:latest
            ```

            ### 📋 验证清单
            - ✅ 所有单元测试通过
            - ✅ Clippy 代码质量检查通过
            - ✅ TypeScript SDK E2E 测试通过
            - ✅ Python SDK E2E 测试通过
            - ✅ 多平台编译成功
