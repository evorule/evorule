# Release workflow for EvoRule
#
# Trigger: push of a v* tag
# Artifacts: two-platform binaries (GitHub Release attachments)
#   - Linux   x86_64 (ubuntu-latest, static musl)
#   - Windows x86_64 (windows-latest)
#
# Design notes:
# - the release matrix covers the currently supported platforms (Linux / Windows) --
#   no macOS (product decision 2026-09-11, red line; 2026-10-13 restored the red line's
#   validity, removing the once-recurred macOS matrix)
# - Linux uses musl static linking, producing a single executable
# - tag format: v0.1.0 / v0.2.4 etc.
# - binaries are signed by cosign keyless (OIDC); the .sig is published with the Release, see SIGNING.md

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: read-all

env:
  CARGO_TERM_COLOR: always

jobs:
  # ==========================================================================
  # 0. M4 release sync gate (verification/MECHANISM.md M4)
  #    - STATUS.md snapshot version = the version of the tag being released
  #    - the kani.yml kani-tcb-a-tier job green on the commit being released (tier A Kani CI)
  # ==========================================================================
  release-gate:
    name: M4 release gate (STATUS snapshot + A-tier Kani)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Gate-bypass assertion (fail if EVORULE_SKIP_GATE exists)
        # Compensating detection: the four crates' build.rs skip valves are fail-closed, but if the
        # build/release machine's environment retains this variable (even =0), the gate silently
        # skips during cargo build with no warning anywhere.
        # Exists -> reject -- the value is never echoed, preventing the variable's content from leaking into logs.
        run: |
          set -e
          [ -z "${EVORULE_SKIP_GATE+x}" ] || { echo "ERROR: EVORULE_SKIP_GATE is set (value not echoed) -- the build environment retains a gate-bypass variable; release forbidden"; exit 1; }

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Verify STATUS.md snapshot version = tag version
        run: |
          set -e
          TAG="${GITHUB_REF_NAME#v}"
          SNAP=$(grep -m1 '快照' verification/STATUS.md | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
          echo "tag=v${TAG}  STATUS.md snapshot=${SNAP}"
          if [ -z "${SNAP}" ]; then
            echo "ERROR: could not parse the snapshot version from verification/STATUS.md"
            exit 1
          fi
          if [ "${SNAP}" != "v${TAG}" ]; then
            echo "ERROR: STATUS.md snapshot (${SNAP}) != tag (v${TAG}); sync the verification docs per MECHANISM.md M4 before releasing"
            exit 1
          fi

      - name: Verify tier A Kani CI (kani.yml kani-tcb-a-tier) is green on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          SHA="${GITHUB_SHA}"
          # Race fix (2026-10-10, proven in the v0.8.2 release): kani.yml and this pipeline are
          # enqueued by the same push; this step originally only looked at "completed" runs --
          # while kani was still in flight it misjudged "no completed run" and rejected.
          # Changed to a bounded wait (900s): in-flight is not a failure, and on timeout it still
          # rejects for missing green evidence (fail-closed unchanged).
          DEADLINE=$((SECONDS + 900))
          while :; do
            RUN_IDS=$(gh run list --workflow kani.yml --commit "${SHA}" --limit 10 --json databaseId,status,conclusion \
              | python3 -c 'import json,sys; runs=json.load(sys.stdin); print(" ".join(str(r["databaseId"]) for r in runs if r["status"]=="completed"))')
            OK=""
            for RID in ${RUN_IDS}; do
              CONC=$(gh run view "${RID}" --json jobs \
                | python3 -c 'import json,sys; jobs=json.load(sys.stdin)["jobs"]; a=[j for j in jobs if j["name"].startswith("kani-tcb-a-tier")]; print(a[0]["conclusion"] if a else "missing")')
              echo "kani.yml run ${RID}: kani-tcb-a-tier = ${CONC}"
              if [ "${CONC}" = "success" ]; then OK=1; break; fi
            done
            if [ -n "${OK}" ]; then
              echo "M4: kani-tcb-a-tier green evidence confirmed (commit ${SHA})"
              break
            fi
            if [ ${SECONDS} -ge ${DEADLINE} ]; then
              echo "ERROR: after the 900s bounded wait there is still no green kani-tcb-a-tier on commit ${SHA} (MECHANISM.md M4)"
              exit 1
            fi
            echo "no completed green kani.yml run yet, re-checking in 30s (bounded wait)..."
            sleep 30
          done

  # ==========================================================================
  # 1. crates.io publishing (hard constraint: a release must sync crates.io)
  #    dependency order: tcb -> reactor -> governance -> cli
  #    prerequisite: repo Settings -> Secrets and variables -> Actions, configure CARGO_REGISTRY_TOKEN
  # ==========================================================================
  publish-crates:
    needs: [dist-gate, release-gate]
    name: publish crates.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Publish the five core crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -e
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            {
              echo "### ⚠️ crates.io publishing blocked (fail-closed)"
              echo ""
              echo "The CARGO_REGISTRY_TOKEN secret is not configured, so the release hard constraint 'a release must sync crates.io' cannot be met."
              echo "Historical lesson (2026-10-13 proof): when the secret was missing this step silently faked green (6-second success)"
              echo "while crates.io was actually not published -- every version since v0.8.1 was completed by a manual local publish."
              echo "Fix: repo Settings -> Secrets and variables -> Actions, configure CARGO_REGISTRY_TOKEN (crates.io publish token), then rerun-failed-jobs after adding it."
            } >> "${GITHUB_STEP_SUMMARY}"
            echo "ERROR: CARGO_REGISTRY_TOKEN secret not configured - crates.io publishing blocked (fail-closed, no silent fake green); rerun this job after adding the secret"
            exit 1
          fi
          # dependency order covers all 9 publishable workspace members (publish=false only eval/fuzz):
          # discipline is a registry dependency of cli (evorule-discipline ^x.y.z),
          # audit-chain/mcu/evid-verify-core/evid-verify-wasm were added in v0.9.0
          # (audit-chain was omitted since its 0.8.1 introduction; downstream resolution of the new version would fail),
          # evid-verify-wasm depends on evid-verify-core, so the order must keep dependencies first.
          for p in evorule-tcb evorule-audit-chain evid-verify-core evid-verify-wasm evorule-reactor evorule-mcu evorule-governance evorule-discipline evorule-cli; do
            echo "publishing $p ..."
            if cargo publish -p "$p" > /tmp/pub_$p.log 2>&1; then
              echo "$p published"
              cat /tmp/pub_$p.log
            elif grep -qE "already exists|is already uploaded" /tmp/pub_$p.log; then
              echo "$p already on crates.io (idempotent skip: published manually first, or a rerun scenario)"
              cat /tmp/pub_$p.log
            else
              echo "$p publish FAILED"
              cat /tmp/pub_$p.log
              exit 1
            fi
            sleep 15  # wait for the crates.io index update so downstream dependency resolution is ready
          done

  # ==========================================================================
  # 2. Two-platform matrix build
  # ==========================================================================
  build:
    needs: [dist-gate, release-gate]
    runs-on: ${{ matrix.os }}
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: evorule-linux-x86_64
            ext: ""
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: evorule-windows-x86_64
            ext: ".exe"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: . -> target

      - name: Install musl toolchain (Linux)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # the toolchain pinned by the repo-root rust-toolchain.toml takes effect when cargo runs,
      # overriding the targets passed to the action above -- this step ensures the target
      # is installed under the actually-effective toolchain so subsequent --target builds work.
      - name: Install the build target
        run: rustup target add ${{ matrix.target }}

      - name: Build the CLI binary
        run: cargo build -p evorule-cli --release --target ${{ matrix.target }} --bin evorule

      # rename with the platform suffix before uploading so filenames stay unique when
      # merge-multiple converges (the two platforms' renamed artifacts do not overwrite each other)
      - name: Add the platform suffix
        shell: bash
        run: |
          mkdir -p stage
          cp "target/${{ matrix.target }}/release/evorule${{ matrix.ext }}" "stage/${{ matrix.artifact }}${{ matrix.ext }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ${{ matrix.artifact }}
          path: stage/${{ matrix.artifact }}${{ matrix.ext }}

  # ==========================================================================
  # 2. cosign keyless signing of the release binaries (OIDC, no key management)
  #    signatures stored as .sig, published as Release assets. Verification: SIGNING.md.
  # ==========================================================================
  sign:
    name: sign (cosign keyless)
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC token required for cosign keyless signing
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Download the Linux build artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: evorule-linux-x86_64
          path: sign/linux

      - name: Download the Windows build artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: evorule-windows-x86_64
          path: sign/windows

      - name: Install cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0

      - name: Keyless signing (OIDC)
        run: |
          mkdir -p sigout
          cosign sign-blob --yes \
            sign/linux/evorule-linux-x86_64 \
            --output-signature sigout/evorule-linux-x86_64.sig
          cosign sign-blob --yes \
            sign/windows/evorule-windows-x86_64.exe \
            --output-signature sigout/evorule-windows-x86_64.exe.sig
          ls -la sigout

      - name: Upload the signature artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: evorule-sigs
          path: sigout/

  # ==========================================================================
  # 3.5 CycloneDX SBOM generation (A3 supply-chain triad)
  #     every workspace member's .cdx.json is published with the GitHub Release,
  #     so downstream ISVs can meet their supply-chain compliance (e.g. EU CRA,
  #     customer security questionnaires).
  # ==========================================================================
  sbom:
    name: sbom (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: . -> target

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked

      - name: Generate SBOM (whole workspace, JSON)
        run: cargo cyclonedx --all --format json

      # cargo-cyclonedx writes artifacts into each member directory; collect them into sbom/
      - name: Collect SBOM artifacts
        run: |
          mkdir -p sbom
          find . -maxdepth 2 -name '*.cdx.json' -not -path './target/*' -exec mv {} sbom/ \;
          ls -la sbom/

      - name: Upload the SBOM artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: evorule-sbom
          path: sbom/*.cdx.json

  # ==========================================================================
  # 3.6 Compliance companion bundle (five pieces) + source tarball (AGPL §4/§13)
  #     binaries are bare attachments on the Release: the license text / third-party
  #     notices / source entry go in the standalone compliance archive
  #     evorule-<ver>-compliance.zip attached to the Release (links alone do not
  #     satisfy the companion obligation). SOURCE.md is generated dynamically per
  #     release (per SOURCE.md's own rule: the packaging process overrides with the
  #     values matching this release and distributes it in the bundle; carrying a
  #     stale fingerprint table is forbidden).
  # ==========================================================================
  compliance:
    name: compliance bundle + source tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Generate SOURCE.md, the source tarball, and the five-piece compliance archive
        run: |
          set -e
          VER="${GITHUB_REF_NAME#v}"
          SRC_TGZ="evorule-${VER}-source.tar.gz"
          git archive --format=tar.gz --prefix="evorule-${VER}/" -o "${SRC_TGZ}" HEAD
          SRC_SHA=$(sha256sum "${SRC_TGZ}" | cut -d' ' -f1)
          cat > SOURCE.md <<'EOF'
          <!--
            Copyright 2026 EvoRule Project

            SPDX-License-Identifier: AGPL-3.0-or-later
          -->

          # EvoRule - Source Code Offer (AGPL-3.0 §13)

          This compliance archive is distributed together with the release artifacts (binaries /
          crates.io packages) of EvoRule v@@VER@@, licensed under AGPL-3.0-or-later. This file is
          generated dynamically per release (the fingerprint table filled with actual values) and
          serves to locate and verify the complete source code corresponding to those artifacts
          (AGPL-3.0 section 13).

          | Field | Value |
          |---|---|
          | Release tag | v@@VER@@ |
          | Source repository (authoritative source) | <https://github.com/evorule/evorule> |
          | Source tarball | `evorule-@@VER@@-source.tar.gz` (distributed as a Release attachment) |
          | Source tarball SHA256 | `@@SHA@@` |

          ## How to obtain and verify

          1. `git clone` the repository above, `git checkout v@@VER@@`
          2. Reproduce the archive: `git archive --format=tar.gz --prefix=evorule-@@VER@@/ -o evorule-@@VER@@-source.tar.gz HEAD`
          3. Compute the SHA256 and compare it with the value above (the same record is also in `sha256-checks.txt`, published with the Release)

          ## Third-party components

          For license texts and attribution notices see `THIRD-PARTY-NOTICES.md` and `LICENSES/third-party/` in this archive.

          ## Distribution channels

          - binaries (GitHub Release attachments) are published together with this compliance archive
          - crates.io packages automatically carry the repo-root `LICENSE` via cargo publish
          EOF
          sed -i "s/@@VER@@/${VER}/g; s/@@SHA@@/${SRC_SHA}/g" SOURCE.md
          DIR="evorule-${VER}-compliance"
          mkdir -p "${DIR}/LICENSES"
          cp LICENSE NOTICE.md THIRD-PARTY-NOTICES.md SOURCE.md "${DIR}/"
          cp -r LICENSES/third-party "${DIR}/LICENSES/third-party"
          zip -qr "${DIR}.zip" "${DIR}"
          ls -la "${DIR}.zip" "${SRC_TGZ}"

      - name: Upload the compliance artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: evorule-compliance
          path: |
            evorule-*-compliance.zip
            evorule-*-source.tar.gz
          if-no-files-found: error

  # ==========================================================================
  # 4. Aggregate publish (GitHub Release)
  # ==========================================================================
  release:
    name: release
    needs: [dist-gate, build, sign, sbom, compliance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Download all binaries
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: artifacts
          merge-multiple: true

      # with merge-multiple=true, artifacts/ contains the artifacts themselves with platform
      # suffixes (see the build suffix step); the two targets' filenames are unique -- existence check only
      - name: Verify the artifacts
        run: |
          ls -la artifacts/
          test -f artifacts/evorule-linux-x86_64
          test -f artifacts/evorule-windows-x86_64.exe

      - name: Download the signatures
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: evorule-sigs
          path: sigs

      - name: Download the SBOM
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: evorule-sbom
          path: sbom

      - name: Download the compliance artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: evorule-compliance
          path: compliance

      # SOURCE.md promises downloaders: the source tarball SHA256 is recorded in
      # sha256-checks.txt published with the Release -- this step generates that
      # promise file (covering the binaries and the compliance archive)
      - name: Generate sha256-checks.txt
        run: |
          set -e
          sha256sum artifacts/evorule-linux-x86_64 artifacts/evorule-windows-x86_64.exe compliance/evorule-*-compliance.zip compliance/evorule-*-source.tar.gz > sha256-checks.txt
          cat sha256-checks.txt

      - name: Create the Release with binaries and SBOM attached
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            artifacts/evorule-linux-x86_64
            artifacts/evorule-windows-x86_64.exe
            sigs/evorule-linux-x86_64.sig
            sigs/evorule-windows-x86_64.exe.sig
            sbom/*.cdx.json
            compliance/evorule-*-compliance.zip
            compliance/evorule-*-source.tar.gz
            sha256-checks.txt
          generate_release_notes: true

  dist-gate:
    name: dist compliance gate
    permissions:
      contents: read
    uses: evorule/evorule/.github/workflows/dist-gate.yml@a3aa299151fa3cfbf0d9fe6b659b5f91cb909807
    with:
      repo: evorule
