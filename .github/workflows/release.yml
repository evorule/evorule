# Release workflow for EvoRule
#
# 触发: 推送 v* tag
# 产物: 双平台二进制 (GitHub Release 附件)
#   - Linux   x86_64 (ubuntu-latest, 静态 musl)
#   - Windows x86_64 (windows-latest)
#
# 设计说明:
# - 发布矩阵覆盖当前支持的平台 (Linux / Windows)——不发 macOS（产品决策
#   2026-09-11，红线；2026-10-13 恢复红线效度，移除曾复发的 macOS 矩阵）
# - Linux 用 musl 静态链接, 产出单一可执行文件
# - tag 格式: v0.1.0 / v0.2.4 等
# - 二进制由 cosign keyless (OIDC) 签名, .sig 随 Release 发布, 见 SIGNING.md

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: read-all

env:
  CARGO_TERM_COLOR: always

jobs:
  # ==========================================================================
  # 0. M4 发布同步门禁 (verification/MECHANISM.md M4)
  #    - STATUS.md 快照版本 = 待发布 tag 版本
  #    - kani.yml kani-tcb-a-tier job 在待发布 commit 上绿 (A 档 Kani CI)
  # ==========================================================================
  release-gate:
    name: M4 release gate (STATUS snapshot + A-tier Kani)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: 门禁旁路断言 (EVORULE_SKIP_GATE 存在即 fail)
        # 补偿检测: 四 crate build.rs 跳过阀虽 fail-closed, 但若构建/发布机
        # 环境残留该变量(哪怕 =0), cargo build 时门禁静默跳过且无任何环节报警。
        # 存在即拒绝——值内容不回显, 防变量内容泄入日志。
        run: |
          set -e
          [ -z "${EVORULE_SKIP_GATE+x}" ] || { echo "ERROR: EVORULE_SKIP_GATE 已设置(值不回显)——构建环境残留门禁旁路变量, 禁止发布"; exit 1; }

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: 核对 STATUS.md 快照版本 = tag 版本
        run: |
          set -e
          TAG="${GITHUB_REF_NAME#v}"
          SNAP=$(grep -m1 '快照' verification/STATUS.md | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
          echo "tag=v${TAG}  STATUS.md 快照=${SNAP}"
          if [ -z "${SNAP}" ]; then
            echo "ERROR: 未能从 verification/STATUS.md 解析快照版本"
            exit 1
          fi
          if [ "${SNAP}" != "v${TAG}" ]; then
            echo "ERROR: STATUS.md 快照(${SNAP}) != tag(v${TAG})；按 MECHANISM.md M4 先同步验证文档再发布"
            exit 1
          fi

      - name: 核对 A 档 Kani CI（kani.yml kani-tcb-a-tier）在该 commit 上绿
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          SHA="${GITHUB_SHA}"
          # 竞态修复（2026-10-10，v0.8.2 发版实证）：kani.yml 与本流水线由同
          # 一 push 同时入队，本步原先只查"已完成"运行——kani 仍在途即误判
          # "无已完成运行"而拒绝。改为有界等待（900s）：在途不判负，超时仍
          # 按缺绿证据拒绝（fail-closed 不变）。
          DEADLINE=$((SECONDS + 900))
          while :; do
            RUN_IDS=$(gh run list --workflow kani.yml --commit "${SHA}" --limit 10 --json databaseId,status,conclusion \
              | python3 -c 'import json,sys; runs=json.load(sys.stdin); print(" ".join(str(r["databaseId"]) for r in runs if r["status"]=="completed"))')
            OK=""
            for RID in ${RUN_IDS}; do
              CONC=$(gh run view "${RID}" --json jobs \
                | python3 -c 'import json,sys; jobs=json.load(sys.stdin)["jobs"]; a=[j for j in jobs if j["name"].startswith("kani-tcb-a-tier")]; print(a[0]["conclusion"] if a else "missing")')
              echo "kani.yml run ${RID}: kani-tcb-a-tier = ${CONC}"
              if [ "${CONC}" = "success" ]; then OK=1; break; fi
            done
            if [ -n "${OK}" ]; then
              echo "M4: kani-tcb-a-tier 绿证据确认（commit ${SHA}）"
              break
            fi
            if [ ${SECONDS} -ge ${DEADLINE} ]; then
              echo "ERROR: 有界等待 900s 后 commit ${SHA} 上仍无绿 kani-tcb-a-tier（MECHANISM.md M4）"
              exit 1
            fi
            echo "kani.yml 尚无完成的绿运行，30s 后重查（有界等待中）..."
            sleep 30
          done

  # ==========================================================================
  # 1. crates.io 发布 (硬约束: 发版必须同步 crates.io)
  #    依赖序: tcb → reactor → governance → cli
  #    前置: repo Settings → Secrets and variables → Actions 配置 CARGO_REGISTRY_TOKEN
  # ==========================================================================
  publish-crates:
    needs: [dist-gate, release-gate]
    name: publish crates.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: 按依赖序发布五核心 crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -e
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            {
              echo "### ⚠️ crates.io 发布被阻断 (fail-closed)"
              echo ""
              echo "CARGO_REGISTRY_TOKEN secret 未配置，发版硬约束「发版必须同步 crates.io」无法满足。"
              echo "历史教训（2026-10-13 实证）：secret 缺失时本步曾静默假绿（6 秒 success），"
              echo "crates.io 实际未发布——v0.8.1 起各版本均由本机手工发布补齐。"
              echo "修复：repo Settings → Secrets and variables → Actions 配置 CARGO_REGISTRY_TOKEN（crates.io publish token），补配后 rerun-failed-jobs。"
            } >> "${GITHUB_STEP_SUMMARY}"
            echo "ERROR: CARGO_REGISTRY_TOKEN secret 未配置 - crates.io 发布阻断(fail-closed, 禁止静默假绿); 补配 secret 后 rerun 本 job"
            exit 1
          fi
          # 依赖序含 workspace 全部 5 个可发布成员: discipline 是 cli 的
          # registry 依赖(evorule-discipline ^x.y.z), 漏列会使 cli 发布时
          # 解析不到新版本而失败(2026-10-10 v0.8.1 手工补发实证)。
          for p in evorule-tcb evorule-reactor evorule-governance evorule-discipline evorule-cli; do
            echo "publishing $p ..."
            if cargo publish -p "$p" > /tmp/pub_$p.log 2>&1; then
              echo "$p published"
              cat /tmp/pub_$p.log
            elif grep -qE "already exists|is already uploaded" /tmp/pub_$p.log; then
              echo "$p 已在 crates.io(幂等跳过: 手工先行或重跑场景)"
              cat /tmp/pub_$p.log
            else
              echo "$p publish FAILED"
              cat /tmp/pub_$p.log
              exit 1
            fi
            sleep 15  # 等待 crates.io 索引更新, 避免下游依赖解析未就绪
          done

  # ==========================================================================
  # 2. 双平台矩阵构建
  # ==========================================================================
  build:
    needs: [dist-gate, release-gate]
    runs-on: ${{ matrix.os }}
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: evorule-linux-x86_64
            ext: ""
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: evorule-windows-x86_64
            ext: ".exe"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: . -> target

      - name: 安装 musl 工具链 (Linux)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # 仓根 rust-toolchain.toml 指定的工具链会在 cargo 运行时生效,
      # 并覆盖上方 action 传入的 targets 参数 —— 此步骤确保 target
      # 安装到实际生效的工具链下, 使后续 --target 构建可用。
      - name: 安装构建 target
        run: rustup target add ${{ matrix.target }}

      - name: 构建 CLI 二进制
        run: cargo build -p evorule-cli --release --target ${{ matrix.target }} --bin evorule

      # 以平台后缀重命名后再上传,使 merge-multiple 汇聚时文件名唯一
      # (双平台产物重命名后互不覆盖)
      - name: 补平台后缀
        shell: bash
        run: |
          mkdir -p stage
          cp "target/${{ matrix.target }}/release/evorule${{ matrix.ext }}" "stage/${{ matrix.artifact }}${{ matrix.ext }}"

      - name: 上传构建产物
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ${{ matrix.artifact }}
          path: stage/${{ matrix.artifact }}${{ matrix.ext }}

  # ==========================================================================
  # 2. 发布二进制 cosign keyless 签名 (OIDC, 无密钥管理)
  #    签名落库为 .sig, 随 Release 资产发布。验证见 SIGNING.md。
  # ==========================================================================
  sign:
    name: sign (cosign keyless)
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # cosign keyless 签名所需 OIDC token
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: 下载 Linux 构建产物
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: evorule-linux-x86_64
          path: sign/linux

      - name: 下载 Windows 构建产物
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: evorule-windows-x86_64
          path: sign/windows

      - name: 安装 cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0

      - name: Keyless 签名 (OIDC)
        run: |
          mkdir -p sigout
          cosign sign-blob --yes \
            sign/linux/evorule-linux-x86_64 \
            --output-signature sigout/evorule-linux-x86_64.sig
          cosign sign-blob --yes \
            sign/windows/evorule-windows-x86_64.exe \
            --output-signature sigout/evorule-windows-x86_64.exe.sig
          ls -la sigout

      - name: 上传签名产物
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: evorule-sigs
          path: sigout/

  # ==========================================================================
  # 3.5 CycloneDX SBOM 生成 (A3 供应链三件套)
  #     全 workspace 成员的 .cdx.json 随 GitHub Release / Gitee Release 发布,
  #     供下游 ISV 满足其供应链合规（如欧盟 CRA、客户安全问卷）。
  # ==========================================================================
  sbom:
    name: sbom (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: . -> target

      - name: 安装 cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked

      - name: 生成 SBOM (全 workspace, JSON)
        run: cargo cyclonedx --all --format json

      # cargo-cyclonedx 将产物写到各 member 目录,统一收集到 sbom/
      - name: 收集 SBOM 产物
        run: |
          mkdir -p sbom
          find . -maxdepth 2 -name '*.cdx.json' -not -path './target/*' -exec mv {} sbom/ \;
          ls -la sbom/

      - name: 上传 SBOM 产物
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: evorule-sbom
          path: sbom/*.cdx.json

  # ==========================================================================
  # 3.6 合规随附包 (五件套) + 源码 tarball (AGPL §4/§13)
  #     二进制为裸附件直附 Release: 许可正文/第三方声明/源码入口以独立合规
  #     归档 evorule-<ver>-compliance.zip 随 Release 附加 (纯链接不满足随附
  #     义务)。SOURCE.md 按本次发布动态生成 (遵守 SOURCE.md 自身规定: 打包
  #     流程以本次发布对应的值覆盖后随包分发, 禁止携带过期指纹表)。
  # ==========================================================================
  compliance:
    name: compliance bundle + source tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: 生成 SOURCE.md、源码 tarball 与五件套合规归档
        run: |
          set -e
          VER="${GITHUB_REF_NAME#v}"
          SRC_TGZ="evorule-${VER}-source.tar.gz"
          git archive --format=tar.gz --prefix="evorule-${VER}/" -o "${SRC_TGZ}" HEAD
          SRC_SHA=$(sha256sum "${SRC_TGZ}" | cut -d' ' -f1)
          cat > SOURCE.md <<'EOF'
          <!--
            Copyright 2026 EvoRule Project

            SPDX-License-Identifier: AGPL-3.0-or-later
          -->

          # EvoRule — 源码提供入口（AGPL-3.0 §13）

          本合规归档随 EvoRule v@@VER@@ 的发布物（二进制 / crates.io 包）一同分发，
          以 AGPL-3.0-or-later 授权。本文件按本次发布动态生成（指纹表填实值），
          用于定位并校验与该发布物对应的完整源码（AGPL-3.0 第 13 条）。

          | 字段 | 值 |
          |---|---|
          | 发布 tag | v@@VER@@ |
          | 源码仓库（权威源） | <https://gitee.com/evorule/evorule> |
          | 源码仓库（GitHub 镜像） | <https://github.com/evorule/evorule> |
          | 源码 tarball | `evorule-@@VER@@-source.tar.gz`（随本 Release 附件分发） |
          | 源码 tarball SHA256 | `@@SHA@@` |

          ## 获取与校验方式

          1. `git clone` 上表任一仓库，`git checkout v@@VER@@`
          2. 复现归档：`git archive --format=tar.gz --prefix=evorule-@@VER@@/ -o evorule-@@VER@@-source.tar.gz HEAD`
          3. 计算 SHA256 并与上表值比对（同一记录亦在随 Release 发布的 `sha256-checks.txt` 中）

          ## 第三方组件

          许可正文与归属声明见本归档内 `THIRD-PARTY-NOTICES.md` 与 `LICENSES/third-party/`。

          ## 分发通道

          - 二进制（GitHub / Gitee Release 附件）随本合规归档一同发布
          - crates.io 包由 cargo publish 自动随附仓根 `LICENSE`
          EOF
          sed -i "s/@@VER@@/${VER}/g; s/@@SHA@@/${SRC_SHA}/g" SOURCE.md
          DIR="evorule-${VER}-compliance"
          mkdir -p "${DIR}/LICENSES"
          cp LICENSE NOTICE.md THIRD-PARTY-NOTICES.md SOURCE.md "${DIR}/"
          cp -r LICENSES/third-party "${DIR}/LICENSES/third-party"
          zip -qr "${DIR}.zip" "${DIR}"
          ls -la "${DIR}.zip" "${SRC_TGZ}"

      - name: 上传合规产物
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: evorule-compliance
          path: |
            evorule-*-compliance.zip
            evorule-*-source.tar.gz
          if-no-files-found: error

  # ==========================================================================
  # 4. 汇总发布 (GitHub Release)
  # ==========================================================================
  release:
    name: release
    needs: [dist-gate, build, sign, sbom, compliance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: 下载所有二进制
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: artifacts
          merge-multiple: true

      # merge-multiple=true 时 artifacts/ 内是带平台后缀的产物本体(见 build 补后缀步骤),
      # 双 target 文件名唯一 —— 仅校验存在性
      - name: 校验产物
        run: |
          ls -la artifacts/
          test -f artifacts/evorule-linux-x86_64
          test -f artifacts/evorule-windows-x86_64.exe

      - name: 下载签名
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: evorule-sigs
          path: sigs

      - name: 下载 SBOM
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: evorule-sbom
          path: sbom

      - name: 下载合规产物
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: evorule-compliance
          path: compliance

      # SOURCE.md 向下载方承诺: 源码 tarball SHA256 记录在随 Release 发布的
      # sha256-checks.txt —— 本步生成该承诺文件 (含二进制与合规归档)
      - name: 生成 sha256-checks.txt
        run: |
          set -e
          sha256sum artifacts/evorule-linux-x86_64 artifacts/evorule-windows-x86_64.exe compliance/evorule-*-compliance.zip compliance/evorule-*-source.tar.gz > sha256-checks.txt
          cat sha256-checks.txt

      - name: 创建 Release 并附加二进制与 SBOM
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            artifacts/evorule-linux-x86_64
            artifacts/evorule-windows-x86_64.exe
            sigs/evorule-linux-x86_64.sig
            sigs/evorule-windows-x86_64.exe.sig
            sbom/*.cdx.json
            compliance/evorule-*-compliance.zip
            compliance/evorule-*-source.tar.gz
            sha256-checks.txt
          generate_release_notes: true

  # ==========================================================================
  # 4. 双平台产物附加到 Gitee Release (gitee 是主仓/发布主入口)
  #    Gitee Go 云端 agent 对当前账号不可用(agents not available),故双平台二进制均由本侧构建并经 Gitee OpenAPI 附加到
  #    gitee Release;Gitee Go agent 就绪后可切回原生构建(脚本见 .workflow/release.yml)。
  #    防挂: 所有 curl 带 --max-time（历史事故登记: 无超时的 gitee 同步曾无限挂起）。
  #    幂等: gitee release 不存在则创建,存在则复用。
  #    需在 github 仓库 Settings → Secrets and variables → Actions 配置 GITEE_TOKEN
  #    (Gitee 个人令牌,勾选 releases + projects 权限)
  # ==========================================================================
  attach-gitee:
    name: attach-all-to-gitee
    needs: [dist-gate, build, sign, sbom, compliance]
    runs-on: ubuntu-latest
    steps:
      - name: 下载 Linux 构建产物
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: evorule-linux-x86_64
          path: gitee-assets/linux

      - name: 下载 Windows 构建产物
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: evorule-windows-x86_64
          path: gitee-assets/windows

      - name: 下载签名
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: evorule-sigs
          path: gitee-assets/sigs

      - name: 下载 SBOM
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: evorule-sbom
          path: gitee-assets/sbom

      - name: 下载合规产物
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: evorule-compliance
          path: gitee-assets/compliance

      - name: 汇集产物并计算 sha256
        run: |
          mv gitee-assets/linux/evorule-linux-x86_64 gitee-assets/evorule-linux-x86_64
          mv gitee-assets/windows/evorule-windows-x86_64.exe gitee-assets/evorule-windows-x86_64.exe
          cp gitee-assets/sigs/*.sig gitee-assets/
          cp gitee-assets/sbom/*.cdx.json gitee-assets/
          cp gitee-assets/compliance/evorule-*-compliance.zip gitee-assets/compliance/evorule-*-source.tar.gz gitee-assets/
          cd gitee-assets
          sha256sum evorule-linux-x86_64 evorule-windows-x86_64.exe evorule-*-compliance.zip evorule-*-source.tar.gz > sha256-checks.txt
          sha256sum evorule-linux-x86_64 > evorule-linux-x86_64.sha256
          sha256sum evorule-windows-x86_64.exe > evorule-windows-x86_64.exe.sha256
          cat sha256-checks.txt
          ls -la

      - name: 附加到 Gitee Release
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -e
          REPO="evorule/evorule"
          TAG="${GITHUB_REF_NAME}"
          if [ -z "$GITEE_TOKEN" ]; then echo "ERROR: github secrets 缺 GITEE_TOKEN"; exit 1; fi
          echo "TAG=$TAG → gitee release"

          # 幂等: 已存在则按 tag 查询,否则创建（--max-time 防挂）
          RELEASE_ID=$(curl --max-time 60 --retry 3 --retry-delay 5 --retry-connrefused -fsS \
            "https://gitee.com/api/v5/repos/${REPO}/releases/tags/${TAG}" \
            -H "Authorization: token ${GITEE_TOKEN}" \
            | python3 -c "import json,sys; print(json.load(sys.stdin).get('id',''))" 2>/dev/null || echo "")
          if [ -z "$RELEASE_ID" ]; then
            echo "gitee release 不存在,创建..."
            RELEASE_RESP=$(curl --max-time 60 --retry 3 --retry-delay 5 --retry-connrefused -fsS -X POST \
              "https://gitee.com/api/v5/repos/${REPO}/releases" \
              -H "Content-Type: application/json" \
              -H "Authorization: token ${GITEE_TOKEN}" \
              -d "{\"tag_name\":\"${TAG}\",\"name\":\"EvoRule ${TAG}\",\"body\":\"EvoRule ${TAG} — 详见 CHANGELOG.md\",\"target_commitish\":\"main\"}" \
              || echo "")
            RELEASE_ID=$(echo "${RELEASE_RESP}" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('id',''))" 2>/dev/null || echo "")
          fi
          if [ -z "$RELEASE_ID" ]; then
            echo "ERROR: 无法获取 gitee release id"
            exit 1
          fi
          echo "gitee Release id: ${RELEASE_ID}"

          cd gitee-assets
          for f in evorule-linux-x86_64 evorule-linux-x86_64.sha256 evorule-linux-x86_64.sig evorule-windows-x86_64.exe evorule-windows-x86_64.exe.sha256 evorule-windows-x86_64.exe.sig; do
            echo "上传 ${f} ..."
            curl --max-time 300 --retry 3 --retry-delay 5 --retry-connrefused -fsS -X POST \
              "https://gitee.com/api/v5/repos/${REPO}/releases/${RELEASE_ID}/attach_files" \
              -H "Authorization: token ${GITEE_TOKEN}" \
              -F "file=@${f}"
            echo ""
          done
          # SBOM (CycloneDX, A3)
          for f in *.cdx.json; do
            echo "上传 SBOM ${f} ..."
            curl --max-time 300 --retry 3 --retry-delay 5 --retry-connrefused -fsS -X POST \
              "https://gitee.com/api/v5/repos/${REPO}/releases/${RELEASE_ID}/attach_files" \
              -H "Authorization: token ${GITEE_TOKEN}" \
              -F "file=@${f}"
            echo ""
          done
          # 合规随附包 + 源码 tarball (AGPL §4/§13)
          for f in evorule-*-compliance.zip evorule-*-source.tar.gz; do
            echo "上传 ${f} ..."
            curl --max-time 300 --retry 3 --retry-delay 5 --retry-connrefused -fsS -X POST \
              "https://gitee.com/api/v5/repos/${REPO}/releases/${RELEASE_ID}/attach_files" \
              -H "Authorization: token ${GITEE_TOKEN}" \
              -F "file=@${f}"
            echo ""
          done
          echo "DONE: https://gitee.com/${REPO}/releases/tag/${TAG}"

  # Distribution-compliance gate (reusable workflow, pinned to root-repo commit)
  dist-gate:
    name: dist compliance gate
    permissions:
      contents: read
    uses: evorule/evorule/.github/workflows/dist-gate.yml@a3aa299151fa3cfbf0d9fe6b659b5f91cb909807
    with:
      repo: evorule
