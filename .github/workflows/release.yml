# Release workflow for EvoRule
#
# 触发: 推送 v* tag
# 产物: 双平台二进制 (GitHub Release 附件)
#   - Linux   x86_64 (ubuntu-latest, 静态 musl)
#   - Windows x86_64 (windows-latest)
#
# 设计说明:
# - 发布矩阵覆盖当前支持的平台 (Linux / Windows)
# - Linux 用 musl 静态链接, 产出单一可执行文件
# - tag 格式: v0.1.0 / v0.2.4 等
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ==========================================================================
  # 1. 双平台矩阵构建
  # ==========================================================================
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: evorule-linux-x86_64
            ext: ""
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: evorule-windows-x86_64
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: 安装 musl 工具链 (Linux)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # 仓根 rust-toolchain.toml 指定的工具链会在 cargo 运行时生效,
      # 并覆盖上方 action 传入的 targets 参数 —— 此步骤确保 target
      # 安装到实际生效的工具链下, 使后续 --target 构建可用。
      - name: 安装构建 target
        run: rustup target add ${{ matrix.target }}

      - name: 构建 CLI 二进制
        run: cargo build -p evorule-cli --release --target ${{ matrix.target }} --bin evorule

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/evorule${{ matrix.ext }}

  # ==========================================================================
  # 2. 汇总发布
  # ==========================================================================
  release:
    name: release
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 下载所有二进制
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # merge-multiple=true 时 artifacts/ 内是构建产物本体(evorule / evorule.exe),
      # 不是 artifact 名 —— 校验后重命名补平台后缀,发布资产名即平台名
      - name: 校验产物并补平台后缀
        run: |
          ls -la artifacts/
          test -f artifacts/evorule
          test -f artifacts/evorule.exe
          mv artifacts/evorule artifacts/evorule-linux-x86_64
          mv artifacts/evorule.exe artifacts/evorule-windows-x86_64.exe
          ls -la artifacts/

      - name: 创建 Release 并附加二进制
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/evorule-linux-x86_64
            artifacts/evorule-windows-x86_64.exe
          generate_release_notes: true

  # ==========================================================================
  # 3. Windows 产物附加到 Gitee Release (gitee 是主仓/发布主入口)
  #    Gitee Go 无 Windows 构建机(仅 Linux),故 Windows 二进制由本侧构建,
  #    经 Gitee OpenAPI 附加到 gitee 流水线创建的同一 Release。
  #    幂等: gitee release 不存在则创建,存在则复用。
  #    需在 github 仓库 Settings → Secrets and variables → Actions 配置 GITEE_TOKEN
  #    (Gitee 个人令牌,勾选 releases + projects 权限)
  # ==========================================================================
  attach-gitee:
    name: attach-windows-to-gitee
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: 下载 Windows 构建产物
        uses: actions/download-artifact@v4
        with:
          name: evorule-windows-x86_64
          path: gitee-assets

      - name: 补平台后缀并计算 sha256
        run: |
          cd gitee-assets
          mv evorule.exe evorule-windows-x86_64.exe
          sha256sum evorule-windows-x86_64.exe > evorule-windows-x86_64.exe.sha256
          ls -la

      - name: 附加到 Gitee Release
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -e
          REPO="evorule/evorule"
          TAG="${GITHUB_REF_NAME}"
          if [ -z "$GITEE_TOKEN" ]; then echo "ERROR: github secrets 缺 GITEE_TOKEN"; exit 1; fi
          echo "TAG=$TAG → gitee release"

          # 幂等: 已存在则按 tag 查询,否则创建
          RELEASE_ID=$(curl --retry 3 --retry-delay 5 --retry-connrefused -fsS \
            "https://gitee.com/api/v5/repos/${REPO}/releases/tags/${TAG}" \
            -H "Authorization: token ${GITEE_TOKEN}" \
            | python3 -c "import json,sys; print(json.load(sys.stdin).get('id',''))" 2>/dev/null || echo "")
          if [ -z "$RELEASE_ID" ]; then
            echo "gitee release 不存在,创建..."
            RELEASE_RESP=$(curl --retry 3 --retry-delay 5 --retry-connrefused -fsS -X POST \
              "https://gitee.com/api/v5/repos/${REPO}/releases" \
              -H "Content-Type: application/json" \
              -H "Authorization: token ${GITEE_TOKEN}" \
              -d "{\"tag_name\":\"${TAG}\",\"name\":\"EvoRule ${TAG}\",\"body\":\"EvoRule ${TAG} — 详见 CHANGELOG.md\",\"target_commitish\":\"main\"}" \
              || echo "")
            RELEASE_ID=$(echo "${RELEASE_RESP}" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('id',''))" 2>/dev/null || echo "")
          fi
          if [ -z "$RELEASE_ID" ]; then
            echo "ERROR: 无法获取 gitee release id(gitee 流水线可能尚未创建 release)"
            exit 1
          fi
          echo "gitee Release id: ${RELEASE_ID}"

          cd gitee-assets
          for f in evorule-windows-x86_64.exe evorule-windows-x86_64.exe.sha256; do
            echo "上传 ${f} ..."
            curl --retry 3 --retry-delay 5 --retry-connrefused -fsS -X POST \
              "https://gitee.com/api/v5/repos/${REPO}/releases/${RELEASE_ID}/attach_files" \
              -H "Authorization: token ${GITEE_TOKEN}" \
              -F "file=@${f}"
            echo ""
          done
          echo "DONE: https://gitee.com/${REPO}/releases/tag/${TAG}"
