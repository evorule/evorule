# Release workflow for EvoRule
#
# 触发: 推送 v* tag
# 产物: 双平台二进制 (GitHub Release 附件)
#   - Linux   x86_64 (ubuntu-latest, 静态 musl)
#   - Windows x86_64 (windows-latest)
#
# 设计说明:
# - 发布矩阵覆盖当前支持的平台 (Linux / Windows)
# - Linux 用 musl 静态链接, 产出单一可执行文件
# - tag 格式: v0.1.0 / v0.2.4 等
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ==========================================================================
  # 1. 双平台矩阵构建
  # ==========================================================================
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: evorule-linux-x86_64
            ext: ""
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: evorule-windows-x86_64
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: 安装 musl 工具链 (Linux)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # 仓根 rust-toolchain.toml 指定的工具链会在 cargo 运行时生效,
      # 并覆盖上方 action 传入的 targets 参数 —— 此步骤确保 target
      # 安装到实际生效的工具链下, 使后续 --target 构建可用。
      - name: 安装构建 target
        run: rustup target add ${{ matrix.target }}

      - name: 构建 CLI 二进制
        run: cargo build -p evorule-cli --release --target ${{ matrix.target }} --bin evorule

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/evorule${{ matrix.ext }}

  # ==========================================================================
  # 2. 汇总发布
  # ==========================================================================
  release:
    name: release
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 下载所有二进制
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # merge-multiple=true 时 artifacts/ 内是构建产物本体(evorule / evorule.exe),
      # 不是 artifact 名 —— 校验后重命名补平台后缀,发布资产名即平台名
      - name: 校验产物并补平台后缀
        run: |
          ls -la artifacts/
          test -f artifacts/evorule
          test -f artifacts/evorule.exe
          mv artifacts/evorule artifacts/evorule-linux-x86_64
          mv artifacts/evorule.exe artifacts/evorule-windows-x86_64.exe
          ls -la artifacts/

      - name: 创建 Release 并附加二进制
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/evorule-linux-x86_64
            artifacts/evorule-windows-x86_64.exe
          generate_release_notes: true
