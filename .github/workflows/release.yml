# Release workflow for EvoRule
#
# 触发: 推送 v* tag
# 产物: 四 target 二进制 (GitHub Release 附件)
#   - Linux   x86_64 (ubuntu-latest, 静态 musl)
#   - Windows x86_64 (windows-latest)
#   - macOS   x86_64 + aarch64 (macos-latest)
#
# 设计说明:
# - 发布矩阵覆盖当前支持的平台 (Linux / Windows / macOS)
# - Linux 用 musl 静态链接, 产出单一可执行文件
# - tag 格式: v0.1.0 / v0.2.4 等
# - 二进制由 cosign keyless (OIDC) 签名, .sig 随 Release 发布, 见 SIGNING.md

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: read-all

env:
  CARGO_TERM_COLOR: always

jobs:
  # ==========================================================================
  # 0. M4 发布同步门禁 (verification/MECHANISM.md M4)
  #    - STATUS.md 快照版本 = 待发布 tag 版本
  #    - kani.yml kani-tcb-a-tier job 在待发布 commit 上绿 (A 档 Kani CI)
  # ==========================================================================
  release-gate:
    name: M4 release gate (STATUS snapshot + A-tier Kani)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: 核对 STATUS.md 快照版本 = tag 版本
        run: |
          set -e
          TAG="${GITHUB_REF_NAME#v}"
          SNAP=$(grep -m1 '快照' verification/STATUS.md | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
          echo "tag=v${TAG}  STATUS.md 快照=${SNAP}"
          if [ -z "${SNAP}" ]; then
            echo "ERROR: 未能从 verification/STATUS.md 解析快照版本"
            exit 1
          fi
          if [ "${SNAP}" != "v${TAG}" ]; then
            echo "ERROR: STATUS.md 快照(${SNAP}) != tag(v${TAG})；按 MECHANISM.md M4 先同步验证文档再发布"
            exit 1
          fi

      - name: 核对 A 档 Kani CI（kani.yml kani-tcb-a-tier）在该 commit 上绿
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          SHA="${GITHUB_SHA}"
          RUN_IDS=$(gh run list --workflow kani.yml --commit "${SHA}" --limit 10 --json databaseId,status,conclusion \
            | python3 -c 'import json,sys; runs=json.load(sys.stdin); print(" ".join(str(r["databaseId"]) for r in runs if r["status"]=="completed"))')
          if [ -z "${RUN_IDS}" ]; then
            echo "ERROR: commit ${SHA} 上无已完成的 kani.yml 运行"
            echo "（若该提交未触发 kani.yml 的 paths 过滤，请先手动 dispatch kani.yml 跑 A 档，再重新运行本 release 流水线）"
            exit 1
          fi
          OK=""
          for RID in ${RUN_IDS}; do
            CONC=$(gh run view "${RID}" --json jobs \
              | python3 -c 'import json,sys; jobs=json.load(sys.stdin)["jobs"]; a=[j for j in jobs if j["name"].startswith("kani-tcb-a-tier")]; print(a[0]["conclusion"] if a else "missing")')
            echo "kani.yml run ${RID}: kani-tcb-a-tier = ${CONC}"
            if [ "${CONC}" = "success" ]; then OK=1; break; fi
          done
          if [ -z "${OK}" ]; then
            echo "ERROR: kani-tcb-a-tier job 在 commit ${SHA} 上未绿（MECHANISM.md M4）"
            exit 1
          fi

  # ==========================================================================
  # 1. crates.io 发布 (硬约束: 发版必须同步 crates.io)
  #    依赖序: tcb → reactor → governance → cli
  #    前置: repo Settings → Secrets and variables → Actions 配置 CARGO_REGISTRY_TOKEN
  # ==========================================================================
  publish-crates:
    needs: [release-gate]
    name: publish crates.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: 按依赖序发布四核心 crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -e
          for p in evorule-tcb evorule-reactor evorule-governance evorule-cli; do
            cargo publish -p "$p"
            sleep 15  # 等待 crates.io 索引更新, 避免下游依赖解析未就绪
          done

  # ==========================================================================
  # 2. 双平台矩阵构建
  # ==========================================================================
  build:
    needs: [release-gate]
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: evorule-linux-x86_64
            ext: ""
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: evorule-windows-x86_64
            ext: ".exe"
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            artifact: evorule-macos-x86_64
            ext: ""
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            artifact: evorule-macos-aarch64
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: . -> target

      - name: 安装 musl 工具链 (Linux)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # 仓根 rust-toolchain.toml 指定的工具链会在 cargo 运行时生效,
      # 并覆盖上方 action 传入的 targets 参数 —— 此步骤确保 target
      # 安装到实际生效的工具链下, 使后续 --target 构建可用。
      - name: 安装构建 target
        run: rustup target add ${{ matrix.target }}

      - name: 构建 CLI 二进制
        run: cargo build -p evorule-cli --release --target ${{ matrix.target }} --bin evorule

      # 以平台后缀重命名后再上传,使 merge-multiple 汇聚时文件名唯一(四 target 中
      # 三个 Unix 产物本体同名 evorule,直接上传会互相覆盖)
      - name: 补平台后缀
        shell: bash
        run: |
          mkdir -p stage
          cp "target/${{ matrix.target }}/release/evorule${{ matrix.ext }}" "stage/${{ matrix.artifact }}${{ matrix.ext }}"

      - name: 上传构建产物
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ${{ matrix.artifact }}
          path: stage/${{ matrix.artifact }}${{ matrix.ext }}

  # ==========================================================================
  # 2. 发布二进制 cosign keyless 签名 (OIDC, 无密钥管理)
  #    签名落库为 .sig, 随 Release 资产发布。验证见 SIGNING.md。
  # ==========================================================================
  sign:
    name: sign (cosign keyless)
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # cosign keyless 签名所需 OIDC token
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: 下载 Linux 构建产物
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: evorule-linux-x86_64
          path: sign/linux

      - name: 下载 Windows 构建产物
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: evorule-windows-x86_64
          path: sign/windows

      - name: 下载 macOS 构建产物
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: evorule-macos-x86_64
          path: sign/macos-x86_64

      - name: 下载 macOS ARM 构建产物
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: evorule-macos-aarch64
          path: sign/macos-aarch64

      - name: 安装 cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0

      - name: Keyless 签名 (OIDC)
        run: |
          mkdir -p sigout
          cosign sign-blob --yes \
            sign/linux/evorule-linux-x86_64 \
            --output-signature sigout/evorule-linux-x86_64.sig
          cosign sign-blob --yes \
            sign/windows/evorule-windows-x86_64.exe \
            --output-signature sigout/evorule-windows-x86_64.exe.sig
          cosign sign-blob --yes \
            sign/macos-x86_64/evorule-macos-x86_64 \
            --output-signature sigout/evorule-macos-x86_64.sig
          cosign sign-blob --yes \
            sign/macos-aarch64/evorule-macos-aarch64 \
            --output-signature sigout/evorule-macos-aarch64.sig
          ls -la sigout

      - name: 上传签名产物
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: evorule-sigs
          path: sigout/

  # ==========================================================================
  # 3.5 CycloneDX SBOM 生成 (A3 供应链三件套)
  #     全 workspace 成员的 .cdx.json 随 GitHub Release / Gitee Release 发布,
  #     供下游 ISV 满足其供应链合规（如欧盟 CRA、客户安全问卷）。
  # ==========================================================================
  sbom:
    name: sbom (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: . -> target

      - name: 安装 cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked

      - name: 生成 SBOM (全 workspace, JSON)
        run: cargo cyclonedx --all --format json

      # cargo-cyclonedx 将产物写到各 member 目录,统一收集到 sbom/
      - name: 收集 SBOM 产物
        run: |
          mkdir -p sbom
          find . -maxdepth 2 -name '*.cdx.json' -not -path './target/*' -exec mv {} sbom/ \;
          ls -la sbom/

      - name: 上传 SBOM 产物
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: evorule-sbom
          path: sbom/*.cdx.json

  # ==========================================================================
  # 4. 汇总发布 (GitHub Release)
  # ==========================================================================
  release:
    name: release
    needs: [build, sign, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: 下载所有二进制
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: artifacts
          merge-multiple: true

      # merge-multiple=true 时 artifacts/ 内是带平台后缀的产物本体(见 build 补后缀步骤),
      # 四 target 文件名唯一 —— 仅校验存在性
      - name: 校验产物
        run: |
          ls -la artifacts/
          test -f artifacts/evorule-linux-x86_64
          test -f artifacts/evorule-windows-x86_64.exe
          test -f artifacts/evorule-macos-x86_64
          test -f artifacts/evorule-macos-aarch64

      - name: 下载签名
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: evorule-sigs
          path: sigs

      - name: 下载 SBOM
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: evorule-sbom
          path: sbom

      - name: 创建 Release 并附加二进制与 SBOM
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            artifacts/evorule-linux-x86_64
            artifacts/evorule-windows-x86_64.exe
            artifacts/evorule-macos-x86_64
            artifacts/evorule-macos-aarch64
            sigs/evorule-linux-x86_64.sig
            sigs/evorule-windows-x86_64.exe.sig
            sigs/evorule-macos-x86_64.sig
            sigs/evorule-macos-aarch64.sig
            sbom/*.cdx.json
          generate_release_notes: true

  # ==========================================================================
  # 4. 四 target 产物附加到 Gitee Release (gitee 是主仓/发布主入口)
  #    Gitee Go 云端 agent 对当前账号不可用(agents not available),故四 target 二进制均由本侧构建并经 Gitee OpenAPI 附加到
  #    gitee Release;Gitee Go agent 就绪后可切回原生构建(脚本见 .workflow/release.yml)。
  #    防挂: 所有 curl 带 --max-time（历史事故登记: 无超时的 gitee 同步曾无限挂起）。
  #    幂等: gitee release 不存在则创建,存在则复用。
  #    需在 github 仓库 Settings → Secrets and variables → Actions 配置 GITEE_TOKEN
  #    (Gitee 个人令牌,勾选 releases + projects 权限)
  # ==========================================================================
  attach-gitee:
    name: attach-all-to-gitee
    needs: [build, sign, sbom]
    runs-on: ubuntu-latest
    steps:
      - name: 下载 Linux 构建产物
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: evorule-linux-x86_64
          path: gitee-assets/linux

      - name: 下载 Windows 构建产物
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: evorule-windows-x86_64
          path: gitee-assets/windows

      - name: 下载 macOS 构建产物
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: evorule-macos-x86_64
          path: gitee-assets/macos-x86_64

      - name: 下载 macOS ARM 构建产物
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: evorule-macos-aarch64
          path: gitee-assets/macos-aarch64

      - name: 下载签名
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: evorule-sigs
          path: gitee-assets/sigs

      - name: 下载 SBOM
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: evorule-sbom
          path: gitee-assets/sbom

      - name: 汇集产物并计算 sha256
        run: |
          mv gitee-assets/linux/evorule-linux-x86_64 gitee-assets/evorule-linux-x86_64
          mv gitee-assets/windows/evorule-windows-x86_64.exe gitee-assets/evorule-windows-x86_64.exe
          mv gitee-assets/macos-x86_64/evorule-macos-x86_64 gitee-assets/evorule-macos-x86_64
          mv gitee-assets/macos-aarch64/evorule-macos-aarch64 gitee-assets/evorule-macos-aarch64
          cp gitee-assets/sigs/*.sig gitee-assets/
          cp gitee-assets/sbom/*.cdx.json gitee-assets/
          cd gitee-assets
          sha256sum evorule-linux-x86_64 evorule-windows-x86_64.exe evorule-macos-x86_64 evorule-macos-aarch64 > sha256-checks.txt
          sha256sum evorule-linux-x86_64 > evorule-linux-x86_64.sha256
          sha256sum evorule-windows-x86_64.exe > evorule-windows-x86_64.exe.sha256
          sha256sum evorule-macos-x86_64 > evorule-macos-x86_64.sha256
          sha256sum evorule-macos-aarch64 > evorule-macos-aarch64.sha256
          cat sha256-checks.txt
          ls -la

      - name: 附加到 Gitee Release
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -e
          REPO="evorule/evorule"
          TAG="${GITHUB_REF_NAME}"
          if [ -z "$GITEE_TOKEN" ]; then echo "ERROR: github secrets 缺 GITEE_TOKEN"; exit 1; fi
          echo "TAG=$TAG → gitee release"

          # 幂等: 已存在则按 tag 查询,否则创建（--max-time 防挂）
          RELEASE_ID=$(curl --max-time 60 --retry 3 --retry-delay 5 --retry-connrefused -fsS \
            "https://gitee.com/api/v5/repos/${REPO}/releases/tags/${TAG}" \
            -H "Authorization: token ${GITEE_TOKEN}" \
            | python3 -c "import json,sys; print(json.load(sys.stdin).get('id',''))" 2>/dev/null || echo "")
          if [ -z "$RELEASE_ID" ]; then
            echo "gitee release 不存在,创建..."
            RELEASE_RESP=$(curl --max-time 60 --retry 3 --retry-delay 5 --retry-connrefused -fsS -X POST \
              "https://gitee.com/api/v5/repos/${REPO}/releases" \
              -H "Content-Type: application/json" \
              -H "Authorization: token ${GITEE_TOKEN}" \
              -d "{\"tag_name\":\"${TAG}\",\"name\":\"EvoRule ${TAG}\",\"body\":\"EvoRule ${TAG} — 详见 CHANGELOG.md\",\"target_commitish\":\"main\"}" \
              || echo "")
            RELEASE_ID=$(echo "${RELEASE_RESP}" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('id',''))" 2>/dev/null || echo "")
          fi
          if [ -z "$RELEASE_ID" ]; then
            echo "ERROR: 无法获取 gitee release id"
            exit 1
          fi
          echo "gitee Release id: ${RELEASE_ID}"

          cd gitee-assets
          for f in evorule-linux-x86_64 evorule-linux-x86_64.sha256 evorule-linux-x86_64.sig evorule-windows-x86_64.exe evorule-windows-x86_64.exe.sha256 evorule-windows-x86_64.exe.sig evorule-macos-x86_64 evorule-macos-x86_64.sha256 evorule-macos-x86_64.sig evorule-macos-aarch64 evorule-macos-aarch64.sha256 evorule-macos-aarch64.sig; do
            echo "上传 ${f} ..."
            curl --max-time 300 --retry 3 --retry-delay 5 --retry-connrefused -fsS -X POST \
              "https://gitee.com/api/v5/repos/${REPO}/releases/${RELEASE_ID}/attach_files" \
              -H "Authorization: token ${GITEE_TOKEN}" \
              -F "file=@${f}"
            echo ""
          done
          # SBOM (CycloneDX, A3)
          for f in *.cdx.json; do
            echo "上传 SBOM ${f} ..."
            curl --max-time 300 --retry 3 --retry-delay 5 --retry-connrefused -fsS -X POST \
              "https://gitee.com/api/v5/repos/${REPO}/releases/${RELEASE_ID}/attach_files" \
              -H "Authorization: token ${GITEE_TOKEN}" \
              -F "file=@${f}"
            echo ""
          done
          echo "DONE: https://gitee.com/${REPO}/releases/tag/${TAG}"
