#
# crates.io publishing channel for evorule-hash.
# The CARGO_REGISTRY_TOKEN secret is scoped to this repo (since 2026-10-13), so the
# publish workflow lives here: it checks out the target evorule-hash commit remotely
# and publishes with the token.
name: Publish evorule-hash

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: evorule/evorule-hash
          ref: main

      - uses: dtolnay/rust-toolchain@stable

      - name: cargo publish
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
