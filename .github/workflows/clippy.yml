# lint gate (standalone workflow): rustfmt format check + clippy static analysis
#
# Covers:
# - workspace all-target `cargo fmt --all -- --check` (format gate)
# - workspace all-target clippy in strict mode, -D warnings
# - applies the [workspace.lints.clippy] rules:
#   unwrap_used / expect_used / panic / panic_in_result_fn all deny (fail-closed)
# - behaves the same as local `cargo fmt --all -- --check` + `cargo clippy --workspace --all-targets -- -D warnings`
#
# Design notes:
# - uses the 1.98.1 toolchain pinned by rust-toolchain.toml (stable channel), with rustfmt/clippy components
# - runs independently of ci.yml, triggered in parallel on push/PR to main
# - previously this workflow had clippy but no fmt, while the local toolchain had both --
#   a two-track asymmetry: a failing local fmt could pass here all green. A fmt job is now added to align.
#   The workflow name (`Clippy`) and the existing clippy job name stay unchanged: branch protection required status
#   checks match the full "<workflow> / <job>" name, and renaming would leave that check permanently pending and block merges;
#   fmt is a new standalone job and does not change existing check identifiers.
name: Clippy

on:
  push:
    branches: [main, master, "release/**"]
  pull_request:
    branches: [main, master]
  # manual trigger allowed
  workflow_dispatch:

# Explicit minimal permissions (Scorecard Token-Permissions): read-only
permissions: read-all

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt (workspace, --check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt

      - name: fmt (workspace all targets, --check)
        run: cargo fmt --all -- --check

  clippy:
    name: clippy (workspace, -D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      # cache cargo build artifacts (cache key shared with ci.yml)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: . -> target

      - name: clippy (workspace all targets, -D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
