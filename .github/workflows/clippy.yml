# lint 门禁 (独立 workflow): rustfmt 格式检查 + clippy 静态检查
#
# 覆盖:
# - workspace 全 target `cargo fmt --all -- --check` (格式门禁)
# - workspace 全 target clippy, 严格模式 -D warnings
# - 应用 [workspace.lints.clippy] 规则:
#   unwrap_used / expect_used / panic / panic_in_result_fn 全部 deny (fail-closed)
# - 与本地 `cargo fmt --all -- --check` + `cargo clippy --workspace --all-targets -- -D warnings` 行为一致
# - 与 Gitee Go `.gitee-ci/validate.yml` 的 lint stage 对齐 (该 stage 同为 fmt + clippy)
#
# 设计说明:
# - 使用 rust-toolchain.toml 锁定的 1.97.1 (stable 通道), 组件含 rustfmt/clippy
# - 独立于 ci.yml 运行, push/PR 到 main 时并行触发
# - TCB-2026-48 整改: 此前本 workflow 只有 clippy 无 fmt, Gitee 侧两者都有 ——
#   双轨不对称, 「本地 fmt 未过」可在 GitHub 侧全绿通过。现补 fmt job 对齐。
#   workflow 名 (`Clippy`) 与既有 clippy job 名保持不变: 分支保护的 required status
#   check 以 "<workflow> / <job>" 全名匹配, 改名会让该 check 永久 pending 阻塞合入;
#   fmt 为新增独立 job, 不改变既有 check 标识。
name: Clippy

on:
  push:
    branches: [main, master, "release/**"]
  pull_request:
    branches: [main, master]
  # 允许手动触发
  workflow_dispatch:

# 显式最小权限 (Scorecard Token-Permissions): 仅需只读
permissions: read-all

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt (workspace, --check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt

      - name: fmt (workspace 全 target, --check)
        run: cargo fmt --all -- --check

  clippy:
    name: clippy (workspace, -D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      # 缓存 cargo 构建产物 (与 ci.yml 共享缓存 key)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: . -> target

      - name: clippy (workspace 全 target, -D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
