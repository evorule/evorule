<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EvoRule README - 移动端预览</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.6.1/github-markdown.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #1a1a2e;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }

  h1.page-title {
    color: white;
    margin-bottom: 20px;
    font-size: 20px;
  }

  .controls {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .controls button {
    padding: 8px 16px;
    border: none;
    border-radius: 8px;
    background: #e8eaed;
    color: #333;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.2s;
  }

  .controls button.active {
    background: #2da44e;
    color: white;
  }

  .controls button:hover {
    transform: translateY(-1px);
  }

  .phone-wrapper {
    perspective: 1000px;
  }

  .phone {
    width: 375px;
    height: 812px;
    background: #fff;
    border-radius: 40px;
    box-shadow: 
      0 0 0 12px #1a1a2e,
      0 0 0 14px #333,
      0 25px 50px -12px rgba(0, 0, 0, 0.5);
    overflow: hidden;
    position: relative;
  }

  .phone-notch {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 150px;
    height: 30px;
    background: #1a1a2e;
    border-radius: 0 0 20px 20px;
    z-index: 100;
  }

  .phone-statusbar {
    height: 44px;
    background: #f6f8fa;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px 0 24px;
    font-size: 14px;
    font-weight: 600;
    color: #333;
    border-bottom: 1px solid #e1e4e8;
  }

  .phone-statusbar .time {
    padding-top: 4px;
  }

  .phone-statusbar .icons {
    display: flex;
    gap: 5px;
    padding-top: 4px;
    font-size: 12px;
  }

  .gitee-header {
    background: white;
    padding: 12px 16px;
    border-bottom: 1px solid #e1e4e8;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .gitee-header .back {
    font-size: 20px;
    color: #666;
  }

  .gitee-header .repo-name {
    flex: 1;
    font-size: 16px;
    font-weight: 600;
    color: #333;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .gitee-header .actions {
    display: flex;
    gap: 16px;
    font-size: 18px;
    color: #666;
  }

  .gitee-tabs {
    display: flex;
    background: white;
    border-bottom: 1px solid #e1e4e8;
    overflow-x: auto;
  }

  .gitee-tabs .tab {
    flex: 1;
    padding: 12px 0;
    text-align: center;
    font-size: 14px;
    color: #666;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
  }

  .gitee-tabs .tab.active {
    color: #2da44e;
    border-bottom-color: #2da44e;
    font-weight: 500;
  }

  .markdown-body {
    padding: 16px !important;
    max-width: 100% !important;
    overflow-y: auto;
    height: calc(812px - 44px - 53px - 45px - 41px);
    font-size: 14px !important;
    line-height: 1.6 !important;
  }

  .markdown-body h1 {
    font-size: 22px !important;
  }

  .markdown-body h2 {
    font-size: 18px !important;
  }

  .markdown-body h3 {
    font-size: 16px !important;
  }

  .markdown-body img {
    max-width: 100%;
  }

  .markdown-body table {
    display: block;
    width: 100%;
    overflow-x: auto;
  }

  .markdown-body pre {
    overflow-x: auto;
  }

  .markdown-body code {
    font-size: 12px !important;
  }

  .gitee-bottombar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 50px;
    background: white;
    border-top: 1px solid #e1e4e8;
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding-bottom: 8px;
  }

  .gitee-bottombar .item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    font-size: 10px;
    color: #999;
  }

  .gitee-bottombar .item.active {
    color: #2da44e;
  }

  .gitee-bottombar .item .icon {
    font-size: 20px;
  }

  .phone.tablet {
    width: 768px;
    height: 1024px;
  }

  .phone.tablet .markdown-body {
    height: calc(1024px - 44px - 53px - 45px - 50px);
  }

  .phone.desktop {
    width: 1024px;
    height: 800px;
    border-radius: 12px;
  }

  .phone.desktop .phone-notch { display: none; }
  .phone.desktop .phone-statusbar { display: none; }
  .phone.desktop .gitee-bottombar { display: none; }
  .phone.desktop .markdown-body {
    height: calc(800px - 53px - 45px);
  }
</style>
</head>
<body>

<h1 class="page-title">📱 README 移动端预览</h1>

<div class="controls">
  <button class="active" onclick="setView('phone')">📱 手机 (375×812)</button>
  <button onclick="setView('tablet')">📱 平板 (768×1024)</button>
  <button onclick="setView('desktop')">💻 桌面 (1024×800)</button>
</div>

<div class="phone-wrapper">
  <div class="phone" id="phone">
    <div class="phone-notch"></div>

    <div class="phone-statusbar">
      <span class="time">9:41</span>
      <span class="icons">📶 🔋</span>
    </div>

    <div class="gitee-header">
      <span class="back">←</span>
      <span class="repo-name">evo-rule-lab/evorule</span>
      <span class="actions">⋮</span>
    </div>

    <div class="gitee-tabs">
      <div class="tab">📁 代码</div>
      <div class="tab active">📖 README</div>
      <div class="tab">🐛 Issues</div>
      <div class="tab">🔀 PRs</div>
    </div>

    <div class="markdown-body" id="content">
      加载中...
    </div>

    <div class="gitee-bottombar">
      <div class="item active">
        <div class="icon">🏠</div>
        <div>首页</div>
      </div>
      <div class="item">
        <div class="icon">🔔</div>
        <div>消息</div>
      </div>
      <div class="item">
        <div class="icon">🔍</div>
        <div>发现</div>
      </div>
      <div class="item">
        <div class="icon">👤</div>
        <div>我的</div>
      </div>
    </div>
  </div>
</div>

<script>
  fetch('../README.md')
    .then(res => res.text())
    .then(text => {
      const html = marked.parse(text, { breaks: true, gfm: true });
      document.getElementById('content').innerHTML = html;
      document.querySelectorAll('pre code').forEach(block => {
        hljs.highlightElement(block);
      });
    });

  function setView(view) {
    const phone = document.getElementById('phone');
    phone.classList.remove('phone', 'tablet', 'desktop');
    phone.classList.add(view);

    document.querySelectorAll('.controls button').forEach(btn => {
      btn.classList.remove('active');
    });
    event.target.classList.add('active');
  }
</script>

</body>
</html>
