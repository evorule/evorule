[book]
title = "evorule Documentation"
description = "evorule rule engine: deterministic intelligence + BLAKE3 tamper-proof audit chain + an I/O loop where the application owns the scripts"
authors = ["EvoRule Project"]
language = "en"
src = "."

[build]
build-dir = "book"
create-missing = true

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/evorule/evorule"
edit-url-template = "https://github.com/evorule/evorule/edit/main/docs/{path}"
site-url = "/evorule/"
mathjax-support = false

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 20
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3
