<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23"/>
      <stop offset="100%" style="stop-color:#1a1a3e"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#00d4ff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  
  <!-- Geometric pattern - interconnected nodes -->
  <g stroke="#00d4ff" stroke-width="1" fill="none" opacity="0.3">
    <!-- Horizontal lines -->
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <!-- Vertical lines -->
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
  </g>
  
  <!-- Accent line -->
  <line x1="100" y1="350" x2="1100" y2="350" stroke="url(#lineGrad)" stroke-width="2" opacity="0.5"/>
  
  <!-- Nodes representing rules -->
  <g fill="#00d4ff" filter="url(#glow)">
    <circle cx="150" cy="200" r="4"/>
    <circle cx="350" cy="200" r="4"/>
    <circle cx="550" cy="200" r="6"/>
    <circle cx="750" cy="200" r="4"/>
    <circle cx="950" cy="200" r="4"/>
    <circle cx="250" cy="100" r="3"/>
    <circle cx="450" cy="100" r="3"/>
    <circle cx="650" cy="100" r="3"/>
    <circle cx="850" cy="100" r="3"/>
    <circle cx="250" cy="300" r="3"/>
    <circle cx="450" cy="300" r="3"/>
    <circle cx="650" cy="300" r="3"/>
    <circle cx="850" cy="300" r="3"/>
  </g>
  
  <!-- Connecting lines between nodes -->
  <g stroke="#00d4ff" stroke-width="1" opacity="0.5" fill="none">
    <line x1="150" y1="200" x2="350" y2="200"/>
    <line x1="350" y1="200" x2="550" y2="200"/>
    <line x1="550" y1="200" x2="750" y2="200"/>
    <line x1="750" y1="200" x2="950" y2="200"/>
    <line x1="250" y1="100" x2="350" y2="200"/>
    <line x1="450" y1="100" x2="550" y2="200"/>
    <line x1="650" y1="100" x2="550" y2="200"/>
    <line x1="850" y1="100" x2="750" y2="200"/>
    <line x1="250" y1="300" x2="350" y2="200"/>
    <line x1="450" y1="300" x2="550" y2="200"/>
    <line x1="650" y1="300" x2="550" y2="200"/>
    <line x1="850" y1="300" x2="750" y2="200"/>
  </g>
  
  <!-- Main title -->
  <text x="650" y="180" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="72" font-weight="bold">EvoRule Core</text>
  
  <!-- EvoRule Logo (Golden Equals Sign) -->
  <g transform="translate(135, 20)">
    <!-- Black circle background -->
    <circle cx="50" cy="50" r="45" fill="#000000" stroke="#FFD700" stroke-width="2"/>
    <!-- Golden equals sign -->
    <rect x="25" y="38" width="50" height="6" fill="#FFD700" rx="1"/>
    <rect x="25" y="56" width="50" height="6" fill="#FFD700" rx="1"/>
  </g>
  
  <!-- Subtitle -->
  <text x="650" y="240" text-anchor="middle" fill="#00d4ff" font-family="Arial, sans-serif" font-size="28" font-weight="normal">规则互联网的基础</text>
  
  <!-- Tagline -->
  <text x="650" y="290" text-anchor="middle" fill="#888888" font-family="Arial, sans-serif" font-size="18">一个规则原生、完全透明的结构化规则引擎</text>
</svg>
