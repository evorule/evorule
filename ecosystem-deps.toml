# SPDX-License-Identifier: AGPL-3.0-or-later
# EvoRule ecosystem dependency map (SSOT) — dependency follow-mechanism
# declaration face
#
# Positioning: the single registry of "who publishes what, who consumes what,
# and how they are coupled" across the ecosystem. This file is a validated
# SSOT, not documentation — drift turns CI red (validator:
# scripts/check_ecosystem_deps.py).
# Follow semantics (follow field):
#   lockstep   = an upstream release batch must be followed in the same batch
#                (naturally satisfied by groups inside the mechanism-layer
#                workspace)
#   registered = an upstream release generates a follow registration
#                (compatibility verification result + BREAKING impact surface);
#                downstream follows at its patrol cadence and does not block
#                independent upstream releases
# Coupling modes (mode field):
#   version       crates.io semver dependency (caret range; during 0.x no
#                 automatic cross-minor following)
#   git-rev       git dependency with rev pinning
#   patch         vendored patch (patches/ directory, strong lockstep coupling)
#   sibling-path  relative-path dependency on a sibling checkout (breaks on
#                 clone; convergence goal: degrade to git-rev/version)
#   build-fixture build-time solidified assets (schemas etc., guarded by a
#                 cross-repo consistency script)
#   runtime       runtime interface consumption (HTTP API / CLI protocol), not
#                 a compile-time dependency
#
# Validation: python scripts/check_ecosystem_deps.py (R1-R3 local
#                 consistency; --check-latest adds R4 publish-surface lag
#                 patrol, requires network)

[meta]
schema = 1

# ---------------------------------------------------------------------------
# Publish surface: independently versioned units in the ecosystem
# ---------------------------------------------------------------------------

[publish.evorule-core]
repos = ["evorule"]
channel = "crates.io"
crates = [
    "evorule-tcb",
    "evorule-reactor",
    "evorule-governance",
    "evorule-discipline",
    "evorule-cli",
    "evorule-eval",
]
version_ssot = "Cargo.toml [workspace.package].version"
follow_policy = "lockstep"

[publish.evorule-bundle]
repos = ["evorule-bundle"]
channel = "crates.io"
crates = ["evorule-bundle"]
follow_policy = "registered"

[publish.evorule-hash]
repos = ["evorule-hash"]
channel = "crates.io"
crates = ["evorule-hash"]
follow_policy = "registered"
note = "audit-chain canonical hash SSOT (mirrors evorule-reactor::hash byte semantics); consumers must not hand-roll blake3"

[publish.evorule-rule]
repos = ["evorule-rule"]
channel = "crates.io"
crates = ["evorule-rule"]
follow_policy = "registered"

[publish.evorule-system-rules]
repos = ["evorule-system-rules"]
channel = "repo"
crates = ["evorule-constitution"]
follow_policy = "registered"
note = "foundational constraints repo: constitution crate (git-rev controlled consumption) + schemas/ solidified Schema + migrations/signatures/acceptance"

# ---------------------------------------------------------------------------
# Intra-repo path package registry (packages referenced by sibling-path
# consumers, for the R2 reverse-completeness exemption)
# ---------------------------------------------------------------------------

[intra.evorule-server]
base = "evorule-server"
crates = [
    "evorule-auth",
    "evorule-debug-control",
    "evorule-hot-reload",
    "evorule-io-handlers",
    "evorule-metrics",
    "evorule-plugin-kit",
    "evorule-rule-loader",
    "evorule-rule-schema",
    "evorule-rule-tools",
    "evorule-semantic-invariants",
    "evorule-time-machine",
    "evorule-workspace",
    "evorule-demo-services",
    "evorule-physics-services",
    "evorule-indicator-services",
    "evorule-mechanics-services",
    "evorule-template-services",
    "evorule-browser-services",
    "evorule-inference-services",
    "evorule-geometry-services",
    "evorule-numeric-services",
    "evorule-setup",
]

# ---------------------------------------------------------------------------
# Consume surface: who depends on ecosystem packages, how, pinned to what
# ---------------------------------------------------------------------------

[consume.evorule-server]
repo = "evorule-server"
manifests = ["evorule-server/Cargo.toml"]

[[consume.evorule-server.deps]]
package = "evorule-tcb"
mode = "patch"
pinned = "0.8"
follow = "lockstep"

[[consume.evorule-server.deps]]
package = "evorule-reactor"
mode = "patch"
pinned = "0.8"
follow = "lockstep"
features = ["persistence"]

[[consume.evorule-server.deps]]
package = "evorule-governance"
mode = "patch"
pinned = "0.8"
follow = "lockstep"
features = ["persistence"]

[[consume.evorule-server.deps]]
package = "evorule-discipline"
mode = "version"
pinned = "0.8"
follow = "registered"

[[consume.evorule-server.deps]]
package = "evorule-bundle"
mode = "version"
pinned = "0.5.2"
follow = "registered"

[[consume.evorule-server.deps]]
package = "evorule-hash"
mode = "version"
pinned = "0.1.3"
follow = "registered"

[[consume.evorule-server.deps]]
package = "evorule-rule"
mode = "git-rev"
pinned = "9f85314"
follow = "registered"

[[consume.evorule-server.deps]]
package = "evorule-system-rules"
mode = "build-fixture"
pinned = "v1.0"
follow = "registered"
note = "rule_schema solidifies the three schemas/ files at build time; guarded by the cross-repo consistency script scripts/check_schema_sync.py"

[consume.evo-agent]
repo = "evo-agent"
manifests = ["Cargo.toml"]

[[consume.evo-agent.deps]]
package = "evorule-constitution"
mode = "git-rev"
pinned = "92a009a"
follow = "registered"
note = "constitution schema embedded at compile time (since 0.2.0); evolution SOP = push system-rules first, then follow up with a rev bump"

[[consume.evo-agent.deps]]
package = "evorule-bundle"
mode = "version"
pinned = "0.5.2"
follow = "registered"
note = "kept source-aligned with the evorule-server consume face; both repos upgrade in the same batch (hash byte compatibility depends on the same serialization form of the same version)"

[[consume.evo-agent.deps]]
package = "evorule-hash"
mode = "version"
pinned = "0.1.4"
follow = "registered"
note = "B-family discipline: skill registry pins hashes; same source as the evorule-bundle transitive dependency"

# Runtime consumption (not a compile dependency; follow semantics = notify on
# interface contract changes)
[runtime.evo-agent]
repo = "evo-agent"
consumes = "evorule-server HTTP API (agent orchestration layer, not a compile dependency)"

[runtime.evorule-console-cloud]
repo = "evorule-console-cloud"
consumes = "evorule-server HTTP API"

[runtime.evorule-anchor]
repo = "evorule-anchor"
consumes = "evorule-server anchor deployment face (/anchors export shares the same source as verify-anchors)"

[runtime.evorule-integration-tests]
repo = "evorule-integration-tests"
consumes = "ecosystem cross-repo integration verification (server / rule / console-cloud bring-up chains)"
