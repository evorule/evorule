# EvoRule board binary (independent of the main workspace, excluded by the
# parent Cargo.toml) — CH32V307VCT6 EVT
#
# Coverage:
# - bring-up skeleton: TLSF global allocator + RTT logs (the probe-rs +
#   defmt-rtt channel); panic-probe only supports Cortex-M, so the RISC-V
#   side's main.rs carries its own minimal panic handler (print + halt)
# - Flash WAL ring region placeholder: tail 8 pages × 4KB = 32KB
#   (0x08038000..0x08040000); the code REGION totals 224KB; the WAL region is
#   not assigned by the linker, and the Flash WAL backend accesses it at
#   fixed addresses
# - Dependency shape: ch32-metapac (PAC level, pinnable on crates.io) —
#   hand-written register bit fields for GPIO/UART; ch32-hal (full HAL) is
#   git-only and not adopted (version drift + network availability risk)
#
# Build (extended on real hardware once the board arrives; currently only a
# compile gate):
#   cargo build --release --target riscv32imac-unknown-none-elf
#   probe-rs run --chip CH32V307VCT6 target/riscv32imac-unknown-none-elf/release/evorule-board-ch32v307-evt
#
# Note: board crates do not join the main workspace (the hal dependency stays
# fully out of the main dependency graph, enforced by the CI dependency-graph
# scan gate).

[package]
name = "evorule-board-ch32v307-evt"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["EvoRule Project"]
publish = false

[dependencies]
# no_std kernel (the tlsf-alloc gate pulls in the allocator wrapper)
evorule-mcu = { path = "../../evorule-mcu", features = ["tlsf-alloc"] }
ch32-metapac = { version = "=0.1.2", features = ["ch32v307vct6", "pac"] }
riscv-rt = { version = "=0.18", features = ["memory"] }
riscv = "0.16"
defmt = "0.3"
defmt-rtt = "0.4"
