# EvoRule board binary (independent of the main workspace, excluded by the
# parent Cargo.toml) — STM32F407G-DISC1
#
# Coverage:
# - bring-up skeleton: TLSF global allocator + RTT logs + HSE 8MHz freeze
#   (the probe-rs + defmt-rtt channel)
# - Flash WAL region placeholder: sectors 0-3 (4×16KB=64KB @ 0x08000000); the
#   code REGION starts at sector 4 (memory.x); the WAL region is not assigned
#   by the linker, and the Flash WAL backend accesses it at fixed addresses
#
# Build (extended on real hardware once the board arrives; currently only a
# compile gate):
#   cargo build --release --target thumbv7em-none-eabihf
#   probe-rs run --chip STM32F407VGTx target/thumbv7em-none-eabihf/release/evorule-board-stm32f407-disc1
#
# Note: board crates do not join the main workspace (the hal dependency stays
# fully out of the main dependency graph, enforced by the CI dependency-graph
# scan gate).

[package]
name = "evorule-board-stm32f407-disc1"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["EvoRule Project"]
publish = false

[dependencies]
# no_std kernel (the tlsf-alloc gate pulls in the allocator wrapper)
evorule-mcu = { path = "../../evorule-mcu", features = ["tlsf-alloc"] }
cortex-m = "0.7"
cortex-m-rt = "0.7"
stm32f4xx-hal = { version = "=0.23.0", features = ["stm32f407"] }
defmt = "0.3"
defmt-rtt = "0.4"
panic-probe = { version = "0.3", features = ["print-defmt"] }
