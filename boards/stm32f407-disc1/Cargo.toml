# EvoRule 板级二进制（独立于主 workspace，由父 Cargo.toml exclude）——STM32F407G-DISC1
#
# 覆盖:
# - bring-up 骨架：TLSF 全局分配器 + RTT 日志 + HSE 8MHz freeze（probe-rs + defmt-rtt 通道）
# - Flash WAL 区段占位：sector0-3（4×16KB=64KB @ 0x08000000），代码 REGION 从 sector4 起
#   （memory.x），WAL 区不经链接器分配，T0.4 Flash 后端以固定地址访问
#
# 构建（板到货后 T1 使用，本批仅编译门禁）:
#   cargo build --release --target thumbv7em-none-eabihf
#   probe-rs run --chip STM32F407VGTx target/thumbv7em-none-eabihf/release/evorule-board-stm32f407-disc1
#
# 注意: 板级 crate 不进主 workspace（hal 依赖零进主依赖图，CI 依赖图扫描门执法）。

[package]
name = "evorule-board-stm32f407-disc1"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["EvoRule Project"]
publish = false

[dependencies]
# no_std 内核（tlsf-alloc 门控拉入分配器包装）
evorule-mcu = { path = "../../evorule-mcu", features = ["tlsf-alloc"] }
cortex-m = "0.7"
cortex-m-rt = "0.7"
stm32f4xx-hal = { version = "=0.23.0", features = ["stm32f407"] }
defmt = "0.3"
defmt-rtt = "0.4"
panic-probe = { version = "0.3", features = ["print-defmt"] }
