# Release workflow for EvoRule 中文版 (Gitee Go)
#
# 触发: 推送 v* tag
# 产物: Linux + Windows 二进制 (Gitee release 页附件)
#   - Linux   x86_64        (ubuntu-latest, 静态 musl)
#   - Windows x86_64        (windows-latest)
#
# 注:
# - linux-aarch64 已移除(ubuntu runner musl 交叉编 aarch64 工具链不全)
# - macOS 二进制: Gitee Go 无 macOS runner，由未来英文版仓库 (GitHub Actions) 出
#
# 设计说明:
# - Linux 用 musl 静态链接, 产出单一可执行文件
# - tag 格式: v0.3.1 / v0.3.2 等
# - 通过 Gitee OpenAPI 上传 release 资产,需要 secrets.GITEE_TOKEN (Gitee 仓库设置 → CI → Secrets)
# - 与 .github/workflows/release.yml 独立维护，零镜像
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "手动重发 release 时指定的 tag (例 v0.3.1)"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: "1.97.1"   # 与 rust-toolchain.toml 对齐

jobs:
  # ==========================================================================
  # 1. 双平台矩阵构建 (linux x86_64 + windows x86_64)
  # ==========================================================================
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runs-on: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: evorule-x86_64
            ext: ""
          - name: windows-x86_64
            runs-on: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: evorule-x86_64.exe
            ext: ".exe"
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-rust@v2
        with:
          rust-version: ${{ env.RUSTUP_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - name: 安装 musl 工具链 (Linux)
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: 构建 CLI 二进制
        run: cargo build -p evorule-cli --release --target ${{ matrix.target }} --bin evorule

      - name: 计算 SHA256
        run: |
          cd target/${{ matrix.target }}/release
          sha256sum evorule${{ matrix.ext }} > evorule${{ matrix.ext }}.sha256

      # 验证二进制真的能起 — 防止"编译过但缺入口/链接错"被当成 success
      - name: Binary sanity check
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          chmod +x evorule${{ matrix.ext }} || true
          ./evorule${{ matrix.ext }} --version || (
            echo "ERROR: binary failed to start"
            exit 1
          )

      - name: 上传构建产物 (CI artifact)
        uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/evorule${{ matrix.ext }}*

  # ==========================================================================
  # 2. 汇总发布到 Gitee Release
  # ==========================================================================
  release:
    name: release (gitee)
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: 下载所有二进制
        uses: actions/download-artifact@v3
        with:
          path: artifacts
          merge-multiple: true

      - name: 校验产物存在
        run: |
          ls -la artifacts/
          test -f artifacts/evorule-x86_64
          test -f artifacts/evorule-x86_64.exe

      - name: 上传到 Gitee Release (OpenAPI)
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -e
          TAG="${GITEE_TAG}"
          REPO="${GITEE_REPO}"
          if [ -z "$TAG" ] || [ -z "$REPO" ]; then
            echo "ERROR: GITEE_TAG or GITEE_REPO not set"
            exit 1
          fi
          echo "Releasing ${TAG} to Gitee repo ${REPO}"

          # 1. 创建 release (如果已存在则跳过, 取已有 release id)
          RELEASE_RESP=$(curl --retry 3 --retry-delay 5 --retry-connrefused -fsS -X POST \
            "https://gitee.com/api/v5/repos/${REPO}/releases" \
            -H "Content-Type: application/json" \
            -H "Authorization: token ${GITEE_TOKEN}" \
            -d "{\"tag_name\":\"${TAG}\",\"name\":\"EvoRule ${TAG}\",\"body\":\"EvoRule 中文版 ${TAG} — 详见 CHANGELOG.md\"}" \
            || echo "")

          RELEASE_ID=$(echo "${RELEASE_RESP}" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('id',''))" 2>/dev/null || echo "")

          # 2. 若创建失败 (例如 release 已存在), 查询已有 release
          if [ -z "$RELEASE_ID" ]; then
            echo "Release may already exist, looking up existing release..."
            RELEASE_RESP=$(curl --retry 3 --retry-delay 5 --retry-connrefused -fsS \
              "https://gitee.com/api/v5/repos/${REPO}/releases/${TAG}" \
              -H "Authorization: token ${GITEE_TOKEN}")
            RELEASE_ID=$(echo "${RELEASE_RESP}" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('id',''))")
          fi

          if [ -z "$RELEASE_ID" ]; then
            echo "ERROR: Could not get release id for ${TAG}"
            echo "Response: ${RELEASE_RESP}"
            exit 1
          fi

          echo "Release id: ${RELEASE_ID}"

          # 3. 上传所有 artifact (含 sha256)
          for f in artifacts/*; do
            echo "Uploading $f"
            curl --retry 3 --retry-delay 5 --retry-connrefused -fsS -X POST \
              "https://gitee.com/api/v5/repos/${REPO}/releases/${RELEASE_ID}/attach_files" \
              -H "Authorization: token ${GITEE_TOKEN}" \
              -F "file=@${f}"
            echo ""
          done

          echo ""
          echo "Release ${TAG} uploaded: https://gitee.com/${REPO}/releases/${TAG}"
