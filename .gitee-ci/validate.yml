# Gitee Go pipeline for EvoRule
# 依据 VERSION_STRATEGY.md 自动校验
# 触发条件: 改版本相关文件
#
# 本地等价命令: pwsh scripts/validate-all.ps1

stages:
  - validate
  - tla-check

variables:
  GIT_DEPTH: "20"

# 1. PR 阶段: 改任何版本/许可证/CHANGELOG/文档 都跑
validate-pr:
  stage: validate
  image: mcr.microsoft.com/powershell:lts-nanoserver-1809
  script:
    # 版本 + CHANGELOG + LICENSE + Cargo.lock 四件套（VERSION_STRATEGY 基线）
    - pwsh -NoProfile -File scripts/validate-version.ps1
    - pwsh -NoProfile -File scripts/validate-changelog.ps1
    - pwsh -NoProfile -File scripts/validate-license.ps1
    - pwsh -NoProfile -File scripts/validate-cargolock.ps1
    # 文档安全 + 引用完整性 + 基调合规（各仓独立发布 · 强阻塞）
    # 7 类检查：R-门控1 staged文档泄露 / R3 L1私有路径泄露 / L1不提L2L3 / R-兄弟仓零谈论 / R-agent身份零泄露 / 交叉引用完整性 / DOCS_INDEX索引存在性
    # 任何 FAIL 立即阻断 PR；若属误报在 check_doc_safety.py 的白名单常量中追加例外。
    - python3 --version || python --version
    - python scripts/check_doc_safety.py --skip-git
  rules:
    - changes:
        - Cargo.toml
        - "**/Cargo.toml"
        - "**/package.json"
        - "**/pyproject.toml"
        - "**/CHANGELOG.md"
        - "**/LICENSE"
        - "evorule-tcb/core_eval.json"
        - "scripts/**"
        - "VERSION_STRATEGY.md"
        # 任何 L1 文档改动都触发文档安全检查
        - "*.md"
        - "docs/**/*"

# 1b. PR 阶段: Rust 代码/元数据改动 → fmt + clippy 强门禁（B-9 release-blocker · 0 warnings）
# 与 GitHub Actions ci.yml 的 lint job 语义对齐；image 用 rust:latest（含完整 cargo/rustc 工具链）
# 任何 FAIL 立即阻断 PR；allow_failure: false 保证不降级
lint-pr:
  stage: validate
  image: rust:latest
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
    CARGO_TERM_COLOR: always
  cache:
    - key: cargo-gitee-lint
      paths:
        - .cargo/
        - target/
  before_script:
    - rustup component add clippy rustfmt
    - cargo --version
    - rustc --version
    - cargo clippy --version
  script:
    # 1. 格式检查；任何格式不一致立即 FAIL
    - cargo fmt --all -- --check
    # 2. B-9 强门禁：clippy warnings 作为 errors（-D warnings）
    #    覆盖全部 crate + 全部 targets（lib/bin/tests/examples/benches）
    - cargo clippy --workspace --all-targets -- -D warnings
  rules:
    - changes:
        - "**/*.rs"
        - "Cargo.toml"
        - "**/Cargo.toml"
        - "Cargo.lock"
        - "rustfmt.toml"
        - ".rustfmt.toml"
        - ".clippy.toml"
        - ".gitee-ci/validate.yml"
  allow_failure: false

# 2. Tag 阶段: 推 tag 时强制跑
# 修正: 用 $CI_COMMIT_TAG 触发(原 changes: "**" 在 tag 推送时不生效)
validate-tag:
  stage: validate
  image: mcr.microsoft.com/powershell:lts-nanoserver-1809
  script:
    - pwsh -NoProfile -File scripts/validate-all.ps1
  rules:
    - if: "$CI_COMMIT_TAG"

# 2b. Tag 阶段: 推正式 tag（vX.Y.Z）时强制跑 fmt + clippy，确保 tag 代码满足 B-9
lint-tag:
  stage: validate
  image: rust:latest
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
    CARGO_TERM_COLOR: always
  cache:
    - key: cargo-gitee-lint
      paths:
        - .cargo/
        - target/
  before_script:
    - rustup component add clippy rustfmt
  script:
    - cargo fmt --all -- --check
    - cargo clippy --workspace --all-targets -- -D warnings
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[a-z]+\.\d+)?$/'
  allow_failure: false

# 2c. PR 阶段: Rust 代码改动 → cargo test（与 GitHub Actions ci.yml test job 语义对齐）
test-pr:
  stage: validate
  image: rust:latest
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
    CARGO_TERM_COLOR: always
  cache:
    - key: cargo-gitee-test
      paths:
        - .cargo/
        - target/
  before_script:
    - rustup component add clippy rustfmt
    - cargo --version
  script:
    # 全量测试（含 build.rs L1 门禁：门禁在编译时自动执行）
    - cargo test --workspace --all-features
  rules:
    - changes:
        - "**/*.rs"
        - "Cargo.toml"
        - "**/Cargo.toml"
        - "Cargo.lock"
        - ".gitee-ci/validate.yml"
  allow_failure: false

# 2d. Tag 阶段: 推正式 tag（vX.Y.Z）时强制跑 cargo test
test-tag:
  stage: validate
  image: rust:latest
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
    CARGO_TERM_COLOR: always
  cache:
    - key: cargo-gitee-test
      paths:
        - .cargo/
        - target/
  before_script:
    - rustup component add clippy rustfmt
  script:
    - cargo test --workspace --all-features
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[a-z]+\.\d+)?$/'
  allow_failure: false

# 3. release-job (参考,可选): 实际发版时跑
# 暂不开,等 0.1.0 真正发版时再 enable
