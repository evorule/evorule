# Gitee Go pipeline for EvoRule
# 依据 VERSION_STRATEGY.md 自动校验
# 触发条件: 改版本相关文件
#
# 本地等价命令: pwsh scripts/validate-all.ps1

stages:
  - validate
  - tla-check

variables:
  GIT_DEPTH: "20"

# 1. PR 阶段: 改任何版本/许可证/CHANGELOG 都跑
validate-pr:
  stage: validate
  image: mcr.microsoft.com/powershell:lts-nanoserver-1809
  script:
    - pwsh -NoProfile -File scripts/validate-version.ps1
    - pwsh -NoProfile -File scripts/validate-changelog.ps1
    - pwsh -NoProfile -File scripts/validate-license.ps1
    - pwsh -NoProfile -File scripts/validate-cargolock.ps1
  rules:
    - changes:
        - Cargo.toml
        - "**/Cargo.toml"
        - "**/package.json"
        - "**/pyproject.toml"
        - "**/CHANGELOG.md"
        - "**/LICENSE"
        - "tier0-tcb/core_eval.json"
        - "scripts/**"
        - "VERSION_STRATEGY.md"

# 2. Tag 阶段: 推 tag 时强制跑
validate-tag:
  stage: validate
  image: mcr.microsoft.com/powershell:lts-nanoserver-1809
  script:
    - pwsh -NoProfile -File scripts/validate-all.ps1
  rules:
    - changes:
        - "**"

# 3. release-job (参考,可选): 实际发版时跑
# 暂不开,等 0.1.0 真正发版时再 enable
# release:
#   stage: release
#   image: mcr.microsoft.com/powershell:lts-nanoserver-1809
#   script:
#     - pwsh -NoProfile -File scripts/validate-all.ps1
#     - git tag "v$(grep '^version' Cargo.toml | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
#   rules:
#     - changes:
#         - "**"

# 4. TLA+ 形式式验证（Phase 1 引入，设计文档 EVORULE_FORMAL_VERTIFICATION_PLAN.md §9.3）
#    验证 tier0 execute_transition 状态机 5 个不变式
#    通过条件: TLC 报告 "Model checking completed. No error has been found."
tla-check:
  stage: tla-check
  image: openjdk:17-slim
  script:
    - cd tier0-tcb/tla
    - wget -q https://github.com/tlaplus/tlaplus/releases/latest/download/tla2tools.jar
    - java -XX:+UseParallelGC -cp tla2tools.jar tlc2.TLC -config ExecuteTransition.cfg ExecuteTransition
  rules:
    - changes:
        - tier0-tcb/tla/**/*
        - tier0-tcb/src/transition.rs
        - tier0-tcb/src/executor.rs
        - .gitee-ci/validate.yml
  allow_failure: true # Phase 1 完成后改 false
