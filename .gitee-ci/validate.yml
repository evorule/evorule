# Gitee Go pipeline for evorule (core)
# Parity with .github/workflows/ci.yml (validate/test/build) + clippy.yml (lint = fmt + clippy)
#
# Gitee Go does not support actions/checkout, so we use git clone explicitly.
# evorule 核心仓: tcb / reactor / governance / cli 同仓联调, 不发独立 crate 镜像。
#
# Rust 镜像版本: lint / test / build 三 stage 统一 `rust:1.98.1-slim`,
# 与仓库根 rust-toolchain.toml 的 `channel = "1.98.1"` 对齐, 镜像自带该版本工具链,
# rustup 无需再下载。旧值 1.97.1 对 evorule-reactor 存在稳定 ICE(report-006 R-T1),
# 不得回退。

stages:
  - validate
  - license
  - lint
  - test
  - build

variables:
  GIT_DEPTH: "20"

# === 0. 文档安全 + 版本一致性（各仓独立发布 · 强阻塞）===
validate-pr:
  stage: validate
  image: mcr.microsoft.com/powershell:lts-nanoserver-1809
  script:
    # VERSION_STRATEGY 基线五件套
    - pwsh -NoProfile -File scripts/validate-version.ps1
    - pwsh -NoProfile -File scripts/validate-changelog.ps1
    - pwsh -NoProfile -File scripts/validate-license.ps1
    - pwsh -NoProfile -File scripts/validate-cargolock.ps1
    - pwsh -NoProfile -File scripts/validate-release.ps1 -SkipTagCheck
    # 文档安全 + 引用完整性 + 基调合规（强阻塞）
    # 7 类检查：R-门控1 staged文档泄露 / R3 L1私有路径泄露 / L1不提L2L3 / R-兄弟仓零谈论 / R-agent身份零泄露 / 交叉引用完整性 / DOCS_INDEX索引存在性
    - python3 --version || python --version
    - python scripts/check_doc_safety.py --skip-git
    # i18n 双语门禁（本仓自含部分：docs 中英漂移检测；跨仓 err.* 字典对照在 GitHub CI i18n-gates 执行）
    - python scripts/check_docs_bilingual.py
    # 宪法联动门禁 [CON-R-003]：语义路径变更 → PR 描述须含「宪法联动：」标记。
    # Gitee Go 无 PR 描述环境变量标准化契约，--skip-if-no-pr 守护：
    # 取得到描述则同等阻断，取不到则 [SKIP]（强制阻断由 GitHub CI PR 事件承担）
    - python scripts/check_constitution_linkage.py --skip-if-no-pr
  rules:
    - changes:
        - Cargo.toml
        - "**/Cargo.toml"
        - "**/CHANGELOG.md"
        - "**/LICENSE"
        - "scripts/**"
        - "VERSION_STRATEGY.md"
        - "*.md"
        - "docs/**/*"
        - "evorule-tcb/**"
        - "evorule-discipline/**"

# === 1. Clippy + fmt ===
lint:
  stage: lint
  image: rust:1.98.1-slim
  script:
    - apt-get update && apt-get install -y --no-install-recommends libsqlite3-dev pkg-config git
    - cargo fmt --all -- --check
    - cargo clippy --workspace --all-targets -- -D warnings
  rules:
    - changes:
        - "**/*.rs"
        - "**/Cargo.toml"
        - "**/Cargo.lock"
        - ".gitee-ci/**"

# === 2. Rust tests ===
test:
  stage: test
  image: rust:1.98.1-slim
  script:
    - apt-get update && apt-get install -y --no-install-recommends libsqlite3-dev pkg-config git
    # 差分测试供源: agent_constitution.json 唯一实体在 evo-agent 仓
    # (differential_test.rs 候选④ = 仓根兄弟位), 单仓检出缺源必红。
    - git clone --depth 1 https://gitee.com/evorule/evo-agent.git evo-agent
    - cargo test --workspace --all-targets
  rules:
    - changes:
        - "**/*.rs"
        - "**/Cargo.toml"
        - "**/Cargo.lock"

# === 3. Release build (evorule CLI 二进制) ===
build:
  stage: build
  image: rust:1.98.1-slim
  script:
    - apt-get update && apt-get install -y --no-install-recommends libsqlite3-dev pkg-config git
    - cargo build --release --bin evorule
  artifacts:
    name: "evorule-linux-x86_64"
    paths:
      - target/release/evorule
    expire_in: 7 days
  rules:
    - changes:
        - "**/*.rs"
        - "**/Cargo.toml"
        - "**/Cargo.lock"

# === Ecosystem license gate (parity with GitHub license-gate.yml @ pinned root commit) ===
license:
  stage: license
  image: rust:1.98.1-slim
  script:
    - apt-get update && apt-get install -y --no-install-recommends curl
    # cargo-deny pinned 0.20.2 (verified against root deny.toml); fallback to cargo install on download failure
    - curl -sSfL https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz | tar xzf - -C /usr/local/bin --strip-components=1 || cargo install cargo-deny --locked --version 0.20.2
    - cargo deny check
  rules:
    - changes:
        - "**/Cargo.toml"
        - "**/Cargo.lock"
        - "deny.toml"
        - ".gitee-ci/**"
