[package]
name = "evorule-discipline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
description = "EvoRule L2 ruleset shape discipline gate — mechanism-side walk/fact annotation + kernel evaluation (discipline data SSOT in evorule-tcb)"

[dependencies]
evorule-tcb = { path = "../evorule-tcb", version = "0.13.0" }
# serde_to_tcb same-source serialization (SSOT: the JSON the gate sees is identical
# to what the kernel / WAL / auditor see — see the "consumers" section of the
# discipline.rs module docs; writing a converter in this crate is forbidden)
evorule-reactor = { path = "../evorule-reactor", version = "0.13.0", features = [
    "persistence",
] }
serde_json = "1.0" # parse the embedded discipline core_eval (tcb stays zero-dep and does not parse; the consumer owns it)

[lints]
workspace = true
