# EvoRule fuzz workspace (independent of the main workspace, excluded by the parent Cargo.toml)
#
# Coverage:
# - fuzz_resolve_path:        path.rs path-string resolution (resolve_path / resolve_path_mut) — the main attack-surface target
# - fuzz_json_display:        JsonValue edge-case construction → Display serialization (hunting ground for panics / deep recursion)
# - fuzz_stable_json_hash:    audit-chain stable serialization + fact hashing (canonical-form idempotence / determinism, pure-function surface)
# - fuzz_wal_parse_roundtrip: WAL record parsing + Fact persistence roundtrip (Cursor input, zero file IO)
# - fuzz_chain_invariants:    audit-chain chaining properties (chain decomposition / single-record sensitivity / genesis, pure-function surface)
#
# Run (local smoke):
#   Linux/macOS:  RUSTUP_TOOLCHAIN=nightly-2025-11-21 cargo fuzz run fuzz-resolve-path --target x86_64-unknown-linux-gnu -- -max_total_time=30
#     (--target pins the host triple explicitly: cargo-fuzz 0.14+ defaults to the musl static target on Linux, which is incompatible with sanitizers)
#   Windows extra: add the MSVC ASAN DLL directory to PATH, otherwise STATUS_DLL_NOT_FOUND is raised:
#     $env:PATH = 'C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Tools\MSVC\<ver>\bin\Hostx64\x64;' + $env:PATH
# CI: .github/workflows/fuzz.yml (60s smoke per target)
#
# Corpus convention: the corpus/ directory is ignored by default (libFuzzer
# self-learned corpora stay out of the repo to prevent bloat); files with the
# seed_* prefix are deliberately maintained structural seeds (covering key
# protocol shapes) and are committed via git add -f.
# Side-effect discipline (highest principle): only read-only pure-function
# APIs are called. The three audit-chain targets depend on evorule-audit-chain
# (a no_std pure-algorithm crate) and on the pure parsing/serialization
# functions of evorule-reactor (parse_wal_records takes a BufRead input; the
# fuzz side wraps it in a Cursor, zero filesystem).
# Forbidden list: WalWriter / FactsLog::recover* / with_wal* and every other
# write path or state mounting.

[package]
name = "evorule-fuzz"
version = "0.0.1"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
evorule-tcb = { path = "../evorule-tcb" }
evorule-audit-chain = { path = "../evorule-audit-chain" }
evorule-reactor = { path = "../evorule-reactor", features = ["persistence"] }
serde_json = "1"

[[bin]]
name = "fuzz-resolve-path"
path = "fuzz_targets/fuzz_resolve_path.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz-json-display"
path = "fuzz_targets/fuzz_json_display.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz-stable-json-hash"
path = "fuzz_targets/fuzz_stable_json_hash.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz-wal-parse-roundtrip"
path = "fuzz_targets/fuzz_wal_parse_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz-chain-invariants"
path = "fuzz_targets/fuzz_chain_invariants.rs"
test = false
doc = false
bench = false
