# cargo-mutants configuration (shared by mutants.yml CI and local scans)
#
# Exclusions are mutations that are "unreachable from the test surface", not
# test blind spots:
#
# 1. cfg(kani)-gated code (KaniMap / JsonValue no-op Drop / null_ref):
#    a plain cargo test build contains no cfg(kani) code, so the mutant is
#    not compiled either and behaves byte-for-byte like the baseline —
#    cargo-mutants misreports it as MISSED. The "tests" for this code are
#    Kani formal verification (CBMC property assertions), not this gate's job.
#
# 2. transition.rs:373 silent-failure direct-rule branch `rule_type ==
#    instruction_type`, `==` → `!=`: that branch requires a rule with no
#    params and type ∈ {set, increment, decrement, branch}, but the executor
#    dispatch only recognizes the 5 meta-instruction types
#    (set/push/branch/io_request/enforce); a params-less set/branch fails at
#    the exec layer with a missing-field error, and increment/decrement are
#    user instruction types reported as UnknownMetaInstruction — any rule
#    that reaches the match detection through the execution stage must carry
#    a params object (entering the domain branch). The branch is unreachable
#    ⇒ the mutation is an equivalent mutant that behavioral tests cannot kill
#    mathematically. The reachability contract is pinned by the sentinel
#    transition.rs::tests::test_bare_direct_rules_fail_before_match_detection;
#    if the executor ever relaxes, the sentinel goes red, at which point add
#    match/no-match behavioral tests and drop this exclusion.
exclude_re = [
  "KaniMap",
  "<impl Drop for JsonValue>",
  "null_ref",
  "transition\\.rs:373:34: replace == with != in execute_transition",
]
