[package]
name = "evid-verify-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
readme.workspace = true
description = "EVID mobile verifier wasm binding: extern \"C\" byte ABI (install-free primary artifact) + wasm-bindgen binding surface (feature bindgen)"
rust-version = "1.81"

# Dual routes: cdylib (extern "C" byte ABI, zero imports zero JS glue, the
# single-file HTML verifier's primary artifact) + rlib (host-side handler
# tests); the bindgen feature is what compiles the wasm-bindgen binding
# surface — route A artifacts keep zero imports, ready for a plain
# WebAssembly.instantiate (wasm-bindgen attaches host imports into the module,
# polluting install-free instantiation).
[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
bindgen = ["dep:wasm-bindgen"]

[dependencies]
evid-verify-core = { path = "../evid-verify-core", version = "0.13.0" }
serde_json = "1"
wasm-bindgen = { version = "0.2", optional = true }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
ed25519-dalek = "2.2"
evorule-audit-chain = { path = "../evorule-audit-chain", version = "0.13.0" }

[lints]
workspace = true
