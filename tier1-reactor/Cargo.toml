[package]
name = "tier1-reactor"
version = "0.1.0"
edition = "2021"
description = "TheEquation 反应式执行器 - 事实驱动的状态转换引擎"
license = "AGPL-3.0"
repository = "https://github.com/evorule/tier1-reactor"

[dependencies]
tier0-tcb = { path = "../tier0-tcb" }
tokio = { version = "1.0", features = ["sync", "rt", "rt-multi-thread", "time", "macros"] }
tracing = "0.1"
serde_json = "1.0"                                             # P0-1: WAL 持久化序列化（Fact ↔ JSON）

[lib]
crate-type = ["lib", "cdylib"]

[features]
# 阶段7：Kani 形式化验证
#
# 启用后可通过 `cargo kani -p tier1-reactor --features kani` 运行形式化验证。
# 当前为准备阶段，仅提供证明框架与桩，证明内容在后续阶段逐步完善。
kani = []
# 阶段9：C FFI 接口
#
# 启用后编译生成动态链接库，暴露 C API 供外部语言调用。
# 使用 `cargo build --features ffi --release` 构建。
ffi = []

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }
