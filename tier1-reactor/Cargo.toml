[package]
name = "tier1-reactor"
version = "6.0.0"
edition = "2021"
description = "TheEquation 反应式执行器 - 事实驱动的状态转换引擎"
license = "MIT OR Apache-2.0"
repository = "https://github.com/evorule/tier1-reactor"

[dependencies]
tier0-tcb = { path = "../tier0-tcb" }
tokio = { version = "1.0", features = ["sync", "rt", "time"] }
tracing = "0.1"
serde_json = "1.0"                                             # P0-1: WAL 持久化序列化（Fact ↔ JSON）

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }
