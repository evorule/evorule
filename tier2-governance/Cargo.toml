[package]
name = "tier2-governance"
version = "0.1.0"
edition = "2021"
description = "EvoRule 治理层 - I/O 订阅者、审计链、HTTP API"
license = "AGPL-3.0-or-later"

[dependencies]
# 本地依赖
tier0-tcb = { path = "../tier0-tcb" }
tier1-reactor = { path = "../tier1-reactor" }

# 异步运行时
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "fs",
    "time",
    "signal",
] }
async-stream = "0.3"
futures-core = "0.3"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# Metrics（P2-7：prometheus 指标暴露）
prometheus = "0.13"

# I/O Handler SDK
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] } # SQLite
reqwest = { version = "0.12", features = ["json"] }                # HTTP 客户端（LLM + HTTP GET）

# 审计组件
blake3 = "1"                                              # 哈希
flate2 = { version = "1.0", features = ["rust_backend"] } # P05：审计链 gzip 压缩

# HTTP API
axum = "0.8"
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["trace", "cors", "limit", "fs"] }
tower_governor = "0.8"
# governor 直接依赖：用于在 resolve_governor_config 签名中显式指定 NoOpMiddleware 类型参数
# (tower_governor 未 pub re-export NoOpMiddleware，只能通过 governor crate 访问)
governor = "0.10"

# 安全（P1-5：恒定时间比较，防时序攻击）
subtle = "2"

# 热重载
notify = "7"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"                                 # P2-9：JSON 配置文件(v6.1 起替代 TOML)

# 错误处理
thiserror = "2"

# CLI 参数解析（仅 bin 使用）
clap = { version = "4", features = ["derive", "env"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "evorule-server"
path = "src/bin/evorule_server.rs"

# 注: evorule CLI 已迁到独立 crate D:\evorule\evorule-cli\
# 原因: tier2-governance 依赖 axum/reqwest/sqlx 等 C 依赖,无法 musl 静态编译
# CLI 只用 tier0-tcb,适合 musl 单文件分发(圈 2 合规刚需)
