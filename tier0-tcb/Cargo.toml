[package]
name = "tier0-tcb"
version = "0.1.0"
edition = "2021"
description = "EvoRule TCB Core - Zero-dependency pure computation kernel"
license = "AGPL-3.0-or-later"
repository = "https://gitee.com/evorulelab/evorule"
publish = false  # 0.1.0 仅通过 Gitee 分发,不上 crates.io

[lib]
crate-type = ["rlib"]

[dependencies]
# 零外部依赖。`no_std` 兼容，可选启用 `std` 以获得 `std::error::Error` 实现。
# Kani 验证通过 `kani cargo build` 注入 --cfg kani，无需声明 crate 依赖。

[features]
default = []
# 启用后为 TcbError 实现 std::error::Error（供 std 环境消费者使用）
std = []
# Kani 形式化验证（通过 kani 工具链注入 --cfg kani）
kani = []

[dev-dependencies]
# 单元测试 + proptest (属性测试, 用于补充 random fuzz-style 覆盖)
proptest = "1.4"

[lints.rust]
# kani cfg 由 kani 工具链注入，Cargo 不识别，显式声明以抑制 warning
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[package.metadata.kani]
proofs = [
    "verify_value_roundtrip",
    "verify_path_no_panic",
    "verify_set_integer_safety",
    "verify_set_sub_safety",
    "verify_transition_bounded",
]
