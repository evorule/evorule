[package]
name = "evorule-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "EvoRule CLI - Local JSON rule executor for compliance-critical users (zero network, zero telemetry, musl static)"
readme = "README.md"
documentation = "https://docs.rs/evorule-cli"
# L0 compliance-kernel positioning: zero network, zero telemetry, purely local execution. Aimed at government/defense/medical/finance/legal compliance-critical scenarios
# For remote HTTP API interaction see the separate evorule-server repo
# For application-layer tooling (rule scaffolding / dashboards etc.) see the evorule-application repo
keywords = ["cli", "deterministic", "audit", "compliance", "rules-engine"]
categories = [
    "command-line-utilities",
    "config",
    "data-structures",
    "development-tools",
]
exclude = [
    "build-musl.sh",      # musl build script (development use)
    "check-musl.sh",      # musl verification script
    "run_kani.sh",        # Kani verification script (dev-only)
    "verify.sh",          # version verification script
    "tests/",             # e2e test scripts (including fixtures; downstream does not need them)
    "examples/README.md", # now a migration note (minimal mechanism-layer sample, not packaged)
    "CLI_SPEC.md",        # in-repo design document
    "**/*.log",           # runtime logs
]

[[bin]]
name = "evorule"     # user-friendly name (not the package name evorule-cli)
path = "src/main.rs"


[lints]
workspace = true
[dependencies]
# Core: evorule-tcb (pure-function execute_transition) + evorule-reactor (Fact/FactId/IoType/wal serialization/hash chain)
#
# Dependency scope decisions:
# - evorule-reactor pulls tokio + blake3 + serde_json (all pure Rust), musl statically linkable
# - evorule-governance, though it has already shed application-layer dependencies, is not included:
#   the CLI currently needs only tier0+tier1 functionality
# - the CLI's main execution path is synchronous (execute_transition is a pure function);
#   tokio is used only for reactor spawn + WAL flush
# - the persistence feature enables WAL read/write (including hash chain verification);
#   serde_json/blake3 are both pure Rust, musl-compatible
evorule-tcb = { path = "../evorule-tcb", version = "0.13.0" }
evorule-reactor = { path = "../evorule-reactor", version = "0.13.0", features = [
    "persistence",
] }
# L2 discipline gate decision engine (mechanism extracted from the CLI, sharing one SSOT with evorule-server)
evorule-discipline = { path = "../evorule-discipline", version = "0.13.0" }
# Host compiler (compile-evopack): reuses the evorule-mcu canonical encoding path
# (wire format + postcard, pure Rust, musl statically linkable), dual to the MCU
# no_std kernel loading side
evorule-mcu = { path = "../evorule-mcu", version = "0.13.0" }

# CLI essentials (all pure Rust)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
thiserror = "2"

# Hash chain verification (verify-chain calls blake3 directly to verify stored hashes)
blake3 = "1"

# G-A1: audit anchor signing (anchor-keygen / verify-anchors). ed25519 (RFC 8032) deterministic signatures, no RNG
ed25519-dalek = "2"
# G-A1: key generation only (one-time ops) uses the OS entropy source; never enters the deterministic execution path
getrandom = { version = "0.2", features = ["std"] }

# Tracing (optional but useful for the user to see what evorule is doing)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Note: profiles are configured centrally in the workspace root Cargo.toml
# evorule-cli does not redeclare them, avoiding the "profiles for the non root package will be ignored" warning

# musl static link target: cargo build --release --target x86_64-unknown-linux-musl
