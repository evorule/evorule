# cargo-deny configuration (dependency supply-chain gate: license compliance
# + CVE advisories + duplicate dependencies)
#
# Run: cargo deny check (CI: ci.yml deny job, EmbarkStudios/cargo-deny-action@v2)
# Principle: evorule-tcb is zero-dependency (not constrained by this file);
# the dependencies of the other crates must be license-compatible with
# AGPL-3.0-or-later. When a new dependency introduces a new license, register
# it here explicitly with a rationale.

[graph]
all-features = true

# ---------------------------------------------------------------------------
# License compliance: AGPL-3.0-or-later (this project) + common permissive
# licenses (dependencies)
# ---------------------------------------------------------------------------
[licenses]
version = 2
allow = [
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "Unlicense",
    "BSL-1.0",
    "NCSA",
    "CDLA-Permissive-2.0",
    "BlueOak-1.0.0",
    "OFL-1.1",
]
confidence-threshold = 0.93
# Added by the 2026-10-24 ecosystem-wide license audit (13 active repos /
# 2613 dependency records); rationale per entry:
#   MIT-0              borrow-or-share (server), @csstools/* (agent/console-cloud)
#                      — the zero-attribution variant of MIT, weaker obligations.
#   BSD-1-Clause       fiat-crypto (OR branch) — a more permissive BSD variant.
#   0BSD / Unlicense   purely permissive / public-domain contributions, no
#                      additional obligations.
#   BSL-1.0            clipboard-win, error-code (agent) — Boost permissive license.
#   NCSA               libfuzzer-sys (agent, dev dependency): the expression is
#                      (MIT OR Apache-2.0) AND NCSA; NCSA is a mandatory AND term
#                      that cannot be avoided via the OR branch, so it must be
#                      registered explicitly.
#   CDLA-Permissive-2.0 webpki-roots / webpki-root-certs (server, agent) —
#                      single license (no OR alternative); without registration
#                      cargo-deny goes red.
#   BlueOak-1.0.0     lru-cache (agent) — permissive but not OSI-approved;
#                      treated as a permissive license.
#   OFL-1.1            font license (no font dependency in the ecosystem today;
#                      registered for readiness).
# Note: LGPL-2.1-or-later is not registered — the expressions of r-efi and 10
#   others are all "MIT OR Apache-2.0 OR LGPL-2.1-or-later"; the ecosystem
#   uniformly selects the MIT/Apache branch, which does not trigger LGPL's
#   dynamic-linking and replaceability requirements; not allowing LGPL as a
#   whole is intentional.
# Full text archived under LICENSES/third-party/; master declaration in
# THIRD-PARTY-NOTICES.md.

# ---------------------------------------------------------------------------
# Security advisories: RUSTSEC database; vulnerabilities denied by default,
# yanked only warns (to avoid historical noise)
# ---------------------------------------------------------------------------
[advisories]
version = 2
yanked = "warn"
# deprecated bare-metal archive (RUSTSEC-2026-0110, unmaintained): a
# transitive dependency of the cortex-m 0.7 ecosystem with no security-upgrade
# path (the official migration guide, critical-section, belongs to the cortex-m
# major-version migration); currently introduced only by the evorule-mcu
# emulation firmware dev/example chain, not a production-service face — exempt.
ignore = ["RUSTSEC-2026-0110"]

# ---------------------------------------------------------------------------
# Dependencies: duplicate-version warnings; wildcard dependencies denied
# ---------------------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "deny"

# ---------------------------------------------------------------------------
# Sources: only crates.io allowed
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
