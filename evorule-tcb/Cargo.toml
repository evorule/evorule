[package]
name = "evorule-tcb"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "EvoRule TCB Core - pure computation kernel, zero dependencies, deterministic state transitions"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/evorule-tcb"
readme = "README.md"
keywords = ["tcb", "deterministic", "state-machine", "no-std"]
categories = ["no-std", "data-structures"]
# Exclude dev artifacts / verification scripts when publishing to crates.io (downstream dependency consumers don't need them)
# Aligned with the evorule-reactor / evorule-governance style
exclude = [
    "verification/",          # Kani formal verification + differential test sources (dev-only)
    "benches/",               # Criterion performance benchmark sources (dev-only)
    "scripts/",               # Kani verification scripts (dev-only)
    "rust-toolchain.toml",    # Dev toolchain pinning
    "**/*.log",               # Various runtime logs
    "install_log.txt",        # Tool installation log
]

[dependencies]
# No external dependencies (#![no_std] compatible)
# alloc provided by the Rust standard library

[dev-dependencies]
# Deterministic property testing: verify "same input → same output" under random inputs
# Dev-only dependency; not part of published artifacts (isolated from the zero-dependency core)
proptest = "1.4"
# Performance benchmarks
criterion = { version = "0.5", features = ["html_reports"] }

[features]
default = ["std"]
# std feature: enables standard library support (for tests and error handling)
std = []

# lints uniformly inherited from workspace (four-repo lint unification consolidation): the old
# local [lints.rust]/[lints.clippy] matched the workspace definitions value-for-value but were
# maintained in duplicate, once making the "four-repo unified inheritance" documentation claim
# false. Single source of truth = root Cargo.toml [workspace.lints]; the other three repos do
# the same.
[lints]
workspace = true

[[bench]]
name = "tcb_core"
harness = false
