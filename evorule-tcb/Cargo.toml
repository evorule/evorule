[package]
name = "evorule-tcb"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "EvoRule TCB Core - 纯计算内核，零依赖，确定性状态转换"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/evorule-tcb"
readme = "README.md"
keywords = ["tcb", "deterministic", "state-machine", "no-std"]
categories = ["no-std", "data-structures"]
# 发布到 crates.io 时排除开发产物/验证脚本（下游依赖消费者不需要）
# 与 evorule-reactor / evorule-governance 风格对齐
exclude = [
    "verification/",          # Kani 形式化验证 + 差分测试源码 (dev-only)
    "benches/",               # Criterion 性能基准源码 (dev-only)
    "scripts/",               # Kani 验证脚本 (dev-only)
    "rust-toolchain.toml",    # 开发工具链固定
    "**/*.log",               # 各类运行日志
    "install_log.txt",        # 工具安装日志
]

[dependencies]
# 无外部依赖（#![no_std] 兼容）
# alloc 由 Rust 标准库提供

[dev-dependencies]
# 确定性属性测试：随机输入下验证「相同输入 → 相同输出」
# 仅 dev 依赖，不进入发布产物（与零依赖核心隔离）
proptest = "1.4"
# 性能基准测试
criterion = { version = "0.5", features = ["html_reports"] }

[features]
default = ["std"]
# std 特性：启用标准库支持（用于测试和错误处理）
std = []

[lints.rust]
# kani cfg 由 kani 工具链注入，Cargo 不识别，显式声明以抑制 warning
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[lints.clippy]
# G1: panic-prone（build.rs L1 已守，clippy L2 双保险）
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
# F7/F8: 嵌套复杂度
cognitive_complexity = { level = "warn", priority = -1 }
# F9: 函数长度
too_many_lines = { level = "warn", priority = -1 }
# F10 部分: 类型复杂度
type_complexity = { level = "warn", priority = -1 }
# F6 部分: 模块导入图
module_inception = "warn"
# 通用代码质量（warn 级，不阻断 CI）
all = { level = "warn", priority = -1 }

[[bench]]
name = "tcb_core"
harness = false
