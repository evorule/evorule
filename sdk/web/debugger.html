<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evorule 可视化调试器</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0d1117; color: #c9d1d9; }
        .header { background: #161b22; padding: 1rem 2rem; border-bottom: 1px solid #30363d; }
        .header h1 { font-size: 1.5rem; font-weight: 600; }
        .header .api-url { margin-top: 0.5rem; display: flex; gap: 0.5rem; }
        .header input { flex: 1; max-width: 500px; padding: 0.5rem; background: #21262d; border: 1px solid #30363d; border-radius: 6px; color: #c9d1d9; }
        .header button { padding: 0.5rem 1rem; background: #238636; border: none; border-radius: 6px; color: white; cursor: pointer; }
        .header button:hover { background: #2ea043; }
        .main { display: flex; height: calc(100vh - 80px); }
        .sidebar { width: 300px; background: #161b22; border-right: 1px solid #30363d; padding: 1rem; overflow-y: auto; }
        .sidebar h2 { font-size: 1rem; margin-bottom: 1rem; color: #8b949e; }
        .session-list { list-style: none; }
        .session-item { padding: 0.75rem; margin-bottom: 0.5rem; background: #21262d; border-radius: 6px; cursor: pointer; }
        .session-item:hover { background: #30363d; }
        .session-item.active { border-left: 3px solid #58a6ff; }
        .session-item .id { font-weight: 600; color: #58a6ff; }
        .session-item .phase { font-size: 0.875rem; color: #8b949e; margin-top: 0.25rem; }
        .content { flex: 1; padding: 1rem; overflow-y: auto; }
        .tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; border-bottom: 1px solid #30363d; }
        .tab { padding: 0.5rem 1rem; border-bottom: 2px solid transparent; cursor: pointer; color: #8b949e; }
        .tab.active { border-bottom-color: #58a6ff; color: #c9d1d9; }
        .panel { display: none; }
        .panel.active { display: block; }
        .timeline { position: relative; padding-left: 3rem; }
        .timeline::before { content: ''; position: absolute; left: 0.75rem; top: 0; bottom: 0; width: 2px; background: #30363d; }
        .timeline-item { position: relative; margin-bottom: 1rem; padding: 1rem; background: #21262d; border-radius: 6px; }
        .timeline-item::before { content: ''; position: absolute; left: -2.25rem; top: 1rem; width: 12px; height: 12px; border-radius: 50%; background: #58a6ff; border: 2px solid #0d1117; }
        .timeline-item.command::before { background: #a371f7; }
        .timeline-item.state-transition::before { background: #3fb950; }
        .timeline-item.io-request::before { background: #d29922; }
        .timeline-item.io-response::before { background: #3fb950; }
        .timeline-item.stable::before { background: #58a6ff; }
        .timeline-item.error::before { background: #f85149; }
        .timeline-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
        .timeline-type { font-weight: 600; text-transform: uppercase; font-size: 0.875rem; }
        .timeline-version { font-size: 0.875rem; color: #8b949e; }
        .timeline-content { font-family: monospace; font-size: 0.875rem; white-space: pre-wrap; word-break: break-all; }
        .rewind-controls { margin-bottom: 1rem; display: flex; gap: 0.5rem; align-items: center; }
        .rewind-controls select { padding: 0.5rem; background: #21262d; border: 1px solid #30363d; border-radius: 6px; color: #c9d1d9; }
        .rewind-controls button { padding: 0.5rem 1rem; background: #d29922; border: none; border-radius: 6px; color: white; cursor: pointer; }
        .rewind-controls button:hover { background: #e3b341; }
        .diff-view { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .diff-panel { padding: 1rem; background: #21262d; border-radius: 6px; }
        .diff-panel h3 { font-size: 0.875rem; color: #8b949e; margin-bottom: 0.5rem; }
        .diff-content { font-family: monospace; font-size: 0.875rem; white-space: pre-wrap; }
        .state-view { padding: 1rem; background: #21262d; border-radius: 6px; }
        .state-view h3 { font-size: 1rem; margin-bottom: 1rem; }
        .state-item { margin-bottom: 0.5rem; }
        .state-item label { display: block; font-size: 0.875rem; color: #8b949e; margin-bottom: 0.25rem; }
        .state-item pre { font-family: monospace; font-size: 0.875rem; }
        .pending-io { margin-top: 1rem; }
        .pending-io-item { padding: 0.5rem; background: #2d333b; border-radius: 4px; margin-bottom: 0.25rem; }
        .pending-io-item .type { color: #d29922; font-weight: 600; }
        .pending-io-item .duration { color: #f85149; }
        .refresh-btn { float: right; padding: 0.375rem 0.75rem; background: #30363d; border: none; border-radius: 4px; color: #c9d1d9; cursor: pointer; font-size: 0.875rem; }
        .refresh-btn:hover { background: #484f58; }
        .empty-state { text-align: center; padding: 3rem; color: #8b949e; }
        .error-message { padding: 1rem; background: #3b2d2d; border: 1px solid #f85149; border-radius: 6px; color: #f85149; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Evorule 可视化调试器</h1>
        <div class="api-url">
            <input type="text" id="apiUrl" value="http://localhost:8080" placeholder="API 服务器地址">
            <button onclick="loadSessions()">加载会话</button>
        </div>
    </div>
    <div class="main">
        <div class="sidebar">
            <h2>会话列表</h2>
            <ul class="session-list" id="sessionList"></ul>
        </div>
        <div class="content">
            <div id="emptyContent" class="empty-state">请选择一个会话查看详情</div>
            <div id="sessionContent" style="display: none;">
                <div class="tabs">
                    <div class="tab active" onclick="switchTab('timeline')">时间线</div>
                    <div class="tab" onclick="switchTab('state')">状态</div>
                    <div class="tab" onclick="switchTab('rewind')">回溯</div>
                    <div class="tab" onclick="switchTab('diff')">对比</div>
                </div>
                <div class="panel active" id="timelinePanel">
                    <button class="refresh-btn" onclick="loadTimeline()">刷新</button>
                    <div id="timelineContent"></div>
                </div>
                <div class="panel" id="statePanel">
                    <button class="refresh-btn" onclick="loadState()">刷新</button>
                    <div id="stateContent"></div>
                </div>
                <div class="panel" id="rewindPanel">
                    <div class="rewind-controls">
                        <select id="versionSelect"></select>
                        <button onclick="rewindToVersion()">回溯到此版本</button>
                    </div>
                    <div id="rewindContent"></div>
                </div>
                <div class="panel" id="diffPanel">
                    <div class="rewind-controls">
                        <select id="diffVersionA"></select>
                        <span>对比</span>
                        <select id="diffVersionB"></select>
                        <button onclick="loadDiff()">执行对比</button>
                    </div>
                    <div id="diffContent"></div>
                </div>
            </div>
        </div>
    </div>
    <script>
        let currentSessionId = null;
        let apiUrl = 'http://localhost:8080';

        function setApiUrl() {
            apiUrl = document.getElementById('apiUrl').value;
        }

        async function fetchApi(endpoint) {
            setApiUrl();
            try {
                const response = await fetch(`${apiUrl}${endpoint}`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return await response.json();
            } catch (error) {
                console.error('API 请求失败:', error);
                return null;
            }
        }

        async function loadSessions() {
            const data = await fetchApi('/api/sessions');
            const list = document.getElementById('sessionList');
            list.innerHTML = '';
            if (!data || !data.sessions) {
                list.innerHTML = '<li class="session-item">无法加载会话</li>';
                return;
            }
            data.sessions.forEach(session => {
                const li = document.createElement('li');
                li.className = 'session-item';
                li.innerHTML = `<div class="id">会话 ${session.id}</div><div class="phase">阶段: ${session.phase || 'Unknown'}</div>`;
                li.onclick = () => selectSession(session.id);
                list.appendChild(li);
            });
        }

        function selectSession(sessionId) {
            currentSessionId = sessionId;
            document.querySelectorAll('.session-item').forEach(item => item.classList.remove('active'));
            event.target.closest('.session-item').classList.add('active');
            document.getElementById('emptyContent').style.display = 'none';
            document.getElementById('sessionContent').style.display = 'block';
            loadTimeline();
            loadState();
            loadVersions();
        }

        async function loadTimeline() {
            if (!currentSessionId) return;
            const data = await fetchApi(`/api/sessions/${currentSessionId}/replay`);
            const content = document.getElementById('timelineContent');
            content.innerHTML = '';
            if (!data || !data.facts) {
                content.innerHTML = '<div class="empty-state">无法加载时间线</div>';
                return;
            }
            data.facts.forEach(fact => {
                const item = document.createElement('div');
                item.className = `timeline-item ${fact.type.toLowerCase().replace(' ', '-')}`;
                let contentHtml = '';
                if (fact.type === 'Command') {
                    contentHtml = `<div class="timeline-header"><span class="timeline-type">Command</span><span class="timeline-version">F${fact.id}</span></div>`;
                    contentHtml += `<div class="timeline-content">${JSON.stringify(fact.instruction, null, 2)}</div>`;
                } else if (fact.type === 'StateTransition') {
                    contentHtml = `<div class="timeline-header"><span class="timeline-type">StateTransition</span><span class="timeline-version">v${fact.version} | F${fact.id}</span></div>`;
                    contentHtml += `<div class="timeline-content">Payload: ${JSON.stringify(fact.new_payload, null, 2)}</div>`;
                } else if (fact.type === 'IoRequest') {
                    contentHtml = `<div class="timeline-header"><span class="timeline-type">IoRequest</span><span class="timeline-version">${fact.io_type} | F${fact.id}</span></div>`;
                    contentHtml += `<div class="timeline-content">Params: ${JSON.stringify(fact.params, null, 2)}</div>`;
                } else if (fact.type === 'IoResponse') {
                    contentHtml = `<div class="timeline-header"><span class="timeline-type">IoResponse</span><span class="timeline-version">F${fact.id} -> F${fact.request_id}</span></div>`;
                    contentHtml += `<div class="timeline-content">Result: ${JSON.stringify(fact.result, null, 2)}</div>`;
                    if (fact.error) contentHtml += `<div class="timeline-content" style="color: #f85149;">Error: ${fact.error}</div>`;
                } else if (fact.type === 'Stable') {
                    contentHtml = `<div class="timeline-header"><span class="timeline-type">Stable</span><span class="timeline-version">F${fact.id}</span></div>`;
                    contentHtml += `<div class="timeline-content">Final: ${JSON.stringify(fact.final_snapshot, null, 2)}</div>`;
                } else if (fact.type === 'Error') {
                    contentHtml = `<div class="timeline-header"><span class="timeline-type">Error</span><span class="timeline-version">F${fact.id}</span></div>`;
                    contentHtml += `<div class="timeline-content" style="color: #f85149;">${fact.message}</div>`;
                } else {
                    contentHtml = `<div class="timeline-header"><span class="timeline-type">${fact.type}</span><span class="timeline-version">F${fact.id}</span></div>`;
                    contentHtml += `<div class="timeline-content">${JSON.stringify(fact, null, 2)}</div>`;
                }
                item.innerHTML = contentHtml;
                content.appendChild(item);
            });
        }

        async function loadState() {
            if (!currentSessionId) return;
            const data = await fetchApi(`/api/sessions/${currentSessionId}/state`);
            const content = document.getElementById('stateContent');
            content.innerHTML = '';
            if (!data) {
                content.innerHTML = '<div class="empty-state">无法加载状态</div>';
                return;
            }
            const stateView = document.createElement('div');
            stateView.className = 'state-view';
            stateView.innerHTML = `<h3>会话 ${currentSessionId} 状态</h3>`;
            
            const phase = await fetchApi(`/api/sessions/${currentSessionId}/debug/phase`);
            if (phase) {
                stateView.innerHTML += `<div class="state-item"><label>阶段</label><pre>${phase.phase || 'Unknown'}</pre></div>`;
            }
            
            const queue = await fetchApi(`/api/sessions/${currentSessionId}/debug/queue`);
            if (queue) {
                stateView.innerHTML += `<div class="state-item"><label>指令队列 (${queue.queue?.length || 0})</label><pre>${JSON.stringify(queue.queue, null, 2)}</pre></div>`;
            }
            
            const pendingIo = await fetchApi(`/api/sessions/${currentSessionId}/debug/pending_io`);
            if (pendingIo && pendingIo.pending_io && pendingIo.pending_io.length > 0) {
                stateView.innerHTML += '<div class="state-item"><label>Pending I/O</label><div class="pending-io">';
                pendingIo.pending_io.forEach(io => {
                    stateView.innerHTML += `<div class="pending-io-item"><span class="type">${io.io_type}</span> - F${io.fact_id} <span class="duration">${io.duration_ms}ms</span></div>`;
                });
                stateView.innerHTML += '</div></div>';
            }
            
            if (data.payload) {
                stateView.innerHTML += `<div class="state-item"><label>Payload</label><pre>${JSON.stringify(data.payload, null, 2)}</pre></div>`;
            }
            
            content.appendChild(stateView);
        }

        async function loadVersions() {
            if (!currentSessionId) return;
            const data = await fetchApi(`/api/sessions/${currentSessionId}/history`);
            const select = document.getElementById('versionSelect');
            const selectA = document.getElementById('diffVersionA');
            const selectB = document.getElementById('diffVersionB');
            select.innerHTML = '';
            selectA.innerHTML = '';
            selectB.innerHTML = '';
            
            if (!data || !data.versions) return;
            
            data.versions.forEach(v => {
                const opt = document.createElement('option');
                opt.value = v.version;
                opt.textContent = `版本 ${v.version}`;
                select.appendChild(opt.cloneNode(true));
                selectA.appendChild(opt.cloneNode(true));
                selectB.appendChild(opt.cloneNode(true));
            });
            
            if (data.versions.length >= 2) {
                selectA.value = data.versions[data.versions.length - 2].version;
                selectB.value = data.versions[data.versions.length - 1].version;
            }
        }

        async function rewindToVersion() {
            if (!currentSessionId) return;
            const version = document.getElementById('versionSelect').value;
            const data = await fetchApi(`/api/sessions/${currentSessionId}/rewind/${version}`);
            const content = document.getElementById('rewindContent');
            content.innerHTML = '';
            if (!data) {
                content.innerHTML = '<div class="empty-state">回溯失败</div>';
                return;
            }
            content.innerHTML = `<div class="state-view"><h3>回溯到版本 ${version}</h3><div class="state-item"><label>Payload</label><pre>${JSON.stringify(data.payload, null, 2)}</pre></div><div class="state-item"><label>队列</label><pre>${JSON.stringify(data.queue, null, 2)}</pre></div></div>`;
        }

        async function loadDiff() {
            if (!currentSessionId) return;
            const v1 = document.getElementById('diffVersionA').value;
            const v2 = document.getElementById('diffVersionB').value;
            const data = await fetchApi(`/api/sessions/${currentSessionId}/diff?a=${v1}&b=${v2}`);
            const content = document.getElementById('diffContent');
            content.innerHTML = '';
            if (!data) {
                content.innerHTML = '<div class="empty-state">对比失败</div>';
                return;
            }
            content.innerHTML = `<div class="diff-view">
                <div class="diff-panel"><h3>版本 ${data.version_a ?? v1} → ${data.version_b ?? v2}</h3>
                    <div class="diff-content">
                        <h4>Added (${(data.added || []).length})</h4>
                        <pre>${JSON.stringify(data.added || [], null, 2)}</pre>
                        <h4>Removed (${(data.removed || []).length})</h4>
                        <pre>${JSON.stringify(data.removed || [], null, 2)}</pre>
                        <h4>Changed (${(data.changed || []).length})</h4>
                        <pre>${JSON.stringify(data.changed || [], null, 2)}</pre>
                    </div>
                </div>
            </div>`;
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(`${tabName}Panel`).classList.add('active');
        }

        loadSessions();
    </script>
</body>
</html>
