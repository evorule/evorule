[package]
name = "evorule-eval"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false
description = "Paper-evaluation harness: R1 replay bit-precision / R2 execution overhead / R3 audit re-verification throughput / R4 violation interception"

[dependencies]
evorule-tcb = { path = "../evorule-tcb", version = "0.13.0" }
evorule-reactor = { path = "../evorule-reactor", version = "0.13.0", features = ["persistence"] }
evorule-discipline = { path = "../evorule-discipline", version = "0.13.0" }
blake3 = "1"
serde_json = "1"

[[bin]]
name = "r1_replay"
path = "src/bin/r1_replay.rs"

[[bin]]
name = "r2_overhead"
path = "src/bin/r2_overhead.rs"

[[bin]]
name = "r3_verify"
path = "src/bin/r3_verify.rs"

[[bin]]
name = "r4_interception"
path = "src/bin/r4_interception.rs"
