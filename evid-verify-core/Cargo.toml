[package]
name = "evid-verify-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
readme.workspace = true
description = "EVID mobile audit-chain independent verification kernel: export/WAL dual-surface verdicts + anchor seal v2 signature verification (no_std)"
rust-version = "1.81"

# Hash formula discipline: fact_hash / chain_step / fact_to_stable_json all go
# through the evorule-audit-chain SSOT; this crate never hand-writes a
# fact-chain hash path. Direct blake3 use is only for the anchor payload hash
# (formula field-aligned with the server-side anchor.rs, guarded by the g5 /
# anchor vector gates). See the repo-domain exemption terms of the evorule-hash
# anti-bypass ratchet.
[dependencies]
evorule-audit-chain = { path = "../evorule-audit-chain", version = "0.13.0", default-features = false }
evorule-tcb = { path = "../evorule-tcb", version = "0.13.0", default-features = false }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
blake3 = { version = "1", default-features = false }
ed25519-dalek = { version = "2.2", default-features = false }

[lints]
workspace = true
