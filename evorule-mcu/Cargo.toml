[package]
name = "evorule-mcu"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version = "1.81" # core::error::Error requires at least 1.81 (same policy as evorule-audit-chain)
description = "EvoRule MCU no_std kernel — compact rule pack + RAM WAL + tick clock + synchronous executor"
readme = "README.md"
documentation.workspace = true
keywords = ["no-std", "embedded", "rule-engine", "audit-chain", "deterministic"]
categories = ["no-std", "embedded", "data-structures"]

[features]
# Build switch for the QEMU simulation parity examples (examples/qemu_parity):
# a required-features gate, disabled by default on the host side —
# clippy/test --all-targets never touches firmware code
qemu = []
# TLSF global allocator wrapper (src/alloc_tlsf.rs): enabled explicitly by
# board binaries and simulation examples; not pulled in by the kernel proper
# or host default builds
tlsf-alloc = ["dep:tlsf"]

[dependencies]
# no_std kernel: both tcb / audit-chain disable std defaults (the std gate
# is reserved for the std host side)
evorule-tcb = { path = "../evorule-tcb", version = "0.13.0", default-features = false }
evorule-audit-chain = { path = "../evorule-audit-chain", version = "0.13.0" }
postcard = { version = "1", default-features = false, features = ["alloc"] }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
tlsf = { version = "1.1.0", optional = true }

# Parity tests verifying byte-identical native output for the same input
# (host test builds only, never embedded targets); persistence enables the
# re-exports of MemoryWalStore / WalRecord / fact_to_json.
# Reverse-gated on the none target: embedded example builds must not pull in
# std-side dependencies
[target.'cfg(not(target_os = "none"))'.dev-dependencies]
evorule-reactor = { path = "../evorule-reactor", version = "0.13.0", features = [
    "persistence",
] }

# QEMU simulation firmware dependencies (activated only on the none target;
# zero impact on host builds)
[target.'cfg(target_os = "none")'.dev-dependencies]
cortex-m = "0.7"
cortex-m-rt = "0.7"
cortex-m-semihosting = "0.5"
panic-semihosting = "0.6"

[[example]]
name = "qemu_parity"
required-features = ["qemu", "tlsf-alloc"]

[[example]]
name = "qemu_io_resume"
required-features = ["qemu", "tlsf-alloc"]

[[example]]
name = "native_parity_tail"

[[example]]
name = "native_io_resume_tail"

[lints]
workspace = true
